            function openTaskModal(editTask = null, defaultCategory = '校内任务') {
                if (editTask && !(currentRole === 'admin' && isAdminAuthenticated)) return;

                const isEdit = !!editTask;
                const task = editTask || { name: '', daily: false, note: '', category: defaultCategory, subject: defaultCategory === '校内任务' ? '语文' : '', startDate: getBeijingDateStr(), endDate: '' };

                let subjectHtml = '';
                if (task.category === '校内任务') {
                    subjectHtml = `
                        <select id="modalTaskSubjectSelect">
                            <option value="语文" ${task.subject === '语文' ? 'selected' : ''}>语文</option>
                            <option value="数学" ${task.subject === '数学' ? 'selected' : ''}>数学</option>
                            <option value="英语" ${task.subject === '英语' ? 'selected' : ''}>英语</option>
                            <option value="其它" ${task.subject === '其它' ? 'selected' : ''}>其它</option>
                        </select>
                    `;
                } else {
                    const presets = ['口语', '新东方'];
                    const defaultVal = task.subject || '口语';
                    const isCustom = !presets.includes(defaultVal);
                    subjectHtml = `
                        <select id="modalTaskSubjectSelect" onchange="toggleCustomSubjectInput()">
                            <option value="口语" ${defaultVal === '口语' ? 'selected' : ''}>口语</option>
                            <option value="新东方" ${defaultVal === '新东方' ? 'selected' : ''}>新东方</option>
                            <option value="__custom__" ${isCustom ? 'selected' : ''}>自定义</option>
                        </select>
                        <input id="modalTaskSubjectInput" type="text" value="${isCustom ? escapeHtml(defaultVal) : ''}" placeholder="输入自定义学科" style="margin-top:8px; ${isCustom ? '' : 'display:none;'} margin-bottom:20px;" />
                    `;
                }

                showModal({
                    title: isEdit ? '编辑任务' : '新增任务',
                    contentHTML: `
                        <label>任务名称</label>
                        <input id="modalTaskName" type="text" value="${escapeHtml(task.name)}" placeholder="输入任务名称" />

                        <label>分类</label>
                        <select id="modalTaskCategory" onchange="updateSubjectOptions()" ${isEdit ? 'disabled' : ''}>
                            <option value="校内任务" ${task.category === '校内任务' ? 'selected' : ''}>校内任务</option>
                            <option value="校外任务" ${task.category === '校外任务' ? 'selected' : ''}>校外任务</option>
                        </select>

                        <label>学科</label>
                        <div id="subjectContainer">${subjectHtml}</div>
                        <div style="height:20px;"></div>

                        <div style="display:flex; gap:12px; margin-bottom:20px;">
                            <div style="flex:1;">
                                <label>开始时间</label>
                                <input id="modalTaskStartDate" type="date" value="${task.startDate}" style="margin-bottom:0;" />
                            </div>
                            <div style="flex:1;">
                                <label>结束时间(留空即当日)</label>
                                <div style="display:flex; gap:6px;">
                                    <input id="modalTaskEndDate" type="date" value="${task.endDate}" style="margin-bottom:0;" />
                                    <button type="button" class="btn-outline" onclick="document.getElementById('modalTaskEndDate').value=''" style="padding:0 12px; font-size:13px; height: 50px;">清空</button>
                                </div>
                            </div>
                        </div>

                        <label>每日重复</label>
                        <select id="modalTaskDaily">
                            <option value="false" ${!task.daily ? 'selected' : ''}>否</option>
                            <option value="true" ${task.daily ? 'selected' : ''}>是</option>
                        </select>

                        <label>备注（可选）</label>
                        <input id="modalTaskNote" type="text" value="${escapeHtml(task.note || '')}" />
                    `,
                    confirmText: '保存',
                    onConfirm: () => {
                        const name = document.getElementById('modalTaskName').value.trim();
                        const category = document.getElementById('modalTaskCategory').value;

                        let subject = '';
                        const subjectSelect = document.getElementById('modalTaskSubjectSelect');
                        if (category === '校内任务') {
                            subject = subjectSelect.value;
                        } else {
                            if (subjectSelect.value === '__custom__') {
                                const customVal = (document.getElementById('modalTaskSubjectInput') || {}).value || '';
                                subject = customVal.trim() || '其它';
                            } else {
                                subject = subjectSelect.value;
                            }
                        }

                        const startDate = document.getElementById('modalTaskStartDate').value || getBeijingDateStr();
                        const endDate = document.getElementById('modalTaskEndDate').value;
                        const daily = document.getElementById('modalTaskDaily').value === 'true';
                        const note = document.getElementById('modalTaskNote').value.trim();

                        if (!name) { alert('请输入名称'); return false; }

                        if (isEdit) {
                            const idx = state.tasks.findIndex(t => t.id === task.id);
                            if (idx !== -1) {
                                const prev = state.tasks[idx];
                                const dateChanged = prev.startDate !== startDate || (prev.endDate || '') !== (endDate || '') || !!prev.daily !== daily;
                                state.tasks[idx] = { ...prev, name, note, subject, startDate, endDate, daily };
                                if (dateChanged) {
                                    state.checkins = state.checkins.filter(c => !(c.taskId === task.id && !c.isExtra));
                                }
                            }
                        } else {
                            state.tasks.push({
                                id: 'task_' + Date.now(),
                                name, daily, note, category, subject, startDate, endDate
                            });
                        }
                        saveState();
                        renderAll();
                        showToast('保存成功');
                    }
                });
            }

            function openExtraModal(editExtra = null) {
                if (!(currentRole === 'admin' && isAdminAuthenticated)) return;
                const isEdit = !!editExtra;
                const today = getBeijingDateStr();
                const task = editExtra || { name: '', reward: 10, createdDate: today };

                showModal({
                    title: isEdit ? '编辑额外任务' : '新增额外任务',
                    contentHTML: `
                        <label>任务名称</label>
                        <input id="extraNameInput" type="text" value="${escapeHtml(task.name)}" placeholder="如：拼图奖励" />
                        <label>星值 (-50 到 50)</label>
                        <input id="extraRewardInput" type="number" min="-50" max="50" value="${task.reward}" />
                        <label>日期</label>
                        <input id="extraDateInput" type="date" value="${task.createdDate || today}" />
                    `,
                    confirmText: '保存',
                    onConfirm: () => {
                        const name = document.getElementById('extraNameInput').value.trim();
                        const reward = parseInt(document.getElementById('extraRewardInput').value, 10);
                        const date = document.getElementById('extraDateInput').value;
                        if (!name) { alert('请输入名称'); return false; }
                        if (isNaN(reward) || reward < -50 || reward > 50) { alert('星值必须在-50到50之间'); return false; }
                        if (!date) { alert('请选择日期'); return false; }

                        if (isEdit) {
                            const idx = state.extraTasks.findIndex(t => t.id === task.id);

                                state.extraTasks[idx].name = name;
                                state.extraTasks[idx].reward = reward;
                                state.extraTasks[idx].createdDate = date;
                                state.checkins.forEach(c => {
                                    if (c.taskId === task.id && c.isExtra) { c.date = date; c.reward = reward; }
                                });
                            }
                        } else {
                            state.extraTasks.push({
                                id: 'extra_' + Date.now(),
                                name: name,
                                reward: reward,
                                createdDate: date
                            });

                        saveState();
                        renderAll();
                        showToast(isEdit ? '修改成功' : '已添加额外任务');

                    }
                });
            }

                document.getElementById('btnChildMode').addEventListener('click', () => {
                    currentRole = 'child';
                    isAdminAuthenticated = false;
                    renderAll();
                });

                document.getElementById('btnAdminMode').addEventListener('click', () => {
                    if (isAdminAuthenticated && currentRole === 'admin') return;
                    showModal({
                        title: '家长验证',
                        contentHTML: `<input id="pwdInput" type="password" placeholder="请输入密码" autofocus style="text-align:center; letter-spacing:5px;" />`,
                        confirmText: '进入',
                        onConfirm: () => {
                            const pwd = document.getElementById('pwdInput').value;

                                currentRole = 'admin';
                                isAdminAuthenticated = true;
                                renderAll();

                                alert('密码错误');
                                return false;
                            }
                        }
                    });
                });

                // 刷新按钮：整页刷新，三个页面均同步
                document.getElementById('refreshBtn').addEventListener('click', () => {
                    location.reload();
                });

                document.body.addEventListener('click', (e) => {
                    if (e.target.closest('.collapse-btn')) {
                        const btn = e.target.closest('.collapse-btn');
                        const targetId = btn.dataset.target;
                        const targetEl = document.getElementById(targetId);
                        const wrapper = btn.closest('.section-wrapper');
                        if (targetEl) {
                            if (targetEl.style.display === 'none') {
                                targetEl.style.display = '';
                                btn.innerHTML = '<img src="icon_expand.svg" class="zoom-icon" style="width: 14px; height: 14px;">';
                                if (wrapper) wrapper.classList.remove('collapsed');
                            } else {
                                targetEl.style.display = 'none';
                                btn.innerHTML = '<img src="icon_collapse.svg" class="zoom-icon" style="width: 14px; height: 14px;">';
                                if (wrapper) wrapper.classList.add('collapsed');
                            }
                        }
                    }
                });

                document.body.addEventListener('change', (e) => {
                    if (e.target.matches('.exam-score-input')) {
                        const examId = e.target.dataset.examId;
                        const exam = state.exams.find(x => x.id === examId);
                        if (exam && exam.score !== null && !(currentRole === 'admin' && isAdminAuthenticated)) {
                            showToast('无法修改已录入的分数', false);
                            renderExams();
                            return;
                        }
                        let val = parseFloat(e.target.value);
                        if (e.target.value.trim() === '') {
                            val = null;
                        } else if (isNaN(val) || val < 0 || val > 100) {
                            showToast('请输入0-100的有效分数', false);
                            renderExams();
                            return;
                        }
                        if (exam) {
                            exam.score = val;
                            saveState();
                            renderAll();
                            if (val !== null) showToast(`分数已录入，获得 ${getExamStars(val)} 星`);
                        }
                    }
                });

                document.getElementById('addExamBtn').addEventListener('click', () => openExamModal(null));
                document.getElementById('addInSchoolBtn').addEventListener('click', () => openTaskModal(null, '校内任务'));
                document.getElementById('addOutSchoolBtn').addEventListener('click', () => openTaskModal(null, '校外任务'));
                document.getElementById('addExtraBtn').addEventListener('click', () => openExtraModal(null));
                document.getElementById('editProfileBtn').addEventListener('click', openProfileModal);

                document.body.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-action]');
                    if (!target) return;
                    const action = target.dataset.action;

                    if (action === 'toggle-check') {
                        toggleTaskCheck(target.dataset.taskId);
                    } else if (action === 'toggle-extra') {
                        toggleExtraCheck(target.dataset.extraId);
                    } else if (action === 'edit-task') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const task = state.tasks.find(t => t.id === target.dataset.taskId);
                            if (task) openTaskModal(task);
                        }
                    } else if (action === 'delete-task') {
                        if (currentRole === 'admin' && isAdminAuthenticated) deleteTaskConfirm(target.dataset.taskId);
                    } else if (action === 'edit-extra') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const extra = state.extraTasks.find(t => t.id === target.dataset.extraId);
                            if (extra) openExtraModal(extra);
                        }
                    } else if (action === 'delete-extra') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const extraId = target.dataset.extraId;
                            showModal({
                                title: '删除额外任务',
                                content: '确定删除吗？',
                                confirmText: '删除',
                                danger: true,
                                onConfirm: () => {
                                    state.extraTasks = state.extraTasks.filter(t => t.id !== extraId);
                                    state.checkins = state.checkins.filter(c => !(c.taskId === extraId && c.isExtra));
                                    saveState();
                                    renderAll();
                                    showToast('已删除');
                                }
                            });
                        }
                    } else if (action === 'edit-exam') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const exam = state.exams.find(x => x.id === target.dataset.examId);
                            if (exam) openExamModal(exam);
                        }
                    } else if (action === 'delete-exam') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const examId = target.dataset.examId;
                            showModal({
                                title: '删除考试',
                                content: '确定删除该考试记录吗？',
                                confirmText: '删除',
                                danger: true,
                                onConfirm: () => {
                                    state.exams = state.exams.filter(x => x.id !== examId);
                                    saveState();
                                    renderAll();
                                    showToast('已删除');
                                }
                            });
                        }
                    } else if (action === 'del-shop-item') {
                        if (currentRole === 'admin' && isAdminAuthenticated) deleteShopItem(target.dataset.shopId);
                    } else if (action === 'revoke-redeem') {
                        if (currentRole === 'admin' && isAdminAuthenticated) revokeRedeem(target.dataset.redeemId);
                    }
                });

                document.getElementById('prevMonth').addEventListener('click', () => {
                    calendarWeekStart = new Date(calendarWeekStart.getFullYear(), calendarWeekStart.getMonth(), calendarWeekStart.getDate() - 7);
                    renderCalendar();
                });
                document.getElementById('nextMonth').addEventListener('click', () => {
                    calendarWeekStart = new Date(calendarWeekStart.getFullYear(), calendarWeekStart.getMonth(), calendarWeekStart.getDate() + 7);
                    renderCalendar();
                });

                document.getElementById('addShopItemBtn').addEventListener('click', openShopItemModal);
                document.getElementById('redeemBtn').addEventListener('click', doRedeem);
                document.getElementById('clearSelBtn').addEventListener('click', doClearSelection);

                document.body.addEventListener('click', (e) => {
                    const shopItem = e.target.closest('.shop-item');
                    if (shopItem && !e.target.closest('[data-action]') && !e.target.closest('#moneyAmountInput')) {
                        toggleShopSelect(shopItem.dataset.shopId);
                    }
                });

                document.body.addEventListener('input', (e) => {
                    if (e.target.id === 'moneyAmountInput') {
                        const raw = String(e.target.value || '').replace(/[^0-9]/g, '');
                        moneyAmount = parseInt(raw, 10) || 0;
                    }
                });

                document.querySelectorAll('.bottom-btn').forEach(btn => {
                    btn.addEventListener('click', () => switchView(btn.dataset.view));
                });
            }

            function init() {
                if (!state.checkins) state.checkins = [];
                if (!state.exams) state.exams = [];
                if (!state.extraTasks) state.extraTasks = [];
                if (!state.shopItems) state.shopItems = [];
                if (!state.redemptions) state.redemptions = [];
                if (!state.archive) state.archive = { lastCleanupMonth: '', months: {} };
                if (!state.profile) state.profile = { name: 'HEIDI', avatar: '' };

                // 跨月自动清理旧数据并归档
                if (performCleanupIfNeeded()) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                }

                bindEvents();
                renderAll();

                if (supabaseClient) {
                    fetchCloudState();
                    setupRealtime();
                }
            }

            init();
        })();
    </script>
</body>
</html>
