<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HEIDI STAR">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="preload" as="image" href="decor_home.webp">
    <title>HEIDI星旅</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-page: #f5f5f5;
            --bg-card: #f7f7f7;
            --bg-wrapper: #fefefe;
            --text-main: #383b42;
            --text-sub: #b7b7b7;
            --accent: #74b0e1;
            --accent-light: #c0e2f9;
            --accent-warm: #f4c65c;
            --bg-nav: #ffffff;
            --border-light: #ebebeb;
            --radius-card: 22px;
            --radius-wrapper: 32px;
            --radius-btn: 999px;
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.03);
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'URW Gothic', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .fixed-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-page);
            z-index: -10;
            pointer-events: none;
        }

        html, body {
            overscroll-behavior-y: none;
            background-color: transparent;
            overflow-x: hidden;
        }

        body {
            position: relative;
            min-height: 100vh;
            padding: 12px 20px 100px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
        }

        .zoom-icon {
            transform: scale(2);
            transform-origin: center;
            max-width: none !important;
            object-fit: contain;
            z-index: 10;
            display: block;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--bg-nav);
            border-radius: var(--radius-btn);
            padding: 4px 10px;
            box-shadow: var(--shadow-soft);
            flex-shrink: 0;
            border: 1px solid var(--border-light);
        }

        .header-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            border: none;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: 0.3s;
        }
        .header-btn.active {
            color: var(--text-main);
            background: var(--bg-card);
        }

        .layout-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .left-panel, .right-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .section-wrapper {
            border-radius: var(--radius-wrapper);
            padding: 16px;
            margin-bottom: 0;
            transition: 0.3s;
            background-color: var(--bg-wrapper) !important;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-light);
        }
        .section-wrapper.collapsed .section-title {
            margin-bottom: 0;
        }

        .profile-stats-bar {
            display: flex;
            gap: 16px;
            align-items: stretch;
            margin-bottom: 0;
        }

        .profile-card {
            background: var(--bg-wrapper);
            border-radius: var(--radius-card);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            flex: 0 0 auto;
            min-width: 120px;
            border: 1px solid var(--border-light);
        }

        .avatar-container {
            width: 76px;
            height: 76px;
            background: var(--accent-light);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            animation: blobFloat 4s ease-in-out infinite alternate;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.05);
        }

        @keyframes blobFloat {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translateY(0); }
            100% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; transform: translateY(-5px); }
        }

        .avatar-eye {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--text-main);
            border-radius: 50%;
            top: 40%;
        }
        .avatar-eye.left { left: 25%; }
        .avatar-eye.right { right: 25%; }

        .avatar-smile {
            position: absolute;
            width: 20px;
            height: 10px;
            border-bottom: 3px solid var(--text-main);
            border-radius: 0 0 20px 20px;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
        }

        .avatar {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 28px;
            font-weight: 900;
            background-size: cover;
            background-position: center;
            z-index: 2;
        }
        .avatar[style*="url"] ~ .avatar-eye,
        .avatar[style*="url"] ~ .avatar-smile { display: none; }

        .profile-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-main);
            text-align: center;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-profile-btn {
            background: var(--bg-page);
            border: none;
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: var(--radius-btn);
            font-size: 12px;
            cursor: pointer;
            font-weight: 800;
        }

        .stats-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stats-card {
            flex: 1;
            border-radius: var(--radius-card);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }
        .stats-card.today { background: var(--accent); color: #ffffff; border-color: var(--accent); }
        .stats-card.month { background: var(--bg-wrapper); color: var(--text-main); }
        .stats-card.today .stats-number { color: #ffffff; }

        .stats-label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .stats-number {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            line-height: 1;
        }
        .stats-number img {
            display: block;
            flex-shrink: 0;
        }

        .calendar-card {
            background: linear-gradient(135deg, #71c1ff 0%, #3695e3 55%, #2678c9 100%);
            border-radius: var(--radius-card);
            padding: 20px;
            box-shadow: none;
            width: 100%;
            border: none;
        }

        .calendar-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
        }

        .calendar-header .month-label {
            font-weight: 800;
            color: #ffffff;
            font-size: 18px;
        }

        .calendar-nav-btn {
            position: absolute;
            background: transparent;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .calendar-nav-btn:hover { background: transparent; opacity: .75; }
        #prevMonth { left: 0; }
        #nextMonth { right: 0; }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,.92);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 40px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            border-radius: 50%;
            color: #ffffff;
        }

        /* 今天：白色圆圈底 + 蓝色字 */
        .calendar-day.today {
            background: #ffffff;
            color: #2678c9;
            font-weight: 900;
        }
        /* 已打卡：浅蓝底 + 蓝字（与原"今天"配色互换） */
        .calendar-day.completed {
            background: #c0e2f9;
            color: #2678c9;
            font-weight: 900;
        }
        .calendar-day.incomplete {
            background: var(--accent-warm);
            color: #ffffff;
            font-weight: 900;
        }

        /* ===== 日历历史回看 ===== */
        .calendar-day.viewable { cursor: pointer; }
        .calendar-day.viewable:hover { outline: 2px solid rgba(255,255,255,.9); outline-offset: 1px; }
        .calendar-day.viewing { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent); }
        .calendar-day.future { opacity: .45; }
        .calendar-day.none { background: transparent; }

        /* 回看时日历内返回按钮：白底、固定在右箭头左侧、仅历史时出现 */
        .history-back-btn {
            display: none; position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
            background: #ffffff; color: #2678c9; border: 1px solid #c0e2f9;
            border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 900;
            cursor: pointer; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.08);
        }
        .history-back-btn.show { display: block; }
        .history-back-btn:hover { background: #f0f8ff; }
        .history-mode .section-title .btn-outline,
        .history-mode .section-title .collapse-btn,
        .history-mode .edit-profile-btn,
        .history-mode #addExtraBtn { display: none !important; }
        .history-mode .task-check { cursor: default; }

        /* ===== 页面装饰图淡入淡出（背景固定不变，仅装饰层过渡） ===== */
        .page-decor { transition: opacity .55s ease; }
        .page-decor.decor-hidden { opacity: 0; }
        /* 裁剪舞台扩展到整个屏幕边缘（抵消 body 左右 padding），滑动时不再露出灰白细边 */
        .view-page {
            margin-left: -20px;
            margin-right: -20px;
            padding-left: 20px;
            padding-right: 20px;
            overflow-x: clip;
        }
        /* 离场页脱离文档流并叠在顶层；top/left/width 由 JS 按实际位置写入，避免跳到视口顶端 */
        .view-page.view-leaving { position: absolute; margin: 0; z-index: 2; pointer-events: none; }
        /* 图片尺寸兜底：消除加载完成前的布局跳动 */
        img.zoom-icon { display: inline-block; vertical-align: middle; }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 12px 0;
            font-weight: 800;
            color: var(--text-main);
            font-size: 21px;
            width: 100%;
        }
        .section-title .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .title-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collapse-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sub-title {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 800;
            margin: 12px 0 6px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1;
        }
        .sub-title img {
            display: block;
            flex-shrink: 0;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 4px;
            width: 100%;
        }

        .task-grid-inner {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .task-item {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-card);
            transition: 0.2s;
            width: 100%;
            border: 1px solid var(--border-light);
        }

        .task-item.completed {
            background: var(--bg-card);
            box-shadow: none;
            opacity: 0.6;
        }

        .task-item.overdue {
            background: color-mix(in srgb, var(--accent-warm) 16%, var(--bg-wrapper));
        }

        .task-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            height: 48px;
            background: transparent;
            flex-shrink: 0;
        }

        .task-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .task-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-main);
            word-break: break-word;
        }
        .task-item.completed .task-name {
            color: var(--text-sub);
            text-decoration: line-through;
        }

        .task-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: var(--border-light);
            color: var(--text-main);
            line-height: 1;
        }
        .tag-green { background: var(--accent-light); color: var(--accent); }
        .tag-purple, .tag-pink, .tag-blue { background: var(--bg-page); color: var(--text-main); }
        .tag-orange { background: color-mix(in srgb, var(--accent-warm) 30%, var(--bg-wrapper)); color: var(--text-main); }
        .tag-date { background: transparent; color: var(--text-sub); padding-left: 0; }
        .tag-today { background: var(--accent-light); color: var(--accent); }
        .tag-deadline { background: var(--border-light); color: var(--text-main); }

        .icon-repeat-small {
            width: 12px;
            height: 12px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 2px;
        }

        .task-check {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .3s ease, border-color .3s ease;
            background: var(--bg-wrapper);
            position: relative;
        }
        .task-item.completed .task-check {
            background: #3695e3;
            border-color: #3695e3;
        }
        /* --- 打勾动画 B：扁平粒子迸发 + 勾线描出；取消时反向擦除+粒子内吸+圆回灰 --- */
        .task-check svg.tick { width: 26px; height: 26px; overflow: visible; position: relative; z-index: 3; }
        .task-check svg.tick path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .task-check svg.tick .p1 { stroke-dasharray: 9;  stroke-dashoffset: 9; }
        .task-check svg.tick .p2 { stroke-dasharray: 17; stroke-dashoffset: 17; }
        .task-check .spark { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; border-radius: 50%;
                             background: #2f8ce0; opacity: 0; pointer-events: none; z-index: 2; }
        .task-item.completed .task-check svg.tick .p1 { animation: tickDraw .2s ease-out .04s forwards; }
        .task-item.completed .task-check svg.tick .p2 { animation: tickDraw .26s ease-out .18s forwards; }
        .task-item.completed .task-check .spark { animation: tickBurst .55s cubic-bezier(.2,.7,.3,1) .12s both; }
        @keyframes tickDraw { to { stroke-dashoffset: 0; } }
        @keyframes tickBurst {
            0%   { transform: translate(0,0) scale(0); opacity: 0; }
            25%  { opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; }
        }
        /* 取消勾选中间态：勾线反向擦除 + 粒子内吸 + 圆轻微收缩回灰 */
        .task-check.canceling { animation: tickUnc .34s ease-out both; }
        .task-check.canceling svg.tick .p1 { animation: tickUndraw .2s ease-out .02s both; }
        .task-check.canceling svg.tick .p2 { animation: tickUndraw .2s ease-out .1s both; }
        .task-check.canceling .spark { animation: tickImplode .3s ease-in both; }
        @keyframes tickUnc { 0% { transform: scale(1); } 45% { transform: scale(.86); } 100% { transform: scale(1); } }
        @keyframes tickUndraw { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 17; } }
        @keyframes tickImplode {
            0%   { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: .9; }
            100% { transform: translate(0,0) scale(0); opacity: 0; }
        }

        .task-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon-btn {
            background: var(--bg-wrapper);
            border: 1px solid var(--border-light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            font-size: 16px;
        }

        .overdue-badge {
            background: var(--accent-warm);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .btn-primary {
            background: var(--accent);
            border: none;
            color: var(--bg-nav);
            padding: 12px 20px;
            border-radius: var(--radius-btn);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-primary:active { transform: scale(0.96); }

        .btn-outline {
            background: var(--bg-nav);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: var(--radius-btn);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-outline:active { background: var(--bg-page); }
        .btn-sm { padding: 8px 14px; font-size: 13px; }

        .hidden { display: none !important; }

        #examTaskList { display: flex; flex-direction: column; gap: 12px; }
        .exam-item {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }
        .exam-score-input {
            width: 90px;
            padding: 8px 12px;
            border-radius: var(--radius-btn);
            border: 2px solid var(--border-light);
            text-align: center;
            font-weight: 800;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            background: var(--bg-wrapper);
            line-height: 1;
        }
        .exam-score-input:focus { border-color: var(--accent); background: var(--bg-nav); }
        .exam-stars {
            font-weight: 800;
            font-size: 14px;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1;
        }
        .exam-stars.zero { color: var(--text-sub); }
        .exam-stars img {
            display: block;
            flex-shrink: 0;
        }

        /* --- 全部打卡庆祝：拉炮彩纸 + 毛玻璃 + 庆祝卡片 --- */
        .celebrate-layer {
            position: fixed; inset: 0; z-index: 3000;
            display: none; align-items: center; justify-content: center;
            background: rgba(30, 52, 78, .16);
            -webkit-backdrop-filter: blur(9px) saturate(.9);
            backdrop-filter: blur(9px) saturate(.9);
            opacity: 0;
            transition: opacity .38s ease;
            pointer-events: none;
        }
        .celebrate-layer.open { display: flex; }
        .celebrate-layer.show { opacity: 1; pointer-events: auto; }
        .celebrate-glow {
            position: absolute; inset: 0; pointer-events: none; opacity: 0;
            background: radial-gradient(circle at 50% 82%, rgba(255,232,160,.52) 0%, rgba(255,232,160,0) 46%);
            transition: opacity .35s ease;
        }
        .celebrate-glow.on { opacity: 1; }
        #celebrateCanvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .celebrate-card {
            position: relative; z-index: 2;
            width: min(320px, 82vw);
            background: linear-gradient(180deg, #ffffff 0%, #f4faff 100%);
            border-radius: 28px;
            padding: 36px 24px 22px;
            text-align: center;

        /* 主页装饰：水平镜像并移到左下角（不改图片文件，纯 CSS 翻转）
           让图的右边缘对齐距左 5% 的位置（right:95%），再以右边缘为原点镜像放大，
           镜像后会向右展开，视觉左边界正好落在 5% 处，不会溢出屏幕外 */
        .page-decor[data-view="home"] {
            right: 95%;
            left: auto;
            transform: scale(-2, 2);
            transform-origin: bottom right;

        /* 解锁动画层：永远盖在所有区块之上 */
        .stm-anim{
            position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;
            background:radial-gradient(110% 76% at 50% 30%,rgba(24,74,124,.78),rgba(7,15,25,.94) 76%);
            -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:hidden;
        }
        .stm-anim.open{display:flex}
        .stm-anim-stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
            width:100%;height:100%;padding-bottom:12vh}
        .stm-anim-halo{position:absolute;left:50%;top:46%;width:340px;height:340px;border-radius:50%;
            transform:translate(-50%,-50%);pointer-events:none;opacity:0;
            background:radial-gradient(circle,rgba(255,255,255,.42),rgba(255,255,255,0) 62%)}
        .stm-anim.open .stm-anim-halo{animation:stmHalo 3.4s linear forwards}
        @keyframes stmHalo{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
            16%{opacity:.9;transform:translate(-50%,-50%) scale(1)}
            57%{opacity:.5;transform:translate(-50%,-50%) scale(1.05)}
            100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        const SUPABASE_URL = 'https://skgxcnnagfgwfrccwwrx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_t96OWboqHhMc4CSJLEuQXQ_TE_xIMdw';

        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_URL !== '替换为您的_SUPABASE_URL') {
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (e) {
                console.warn('云同步初始化失败，已切换为本地模式');
            }
        }

        (function() {
            const STORAGE_KEY = 'star_task_app_v1';
            const ADMIN_PASSWORD = '111';
            const MONTH_SETTLE_BONUS = 20;

            function getBeijingNow() {
                const now = new Date();
                const utc = now.getTime() + now.getTimezoneOffset() * 60000;
                return new Date(utc + 8 * 3600000);
            }
            function getBeijingDateStr() {
                const bj = getBeijingNow();
                return `${bj.getFullYear()}-${String(bj.getMonth()+1).padStart(2,'0')}-${String(bj.getDate()).padStart(2,'0')}`;
            }
            function formatDate(d) {
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            }
            function getMondayOf(date) {
                const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                const day = d.getDay();
                const diff = day === 0 ? -6 : 1 - day;
                d.setDate(d.getDate() + diff);
                return d;
            }
            function getBeijingMonthPrefix(offsetMonths = 0) {
                const bj = getBeijingNow();
                const d = new Date(bj.getFullYear(), bj.getMonth() + offsetMonths, 1);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            }
            function getSubjectIcon(subject) {
                const map = {
                    '语文': 'icon_subject_chinese.webp',
                    '数学': 'icon_subject_math.webp',
                    '英语': 'icon_subject_english.webp',
                    '其它': 'icon_subject_other.webp',
                    '口语': 'icon_subject_oral.webp',
                    '新东方': 'icon_subject_xdf.webp'
                };
                return map[subject] || 'icon_subject_custom.webp';
            }

            const defaultTasks = [
                { id: 't1', name: '习题册', reward: 0, daily: true, note: '', category: '校内任务', subject: '语文', startDate: '2026-11-01', endDate: '' },
                { id: 't2', name: '口算', reward: 0, daily: true, note: '', category: '校内任务', subject: '数学', startDate: '2026-11-01', endDate: '' },
                { id: 't3', name: '英语阅读', reward: 0, daily: true, note: '', category: '校内任务', subject: '英语', startDate: '2026-11-01', endDate: '' }
            ];

            const defaultState = {
                tasks: [...defaultTasks],
                checkins: [],
                exams: [],
                extraTasks: [],
                shopItems: [],
                redemptions: [],
                archive: { lastCleanupMonth: '', months: {} },
                profile: { name: 'HEIDI', avatar: '' },
                starman: { perfectDays: [], unlockedIds: [] }
            };

            function loadStateLocal() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        parsed.tasks = (parsed.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        if (!parsed.profile) parsed.profile = { name: 'HEIDI', avatar: '' };
                        if (!parsed.exams) parsed.exams = [];
                        if (!parsed.extraTasks) parsed.extraTasks = [];
                        if (!parsed.checkins) parsed.checkins = [];
                        if (!parsed.shopItems) parsed.shopItems = [];
                        if (!parsed.redemptions) parsed.redemptions = [];
                        if (!parsed.archive) parsed.archive = { lastCleanupMonth: '', months: {} };
                        if (!parsed.starman) parsed.starman = { perfectDays: [], unlockedIds: [] };
                        return parsed;
                    } catch (e) {}
                }
                return JSON.parse(JSON.stringify(defaultState));
            }

            let state = loadStateLocal();
            let currentRole = 'child';
            let isAdminAuthenticated = false;

            /* ===== 日历历史回看：内存状态，刷新即回到今天 ===== */
            let viewingDate = null;
            function getViewDate() { return viewingDate || getBeijingDateStr(); }
            function getViewMonthPrefix() {
                const d = new Date(getViewDate() + 'T00:00:00');
                return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
            }
            // 历史回看：家长模式也隐藏编辑/删除，只保留打星状态
            function isTaskManageReadOnly() { return !!viewingDate; }
            // 考试按自然月结算：翻开已过去的月份，编辑/删除同样隐藏
            function isSettledExamMonth() {
                return getViewMonthPrefix() < getBeijingDateStr().slice(0, 7);
            }

            const bjInit = getBeijingNow();
            let calendarWeekStart = getMondayOf(bjInit);

            let saveTimeout = null;
            let isSyncingFromCloud = false;
            let pendingLocalWrite = false;
            let pendingSince = 0;

            function hasPendingLocalWrite() {
                return pendingLocalWrite && (Date.now() - pendingSince) < 10000;
            }

            function saveState() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                if (supabaseClient && !isSyncingFromCloud) {
                    pendingLocalWrite = true;
                    pendingSince = Date.now();
                    if (saveTimeout) clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(async () => {
                        try {
                            const payload = JSON.parse(JSON.stringify(state));
                            await supabaseClient.from('app_state').upsert({ id: 1, state_data: payload, updated_at: new Date().toISOString() });
                        } catch (error) {}
                        pendingLocalWrite = false;
                    }, 800);
                }
            }

            function performCleanupIfNeeded() {
                if (!state.archive) state.archive = { lastCleanupMonth: '', months: {} };
                        if (!state.starman) state.starman = { perfectDays: [], unlockedIds: [] };
                const curMonth = getBeijingMonthPrefix(0);
                if (state.archive.lastCleanupMonth === curMonth) return false;

                const cutoff = getBeijingMonthPrefix(-2);

                const oldMonths = new Set();
                state.checkins.forEach(c => { if (c.date && c.date.slice(0,7) < cutoff) oldMonths.add(c.date.slice(0,7)); });
                state.exams.forEach(e => { if (e.date && e.date.slice(0,7) < cutoff) oldMonths.add(e.date.slice(0,7)); });
                state.extraTasks.forEach(t => { if (t.createdDate && t.createdDate.slice(0,7) < cutoff) oldMonths.add(t.createdDate.slice(0,7)); });
                state.redemptions.forEach(r => { if (r.date && r.date.slice(0,7) < cutoff) oldMonths.add(r.date.slice(0,7)); });

                oldMonths.forEach(m => {
                    if (state.archive.months[m]) return;
                    let settled = 0, hasActivity = false;
                    state.checkins.forEach(c => { if (c.isExtra && c.date && c.date.startsWith(m)) { settled += (c.reward || 0); hasActivity = true; } });
                    state.exams.forEach(e => { if (e.date && e.date.startsWith(m)) { settled += getExamStars(e.score); hasActivity = true; } });
                    if (hasActivity) settled += MONTH_SETTLE_BONUS;
                    let redeemed = 0;
                    state.redemptions.forEach(r => { if (r.date && r.date.startsWith(m)) redeemed += (r.cost || 0); });
                    state.archive.months[m] = { settled, redeemed };
                });

                state.checkins = state.checkins.filter(c => !(c.date && c.date.slice(0,7) < cutoff));
                state.exams = state.exams.filter(e => !(e.date && e.date.slice(0,7) < cutoff));
                state.extraTasks = state.extraTasks.filter(t => !(t.createdDate && t.createdDate.slice(0,7) < cutoff));
                state.redemptions = state.redemptions.filter(r => !(r.date && r.date.slice(0,7) < cutoff));
                state.archive.lastCleanupMonth = curMonth;
                return true;
            }

            async function fetchCloudState() {
                if (!supabaseClient) return;
                if (hasPendingLocalWrite()) return;
                try {
                    const { data, error } = await supabaseClient.from('app_state').select('state_data').eq('id', 1).single();
                    if (error) throw error;
                    if (data && data.state_data && Object.keys(data.state_data).length > 0) {
                        isSyncingFromCloud = true;
                        state = data.state_data;
                        state.tasks = (state.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        if (!state.archive) state.archive = { lastCleanupMonth: '', months: {} };
                        if (!state.starman) state.starman = { perfectDays: [], unlockedIds: [] };
                        performCleanupIfNeeded();
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        renderAll();
                        isSyncingFromCloud = false;
                    }
                } catch (error) {}
            }

            function setupRealtime() {
                if (!supabaseClient) return;
                supabaseClient.channel('app_state_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
                    if (hasPendingLocalWrite()) return;
                    const newState = payload.new.state_data;
                    if (newState && Object.keys(newState).length > 0) {
                        isSyncingFromCloud = true;
                        state = newState;
                        state.tasks = (state.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        if (!state.archive) state.archive = { lastCleanupMonth: '', months: {} };
                        if (!state.starman) state.starman = { perfectDays: [], unlockedIds: [] };
                        performCleanupIfNeeded();
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        renderAll();
                        setTimeout(() => { isSyncingFromCloud = false; }, 100);
                    }
                }).subscribe();
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getExamStars(score) {
                if (score === null || score === undefined || score === '') return 0;
                const s = parseFloat(score);
                if (s >= 100) return 50;
                if (s >= 90) return 25;
                return 0;
            }

            function calcTodayStars() {
                const today = getViewDate();
                let sum = 0;
                state.checkins.forEach(c => {
                    if (c.date === today && c.isExtra) sum += (c.reward || 0);
                });
                state.exams.forEach(e => {
                    if (e.date === today) sum += getExamStars(e.score);
                });
                return sum;
            }

            function monthHasActivity(prefix) {
                return state.checkins.some(c => c.isExtra && c.date && c.date.startsWith(prefix))
                    || state.exams.some(e => e.date && e.date.startsWith(prefix));
            }

            function calcMonthSettled(prefix) {
                let sum = 0;
                state.checkins.forEach(c => { if (c.isExtra && c.date && c.date.startsWith(prefix)) sum += (c.reward || 0); });
                state.exams.forEach(e => { if (e.date && e.date.startsWith(prefix)) sum += getExamStars(e.score); });
                if (monthHasActivity(prefix)) sum += MONTH_SETTLE_BONUS;
                return sum;
            }

            function calcMonthStars() {
                const prefix = getViewMonthPrefix();
                let extraSum = 0;
                let examSum = 0;
                state.checkins.forEach(c => { if (c.isExtra && c.date && c.date.startsWith(prefix)) extraSum += (c.reward || 0); });
                state.exams.forEach(e => { if (e.date && e.date.startsWith(prefix)) examSum += getExamStars(e.score); });
                return { total: extraSum + examSum, extraSum, examSum, monthlyBonus: 0, prefix };
            }

            function calcSettledStars() {
                const cur = getBeijingMonthPrefix(0);
                let total = 0;
                const archived = (state.archive && state.archive.months) || {};
                Object.values(archived).forEach(m => { total += (m.settled || 0); });
                const months = new Set();
                state.checkins.forEach(c => { if (c.isExtra && c.date) months.add(c.date.slice(0, 7)); });
                state.exams.forEach(e => { if (e.date) months.add(e.date.slice(0, 7)); });
                months.forEach(m => { if (m < cur) total += calcMonthSettled(m); });
                return total;
            }

            function calcRedeemedStars() {
                let total = 0;
                const archived = (state.archive && state.archive.months) || {};
                Object.values(archived).forEach(m => { total += (m.redeemed || 0); });
                total += (state.redemptions || []).reduce((sum, r) => sum + (r.cost || 0), 0);
                return total;
            }

            function calcShopBalance() {
                return calcSettledStars() - calcRedeemedStars();
            }

            function shiftDateStr(dateStr, days) {
                const p = (dateStr || '').split('-');
                if (p.length !== 3) return dateStr;
                const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
                d.setUTCDate(d.getUTCDate() + days);
                return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
            }
            function isCheckedOnDate(taskId, dateStr) {
                return state.checkins.some(c => !c.isExtra && c.taskId === taskId && c.date === dateStr);
            }
            function isPeriodTaskChecked(task) {
                const from = task.startDate || '0000-01-01';
                const to = task.endDate || '9999-12-31';
                return state.checkins.some(c => !c.isExtra && c.taskId === task.id && c.date >= from && c.date <= to);
            }
            function isDailyTask(task) { return !!task.daily; }
            function isPeriodTask(task) { return !task.daily && !!task.endDate; }

            function isTaskCheckedToday(taskId) {
                return isCheckedOnDate(taskId, getBeijingDateStr());
            }
            function isTaskInValidPeriod(task, today) {
                const start = task.startDate || today;
                if (today < start) return false;
                if (isDailyTask(task)) return !task.endDate || today <= task.endDate;
                if (isPeriodTask(task)) return today <= task.endDate;
                return task.startDate === today;
            }
            function canTaskCheck(task) {
                const today = getBeijingDateStr();
                if (!isTaskInValidPeriod(task, today)) return false;
                if (isPeriodTask(task) && isPeriodTaskChecked(task)) return false;
                return true;
            }
            function isTaskCheckedForDisplay(task, today) {
                if (isPeriodTask(task)) return isPeriodTaskChecked(task);
                return isCheckedOnDate(task.id, today);
            }
            function isTaskDueOnDate(task, dateStr) {
                const start = task.startDate || dateStr;
                if (dateStr < start) return false;
                if (isDailyTask(task)) return !task.endDate || dateStr <= task.endDate;
                if (isPeriodTask(task)) return dateStr === task.endDate;
                return task.startDate === dateStr;
            }
            function isTaskDoneOnDate(task, dateStr) {
                if (isPeriodTask(task)) return isPeriodTaskChecked(task);
                return isCheckedOnDate(task.id, dateStr);
            }

            // 当天完成判断：只以"必须完成的任务"为准，与底部未完成任务清单一致
            // 额外任务属于可选奖励（不做也不算未完成），不参与日历判定
            function getDayCompletionStatus(dateStr) {
                const today = getBeijingDateStr();
                if (dateStr >= today) return 'none';
                const dueTasks = state.tasks.filter(t => isTaskDueOnDate(t, dateStr));
                const total = dueTasks.length;
                if (total === 0) return 'none';
                let completed = 0;
                dueTasks.forEach(t => { if (isTaskDoneOnDate(t, dateStr)) completed++; });
                return completed >= total ? 'completed' : 'incomplete';
            }

            // 今天"必须完成"的任务：到期日就是今天的才纳入（周期任务只在截止日当天算），考试任务不计入
            function getTodayRequiredTasks() {
                const today = getBeijingDateStr();
                return state.tasks.filter(t => isTaskDueOnDate(t, today));
            }
            function getTodayPendingRequiredTasks() {
                const today = getBeijingDateStr();
                return getTodayRequiredTasks().filter(t => !isTaskDoneOnDate(t, today));
            }

            function renderProfile() {
                const name = state.profile.name || 'HEIDI';
                const avatar = state.profile.avatar || '';
                const avatarEl = document.getElementById('avatarDisplay');
                if (avatar) {
                    avatarEl.style.backgroundImage = `url(${avatar})`;
                    avatarEl.textContent = '';
                } else {
                    avatarEl.style.backgroundImage = '';
                    avatarEl.textContent = '';
                }
                document.getElementById('profileName').textContent = name;
                const editBtn = document.getElementById('editProfileBtn');
                if (currentRole === 'admin' && isAdminAuthenticated) {
                    editBtn.classList.remove('hidden');
                } else {
                    editBtn.classList.add('hidden');
                }
            }

            function renderCalendar() {
                const start = calendarWeekStart;
                const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
                const monthLabel = document.getElementById('calendarMonth');
                monthLabel.textContent = monthNames[start.getMonth()];

                const grid = document.getElementById('calendarGrid');
                const todayStr = getBeijingDateStr();
                const cells = [];

                for (let i = 0; i < 7; i++) {
                    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
                    const dateStr = formatDate(d);
                    const isToday = dateStr === todayStr;
                    const isFuture = dateStr > todayStr;
                    let status = '';
                    if (!isToday && !isFuture) {
                        const s = getDayCompletionStatus(dateStr);
                        if (s === 'completed') status = 'completed';
                        else if (s === 'incomplete') status = 'incomplete';
                    }
                    const retainFrom = getBeijingMonthPrefix(-2) + '-01'; // 数据保留边界：当前月往前 2 个月
                    cells.push({ day: d.getDate(), isToday, status, dateStr, isFuture, inRetain: dateStr >= retainFrom && dateStr <= todayStr });
                }
                grid.innerHTML = cells.map(c => {
                    let cls = 'calendar-day';
                    if (c.isToday) cls += ' today';
                    else if (c.status) cls += ' ' + c.status;
                    if (!c.status && !c.isToday) cls += ' none';
                    if (c.isFuture) cls += ' future';
                    if (c.inRetain && !c.isFuture) cls += ' viewable';
                    if (viewingDate && c.dateStr === viewingDate) cls += ' viewing';
                    return `<div class="${cls}" data-date="${c.dateStr}">${c.day}</div>`;
                }).join('');
            }

            function getTagClass(text) {
                if (text === '校内任务' || text === '校外任务') return 'tag-green';
                if (text === '语文' || text === '数学' || text === '英语') return 'tag-purple';
                return 'tag-orange';
            }

            // 打勾动画 B：生成带 SVG 勾线与粒子迸发的圆形勾选框
            function tickCheckHtml(completed, action, idAttr) {
                const sparks = [
                    [-20,-12],[22,-10],[-16,16],[18,18],[0,-24]
                ].map(p => `<span class="spark" style="--dx:${p[0]}px;--dy:${p[1]}px"></span>`).join('');
                const tick = `<svg class="tick" viewBox="0 0 36 36">
                    <path class="p1" d="M10 18.5 L15.5 24"></path>
                    <path class="p2" d="M15.5 24 L26 12.5"></path>
                </svg>`;
                return `<div class="task-check" data-action="${action}" ${idAttr}>${sparks}${tick}</div>`;
            }

            function renderTaskGroup(containerId, category, countBadgeId) {
                const container = document.getElementById(containerId);
                if (!container) return;

                const today = getViewDate();
                const todayCheckTaskIds = new Set(state.checkins.filter(c => c.date === today && !c.isExtra).map(c => c.taskId));

                const tasks = state.tasks.filter(task => {
                    if (task.category !== category) return false;
                    if (todayCheckTaskIds.has(task.id)) return true;
                    return isTaskInValidPeriod(task, today);
                });

                if (countBadgeId) {
                    const badge = document.getElementById(countBadgeId);
                    if (badge) badge.textContent = `${tasks.length}项`;
                }

                if (tasks.length === 0) {
                    container.innerHTML = `<div style="text-align:center;padding:16px;color:var(--text-sub);background:transparent;border-radius:var(--radius-card);font-weight:800;">暂无任务，好好休息~</div>`;
                    return;
                }

                const groups = {};
                tasks.forEach(t => {
                    const sub = t.subject || '其它';
                    if (!groups[sub]) groups[sub] = [];
                    groups[sub].push(t);
                });

                let html = '';
                let sortedSubjects = Object.keys(groups);
                if (category === '校内任务') {
                    const order = { '语文': 1, '数学': 2, '英语': 3, '其它': 4 };
                    sortedSubjects.sort((a,b) => (order[a]||99) - (order[b]||99));
                } else {
                    const order = { '口语': 1, '新东方': 2 };
                    sortedSubjects.sort((a,b) => (order[a]||99) - (order[b]||99));
                }

                sortedSubjects.forEach(sub => {
                    html += `<div class="sub-title"><img src="icon_subject.svg" class="zoom-icon" style="width: 12px; height: 12px;"> ${sub}</div>`;
                    html += `<div class="task-grid-inner">`;
                    groups[sub].forEach(task => {
                        html += renderTaskItem(task, isTaskCheckedForDisplay(task, today), false);
                    });
                    html += `</div>`;
                });

                container.innerHTML = html;
            }

            function renderInSchoolTasks() {
                renderTaskGroup('inSchoolGroups', '校内任务', 'inSchoolCountBadge');
            }

            function renderOutSchoolTasks() {
                renderTaskGroup('outSchoolGroups', '校外任务', 'outSchoolCountBadge');
            }

            function renderTaskItem(task, completed, overdue) {
                const showAdminActions = (currentRole === 'admin' && isAdminAuthenticated) && !isTaskManageReadOnly();
                const today = getViewDate();

                let tagsHtml = '';
                if (task.subject) {
                    tagsHtml += `<span class="tag ${getTagClass(task.subject)}">${task.subject}</span>`;
                }
                if (task.note) {
                    tagsHtml += `<span class="tag tag-orange">${escapeHtml(task.note)}</span>`;
                }
                if (isDailyTask(task)) {
                    tagsHtml += `<span class="tag tag-green"><img src="icon_repeat.svg" class="icon-repeat-small"> 每日</span>`;
                } else if (isPeriodTask(task)) {
                    tagsHtml += `<span class="tag tag-date">周期任务</span>`;
                } else {
                    tagsHtml += `<span class="tag tag-today">今日任务</span>`;
                }

                if (overdue) {
                    tagsHtml += `<span class="tag tag-pink">原定：${task.startDate}${task.endDate ? ' 至 ' + task.endDate : ''}</span>`;
                } else if (task.endDate) {
                    tagsHtml += `<span class="tag tag-deadline">截止：${task.endDate}</span>`;
                } else if (!isDailyTask(task) && task.startDate !== today) {
                    tagsHtml += `<span class="tag tag-date">${task.startDate}</span>`;
                }

                const checkHtml = overdue
                    ? `<span class="overdue-badge">未完成</span>`
                    : tickCheckHtml(completed, 'toggle-check', `data-task-id="${task.id}"`);

                return `
                    <div class="task-item ${completed ? 'completed' : ''} ${overdue ? 'overdue' : ''}" data-task-id="${task.id}">
                        <div class="task-icon">
                            <img src="${getSubjectIcon(task.subject)}" class="zoom-icon" style="width: 26px; height: 26px; object-fit: contain;">
                        </div>
                        <div class="task-info">
                            <div class="task-name">${escapeHtml(task.name)}</div>
                            <div class="task-meta">
                                ${tagsHtml}
                            </div>
                        </div>
                        ${showAdminActions ? `
                        <div class="task-actions">
                            <button class="icon-btn" data-action="edit-task" data-task-id="${task.id}"><img src="icon_edit.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>
                            <button class="icon-btn" data-action="delete-task" data-task-id="${task.id}"><img src="icon_delete.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>
                        </div>` : ''}
                        ${checkHtml}
                    </div>
                `;
            }

            function renderExtraTasks() {
                const container = document.getElementById('extraTaskList');
                if (!container) return;

                const today = getViewDate();
                // 家长/儿童模式统一按查看日期筛选，避免出现"已完成但非当天"的任务在家长模式多显示
                const todayExtras = state.extraTasks.filter(t => t.createdDate === today).slice(-3);

                if (todayExtras.length === 0) {

                container.innerHTML = todayExtras.map(task => {

                    return `
                        <div class="task-item ${completed ? 'completed' : ''}">
                            <div class="task-icon"><img src="icon_gift_card.webp" class="zoom-icon" style="width: 26px; height: 26px; object-fit: contain;"></div>
                            <div class="task-info">
                                <div class="task-name">${escapeHtml(task.name)}</div>
                                <div class="task-meta">
                                    <span class="tag tag-orange">⭐${task.reward}</span>
                                    <span class="tag tag-date">${task.createdDate}</span>
                                </div>
                            </div>
                            ${currentRole === 'admin' && isAdminAuthenticated && !isTaskManageReadOnly() ? `
                            <div class="task-actions">
                                <button class="icon-btn" data-action="edit-extra" data-extra-id="${task.id}"><img src="icon_edit.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>
                                <button class="icon-btn" data-action="delete-extra" data-extra-id="${task.id}"><img src="icon_delete.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>
                            </div>` : ''}
                            ${tickCheckHtml(completed, 'toggle-extra', `data-extra-id="${task.id}"`)}
                        </div>
                    `;
                }).join('');
            }

            function renderExams() {
                const container = document.getElementById('examTaskList');
                if (!container) return;

                const curMonth = getViewMonthPrefix();
                const monthExams = state.exams.filter(e => (e.date || '').startsWith(curMonth));

                if (monthExams.length === 0) {
                    container.innerHTML = `<div style="text-align:center;padding:16px;color:var(--text-sub);background:transparent;border-radius:var(--radius-card);font-weight:800;">本月暂无考试记录</div>`;
                    return;
                }

                const isAdmin = (currentRole === 'admin' && isAdminAuthenticated);

                        ? `<span class="exam-stars ${isZero ? 'zero' : ''}">获得 ${stars} <img src="icon_star.svg" style="width: 18px; height: 18px; object-fit: contain;"></span>`
                        : `<span class="exam-stars zero">未录入</span>`;

                        ? `<input type="number" step="0.5" min="0" max="100" class="exam-score-input" data-exam-id="${exam.id}" value="${exam.score !== null ? exam.score : ''}" placeholder="输入分数">`
                        : `<span style="font-weight: 900; color: var(--text-main); font-size: 16px; line-height: 1;">${exam.score}分</span>`;

                                    ${scoreHtml}

                                    <span class="tag tag-date" style="font-weight: 800;">${exam.date}</span>

                            ${canManageExam ? `
                            <div class="task-actions">

                                <button class="icon-btn" data-action="delete-exam" data-exam-id="${exam.id}"><img src="icon_delete.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>

            function renderOverdueTasks() {
                const container = document.getElementById('overdueTaskList');
                if (!container) return;

                const today = getViewDate();
                const LOOKBACK_DAYS = 2;
                const lookbackDates = [];
                for (let i = 1; i <= LOOKBACK_DAYS; i++) lookbackDates.push(shiftDateStr(today, -i));

                const items = [];

                state.tasks.forEach(task => {
                    const start = task.startDate || today;
                    if (isDailyTask(task)) {
                        const missed = lookbackDates.filter(d => {
                            if (d < start) return false;
                            if (task.endDate && d > task.endDate) return false;
                            return !isCheckedOnDate(task.id, d);
                        });
                        if (missed.length > 0) items.push({ task, missed });
                    } else if (isPeriodTask(task)) {
                        if (today > task.endDate && !isPeriodTaskChecked(task)) {
                            items.push({ task, missed: [task.endDate] });
                        }
                    } else {
                        if (today > start && !isCheckedOnDate(task.id, start)) {
                            items.push({ task, missed: [start] });
                        }
                    }
                });

                items.sort((a, b) => (b.missed[0] || '').localeCompare(a.missed[0] || ''));
                document.getElementById('overdueCountBadge').textContent = `${items.length}项`;

                if (items.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 8px; padding:16px;color:var(--text-sub);background:transparent;border-radius:var(--radius-card);font-weight:800;"><img src="icon_done.svg" class="zoom-icon" style="width: 18px; height: 18px; object-fit: contain;"> 全部完成啦！</div>`;
                    return;
                }

                container.innerHTML = items.map(({ task, missed }) => {
                    let tagsHtml = `
                        <span class="tag ${getTagClass(task.category)}">${task.category}</span>
                        ${task.subject ? `<span class="tag ${getTagClass(task.subject)}">${task.subject}</span>` : ''}
                    `;

                    if (isDailyTask(task)) {
                        tagsHtml += `<span class="tag tag-green"><img src="icon_repeat.svg" class="icon-repeat-small"> 每日</span>`;
                    } else if (isPeriodTask(task)) {
                        tagsHtml += `<span class="tag tag-date">周期任务</span>`;
                    } else {
                        tagsHtml += `<span class="tag tag-today">今日任务</span>`;
                    }

                    const missedLabel = missed.map(d => d.slice(5)).join('、');
                    tagsHtml += `<span class="tag tag-pink">未完成：${missedLabel}</span>`;

                    const showAdminActions = (currentRole === 'admin' && isAdminAuthenticated) && !isTaskManageReadOnly();
                    const actionHtml = showAdminActions ? `
                        <div class="task-actions">
                            <button class="icon-btn" data-action="edit-task" data-task-id="${task.id}"><img src="icon_edit.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>
                            <button class="icon-btn" data-action="delete-task" data-task-id="${task.id}"><img src="icon_delete.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>
                        </div>
                    ` : '';

                    return `
                        <div class="task-item overdue">
                            <div class="task-icon">
                                <img src="${getSubjectIcon(task.subject)}" class="zoom-icon" style="width: 26px; height: 26px; object-fit: contain;">
                            </div>
                            <div class="task-info">
                                <div class="task-name">${escapeHtml(task.name)}</div>
                                <div class="task-meta">
                                    ${tagsHtml}
                                </div>
                            </div>
                            ${actionHtml}
                        </div>
                    `;
                }).join('');
            }

            function renderStats() {

                const monthData = calcMonthStars();
                document.getElementById('todayStars').innerHTML = `<span>${todaySum}</span><img src="icon_star.svg" style="width: 20px; height: 20px; object-fit: contain;">`;
                document.getElementById('monthStars').innerHTML = `<span>${monthData.total}</span><img src="icon_star.svg" style="width: 20px; height: 20px; object-fit: contain;">`;
                const dayLabel = document.querySelector('.stats-card.today .stats-label');

            function updateHistoryUI() {
                const backBtn = document.getElementById('backToTodayBtn');
                const homePage = document.getElementById('viewHome');
                if (!backBtn || !homePage) return;
                // 仅回看历史时显示返回按钮；今天不显示

                homePage.classList.toggle('history-mode', !!viewingDate);

            function updateRoleUI() {

            function renderAll() {

            // ===== 页面区块切换动画（顶栏/底栏不动，只动页面内容） =====
            const VIEW_ORDER = ['home', 'shop', 'stats'];
            let viewAnimating = false;

            // 左右滑动切换页面（手机/iPad 触屏，桌面可用鼠标拖拽）—— 跟手 + 阻尼回弹
            function bindSwipe() {
                let sx = 0, sy = 0, dx = 0, offset = 0, active = false, decided = false;
                let dragBlocks = [];
                const isInteractive = (t) => t && t.closest('button, input, select, textarea, .modal-overlay, .modal-content, [data-action]');
                document.addEventListener('pointerdown', (e) => {
                    if (e.button !== undefined && e.button !== 0) return;
                    if (isInteractive(e.target)) return;
                    if (viewAnimating) return;
                    active = true; decided = false; sx = e.clientX; sy = e.clientY; dx = 0; offset = 0;
                }, { passive: true });
                document.addEventListener('pointermove', (e) => {
                    if (!active) return;
                    const mx = e.clientX - sx, my = e.clientY - sy;
                    if (!decided) {
                        if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { active = false; return; }
                        if (Math.abs(mx) > 8) {
                            decided = true;
                            dragBlocks = viewBlocks(currentView);
                        } else return;
                    }
                    const idx = VIEW_ORDER.indexOf(currentView);
                    const canMove = (mx < 0 && idx < VIEW_ORDER.length - 1) || (mx > 0 && idx > 0);
                    const factor = canMove ? .45 : .16;
                    dx = mx; offset = mx * factor;
                    dragBlocks.forEach(b => { b.style.transform = 'translateX(' + offset + 'px)'; });
                    e.preventDefault();
                }, { passive: false });
                const finish = () => {
                    if (!active) return;
                    active = false;
                    if (!decided) return;
                    dragBlocks.forEach(b => { b.style.transform = ''; });
                    const idx = VIEW_ORDER.indexOf(currentView);
                    let target = null;
                    if (dx < -45 && idx < VIEW_ORDER.length - 1) target = idx + 1;
                    else if (dx > 45 && idx > 0) target = idx - 1;
                    if (target !== null) {
                        switchView(VIEW_ORDER[target]);
                    } else if (Math.abs(dx) > 8) {
                        dragBlocks.forEach(b => {
                            b.animate([
                                { transform: 'translateX(' + offset + 'px)' },
                                { transform: 'translateX(0)' }
                            ], { duration: 320, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'both' });
                        });
                    }
                    dragBlocks = [];
                };
                document.addEventListener('pointerup', finish);
                document.addEventListener('pointercancel', () => {
                    if (active) finish();
                });
            }

            function viewBlocks(view) {
                const root = document.getElementById('view' + view.charAt(0).toUpperCase() + view.slice(1));
                if (!root) return [];
                // 取页面内的多个模块卡片，形成"先后到达"的错落感（preview-slide 效果）
                const pick = (sel) => Array.prototype.slice.call(root.querySelectorAll(sel)).filter(el => el.offsetParent !== null);
                let blocks;
                if (view === 'home') {
                    blocks = pick('.profile-stats-bar, .calendar-card, .left-panel > .section-wrapper, .right-panel > .section-wrapper');
                } else if (view === 'shop') {
                    blocks = pick('.shop-page-title, .shop-hero, .shop-main > .section-wrapper, .shop-actions, .shop-side > .section-wrapper');
                } else {
                    blocks = pick('.stats-layout > .section-wrapper');
                }
                return blocks.length ? blocks : Array.prototype.slice.call(root.children).filter(el => !el.classList.contains('hidden'));
            }

            function getViewRoot(v) {
                return document.getElementById('view' + v.charAt(0).toUpperCase() + v.slice(1));
            }

            function applyVisibleView(view) {
                ['home', 'shop', 'stats'].forEach(v => {
                    const el = getViewRoot(v);
                    if (el) el.classList.toggle('hidden', v !== view);
                });
            }

            // 滑入距离限制在视口宽度以内，避免 translateX 撑宽文档触发移动端自动缩放
            function slideDistance() {
                return Math.min(window.innerWidth, 340);
            }

            function animateViewSwitch(fromView, toView) {
                viewAnimating = true;
                const fromIdx = VIEW_ORDER.indexOf(fromView);
                const toIdx = VIEW_ORDER.indexOf(toView);
                const dir = toIdx >= fromIdx ? 1 : -1;
                const W = slideDistance();
                const oldRoot = getViewRoot(fromView);
                const newRoot = getViewRoot(toView);
                const oldBlocks = viewBlocks(fromView);
                // 先记录离场页在页面中的真实位置（body 已设为定位上下文）
                const bodyRect = document.body.getBoundingClientRect();
                const oldRect = oldRoot ? oldRoot.getBoundingClientRect() : null;
                // 新页面先解除隐藏，动画期间新旧同时可见（一出一进）
                if (newRoot) newRoot.classList.remove('hidden');
                const newBlocks = viewBlocks(toView);
                // 离场页脱离文档流叠在上层，按原位置定位，避免跳到视口顶端产生边界感
                if (oldRoot && oldRect) {
                    oldRoot.style.top = (oldRect.top - bodyRect.top) + 'px';
                    oldRoot.style.left = (oldRect.left - bodyRect.left) + 'px';
                    oldRoot.style.width = oldRect.width + 'px';
                    oldRoot.classList.add('view-leaving');
                }

                oldBlocks.forEach((blk, i) => {
                    blk.getAnimations().forEach(a => a.cancel());
                    blk.animate([
                        { transform: 'translateX(0)', opacity: 1 },
                        { transform: 'translateX(' + (-dir * W * .22) + 'px)', opacity: 0 }
                    ], { duration: 300, delay: i * 25, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'both' });
                });
                const ENTER_DELAY = 120, ENTER_STAGGER = 55, ENTER_DURATION = 620;
                newBlocks.forEach((blk, i) => {
                    blk.getAnimations().forEach(a => a.cancel());
                    blk.animate([
                        { transform: 'translateX(' + dir * W + 'px)', opacity: 0 },
                        { transform: 'translateX(0)', opacity: 1 }
                    ], { duration: ENTER_DURATION, delay: ENTER_DELAY + i * ENTER_STAGGER, easing: 'cubic-bezier(.22,.7,.28,1)', fill: 'both' });
                });
                // 动画结束后隐藏旧页面，并清掉 fill 状态，避免切回时内容透明
                // 等最后一个进场区块也到位后再清理，避免提前打断动画
                const cleanupAt = ENTER_DELAY + Math.max(0, newBlocks.length - 1) * ENTER_STAGGER + ENTER_DURATION + 80;
                setTimeout(() => {
                    if (oldRoot) {
                        oldRoot.classList.add('hidden');
                        oldRoot.classList.remove('view-leaving');
                        oldRoot.style.top = '';
                        oldRoot.style.left = '';
                        oldRoot.style.width = '';
                    }
                    oldBlocks.forEach(blk => {
                        blk.getAnimations().forEach(a => a.cancel());
                        blk.style.transform = '';
                        blk.style.opacity = '';
                    });
                    newBlocks.forEach(blk => {
                        blk.getAnimations().forEach(a => a.cancel());
                        blk.style.transform = '';
                        blk.style.opacity = '';
                    });
                    viewAnimating = false;
                }, cleanupAt);
            }

            function switchView(view) {
                const prevView = currentView;
                const changed = prevView !== view;
                currentView = view;
                document.querySelectorAll('.bottom-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === view);
                });
                document.querySelectorAll('.page-decor').forEach(img => {
                    const active = img.dataset.view === view;
                    // 切到某页时才加载其装饰图（data-src → src），避免首屏并发下载
                    if (active && img.dataset.src && !img.getAttribute('src')) {
                        img.setAttribute('src', img.dataset.src);
                        delete img.dataset.src;
                    }
                    // 淡入淡出：用透明度过渡替代瞬间 hidden
                    img.classList.toggle('decor-hidden', !active);
                });
                if (view === 'shop') renderShopPage();
                if (view === 'stats') renderStatsPage();
                window.scrollTo({ top: 0, behavior: 'auto' });
                if (changed && !viewAnimating) {
                    animateViewSwitch(prevView, view);
                } else if (changed) {
                    applyVisibleView(view);
                }
            }

            function toggleShopSelect(id) {

                    const raw = el ? el.value : moneyAmount;

            function doRedeem() {
                if (selectedShopIds.size === 0) { showToast('请先选择要兑换的商品', false); return; }
                const balance = calcShopBalance();
                const items = [...selectedShopIds].map(id => {
                    if (id === MONEY_ITEM_ID) return { id: MONEY_ITEM_ID, name: 'MONEY', cost: moneyAmount };
                    return (state.shopItems || []).find(i => i.id === id);

                if (selectedShopIds.has(MONEY_ITEM_ID)) {
                    if (!moneyAmount || moneyAmount < 1) { showToast('请先填写要兑换的星值', false); return; }
                    if (moneyAmount > balance) { showToast(`不能超过可用星值 ${balance}`, false); return; }

                const cost = items.reduce((sum, i) => sum + (i.cost || 0), 0);
                if (cost > balance) {
                    showToast(`星值不足，还差 ${cost - balance}`, false);
                    return;

                const names = items.map(i => `${escapeHtml(i.name)}（${i.cost}★）`).join('、');
                showModal({
