<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HEIDI STAR">
    <link rel="apple-touch-icon" href="icon.png">
    <title>HEIDI星旅</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-page: #f5f5f5;
            --bg-card: #f7f7f7;
            --bg-wrapper: #fefefe;
            --text-main: #383b42;
            --text-sub: #b7b7b7;
            --accent: #74b0e1;
            --accent-light: #c0e2f9;
            --accent-warm: #f4c65c;
            --bg-nav: #ffffff;
            --border-light: #ebebeb;
            --radius-card: 22px;
            --radius-wrapper: 32px;
            --radius-btn: 999px;
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.03);
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'URW Gothic', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .fixed-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-page);
            z-index: -10;
            pointer-events: none;
        }

        html, body {
            overscroll-behavior-y: none;
            background-color: transparent;
        }

        body {
            min-height: 100vh;
            padding: 12px 20px 100px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
        }

        .zoom-icon {
            transform: scale(2);
            transform-origin: center;
            max-width: none !important;
            object-fit: contain;
            z-index: 10;
            display: block;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--bg-nav);
            border-radius: var(--radius-btn);
            padding: 4px 10px;
            box-shadow: var(--shadow-soft);
            flex-shrink: 0;
            border: 1px solid var(--border-light);
        }

        .header-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            border: none;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: 0.3s;
        }
        .header-btn.active {
            color: var(--text-main);
            background: var(--bg-card);
        }

        .layout-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .left-panel, .right-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .section-wrapper {
            border-radius: var(--radius-wrapper);
            padding: 16px;
            margin-bottom: 0;
            transition: 0.3s;
            background-color: var(--bg-wrapper) !important;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-light);
        }
        .section-wrapper.collapsed .section-title {
            margin-bottom: 0;
        }

        .profile-stats-bar {
            display: flex;
            gap: 16px;
            align-items: stretch;
            margin-bottom: 0;
        }

        .profile-card {
            background: var(--bg-wrapper);
            border-radius: var(--radius-card);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            flex: 0 0 auto;
            min-width: 120px;
            border: 1px solid var(--border-light);
        }

        .avatar-container {
            width: 76px;
            height: 76px;
            background: var(--accent-light);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            animation: blobFloat 4s ease-in-out infinite alternate;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.05);
        }

        @keyframes blobFloat {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translateY(0); }
            100% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; transform: translateY(-5px); }
        }

        .avatar-eye {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--text-main);
            border-radius: 50%;
            top: 40%;
        }
        .avatar-eye.left { left: 25%; }
        .avatar-eye.right { right: 25%; }

        .avatar-smile {
            position: absolute;
            width: 20px;
            height: 10px;
            border-bottom: 3px solid var(--text-main);
            border-radius: 0 0 20px 20px;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
        }

        .avatar {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 28px;
            font-weight: 900;
            background-size: cover;
            background-position: center;
            z-index: 2;
        }
        .avatar[style*="url"] ~ .avatar-eye,
        .avatar[style*="url"] ~ .avatar-smile { display: none; }

        .profile-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-main);
            text-align: center;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-profile-btn {
            background: var(--bg-page);
            border: none;
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: var(--radius-btn);
            font-size: 12px;
            cursor: pointer;
            font-weight: 800;
        }

        .stats-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stats-card {
            flex: 1;
            border-radius: var(--radius-card);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }
        .stats-card.today { background: var(--accent); color: #ffffff; border-color: var(--accent); }
        .stats-card.month { background: var(--bg-wrapper); color: var(--text-main); }
        .stats-card.today .stats-number { color: #ffffff; }

        .stats-label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .stats-number {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            line-height: 1;
        }
        .stats-number img {
            display: block;
            flex-shrink: 0;
        }

        .calendar-card {
            background: var(--bg-wrapper);
            border-radius: var(--radius-card);
            padding: 20px;
            box-shadow: var(--shadow-soft);
            width: 100%;
            border: 1px solid var(--border-light);
        }

        .calendar-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
        }

        .calendar-header .month-label {
            font-weight: 800;
            color: var(--text-main);
            font-size: 18px;
        }

        .calendar-nav-btn {
            position: absolute;
            background: var(--bg-page);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        #prevMonth { left: 0; }
        #nextMonth { right: 0; }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 40px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            border-radius: 50%;
            color: var(--text-main);
        }

        .calendar-day.today {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 900;
        }
        .calendar-day.completed {
            background: var(--accent);
            color: #ffffff;
            font-weight: 900;
        }
        .calendar-day.incomplete {
            background: var(--accent-warm);
            color: #ffffff;
            font-weight: 900;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 12px 0;
            font-weight: 800;
            color: var(--text-main);
            font-size: 21px;
            width: 100%;
        }
        .section-title .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .title-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collapse-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sub-title {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 800;
            margin: 12px 0 6px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1;
        }
        .sub-title img {
            display: block;
            flex-shrink: 0;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 4px;
            width: 100%;
        }

        .task-grid-inner {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .task-item {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-card);
            transition: 0.2s;
            width: 100%;
            border: 1px solid var(--border-light);
        }

        .task-item.completed {
            background: var(--bg-card);
            box-shadow: none;
            opacity: 0.6;
        }

        .task-item.overdue {
            background: color-mix(in srgb, var(--accent-warm) 16%, var(--bg-wrapper));
        }

        .task-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            height: 48px;
            background: transparent;
            flex-shrink: 0;
        }

        .task-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .task-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-main);
            word-break: break-word;
        }
        .task-item.completed .task-name {
            color: var(--text-sub);
            text-decoration: line-through;
        }

        .task-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: var(--border-light);
            color: var(--text-main);
            line-height: 1;
        }
        .tag-green { background: var(--accent-light); color: var(--accent); }
        .tag-purple, .tag-pink, .tag-blue { background: var(--bg-page); color: var(--text-main); }
        .tag-orange { background: color-mix(in srgb, var(--accent-warm) 30%, var(--bg-wrapper)); color: var(--text-main); }
        .tag-date { background: transparent; color: var(--text-sub); padding-left: 0; }
        .tag-today { background: var(--accent-light); color: var(--accent); }
        .tag-deadline { background: var(--border-light); color: var(--text-main); }

        .icon-repeat-small {
            width: 12px;
            height: 12px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 2px;
        }

        .task-check {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
            background: var(--bg-wrapper);
        }
        .task-item.completed .task-check {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-nav);
        }

        .task-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon-btn {
            background: var(--bg-wrapper);
            border: 1px solid var(--border-light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            font-size: 16px;
        }

        .overdue-badge {
            background: var(--accent-warm);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .btn-primary {
            background: var(--accent);
            border: none;
            color: var(--bg-nav);
            padding: 12px 20px;
            border-radius: var(--radius-btn);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-primary:active { transform: scale(0.96); }

        .btn-outline {
            background: var(--bg-nav);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: var(--radius-btn);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-outline:active { background: var(--bg-page); }
        .btn-sm { padding: 8px 14px; font-size: 13px; }

        .hidden { display: none !important; }

        .exam-item {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }
        .exam-score-input {
            width: 90px;
            padding: 8px 12px;
            border-radius: var(--radius-btn);
            border: 2px solid var(--border-light);
            text-align: center;
            font-weight: 800;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            background: var(--bg-wrapper);
            line-height: 1;
        }
        .exam-score-input:focus { border-color: var(--accent); background: var(--bg-nav); }
        .exam-stars {
            font-weight: 800;
            font-size: 14px;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1;
        }
        .exam-stars.zero { color: var(--text-sub); }
        .exam-stars img {
            display: block;
            flex-shrink: 0;
        }

        .view-page { padding-bottom: 90px; }
        .shop-hero {
            background: linear-gradient(135deg, var(--accent) 0%, #5a9dd4 100%);
            border-radius: var(--radius-wrapper);
            padding: 24px 26px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(116, 176, 225, 0.32);
            margin-bottom: 14px;
        }
        .shop-hero-label { font-size: 14px; font-weight: 800; opacity: 0.92; letter-spacing: 0.5px; }
        .shop-hero-num {
            display: flex; align-items: center; gap: 10px;
            font-size: 40px; font-weight: 900; line-height: 1;
            margin: 10px 0 8px 0;
        }
        .shop-hero-num img { filter: brightness(0) invert(1); }
        .shop-hero-tip { font-size: 12px; font-weight: 700; opacity: 0.85; line-height: 1.4; }

        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }
        /* 兑换商品卡：与主界面任务卡一致（横向：图标 + 信息 + 勾选圈） */
        .shop-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            background: var(--bg-wrapper);
            border: 2px solid var(--border-light);
            border-radius: var(--radius-card);
            padding: 12px 14px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: var(--shadow-card);
        }
        .shop-item.selected {
            border-color: var(--accent);
            background: #f2f9ff;
        }
        .shop-item-img {
            width: 52px; height: 52px;
            border-radius: 16px;
            background: var(--bg-card);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .shop-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .shop-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }
        .shop-item-name {
            font-size: 15px; font-weight: 800; color: var(--text-main);
            line-height: 1.25; word-break: break-all;
        }
        .shop-item-cost {
            display: flex; align-items: center; gap: 4px;
            font-size: 13px; font-weight: 900; color: var(--accent); line-height: 1;
        }
        .shop-item-cost img { width: 16px; height: 16px; object-fit: contain; }
        .shop-money-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .shop-money-input {
            width: 108px; height: 38px;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            padding: 0 10px;
            font-family: inherit;
            font-size: 15px; font-weight: 900;
            color: var(--accent);
            background: var(--bg-nav);
            outline: none;
            box-sizing: border-box;
        }
        .shop-money-input:focus { border-color: var(--accent); }
        .shop-money-hint { font-size: 11px; font-weight: 800; color: var(--text-sub); }
        .shop-check {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border-light);
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 900; color: transparent;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .shop-item.selected .shop-check {
            background: var(--accent); border-color: var(--accent); color: #fff;
        }
        .shop-item-del {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-light);
            background: #ffeeee; color: #e46a6a;
            font-size: 17px; font-weight: 900; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .shop-item-err {
            display: none; color: #e46a6a; font-size: 13px; font-weight: 800;
            text-align: center; margin-bottom: 10px;
        }
        .shop-actions {
            display: flex; gap: 10px; margin-top: 14px;
        }
        .shop-actions button { flex: 1; height: 48px; }
        .shop-empty {
            text-align: center; padding: 32px 0; color: var(--text-sub);
            font-size: 14px; font-weight: 800;
        }
        .stats-page-card {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-wrapper); border: 1px solid var(--border-light);
            border-radius: 20px; padding: 16px 22px; margin-bottom: 12px;
        }
        .stats-page-card.hl { background: var(--accent); color: #fff; border-color: var(--accent); }
        .stats-page-card .lbl { font-size: 15px; font-weight: 800; }
        .stats-page-card .val { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 900; color: var(--accent); line-height: 1; }
        .stats-page-card.hl .val { color: #fff; }
        .stats-page-card .val img { width: 20px; height: 20px; object-fit: contain; }
        .stats-page-card.hl .val img { filter: brightness(0) invert(1); }
        .redeem-log-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: var(--bg-card);
            border-radius: 16px; margin-bottom: 8px; font-size: 13px; font-weight: 800;
        }
        .redeem-log-row .meta { color: var(--text-sub); font-size: 11px; font-weight: 700; margin-top: 3px; }

        .bottom-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 400px;
            background: var(--accent);
            padding: 10px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: var(--radius-btn);
            z-index: 100;
            box-shadow: 0 8px 24px rgba(116, 176, 225, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .bottom-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: transparent;
            border: none;

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        const SUPABASE_URL = 'https://skgxcnnagfgwfrccwwrx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_t96OWboqHhMc4CSJLEuQXQ_TE_xIMdw';

        let supabaseClient = null;
        // CDN 不可达时（如国内网络受限）降级为纯本地模式，保证页面功能照常可用，绝不因外部库缺失而整体崩溃
        if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_URL !== '替换为您的_SUPABASE_URL') {
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (e) {
                console.warn('云同步初始化失败，已切换为本地模式');
            }
        }

        (function() {
            const STORAGE_KEY = 'star_task_app_v1';
            const ADMIN_PASSWORD = '111';

            function getBeijingNow() {
                const now = new Date();
                const utc = now.getTime() + now.getTimezoneOffset() * 60000;
                return new Date(utc + 8 * 3600000);
            }
            function getBeijingDateStr() {
                const bj = getBeijingNow();
                return `${bj.getFullYear()}-${String(bj.getMonth()+1).padStart(2,'0')}-${String(bj.getDate()).padStart(2,'0')}`;
            }
            function formatDate(d) {
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            }
            function getMondayOf(date) {
                const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                const day = d.getDay();
                const diff = day === 0 ? -6 : 1 - day;
                d.setDate(d.getDate() + diff);
                return d;
            }
            function getSubjectIcon(subject) {
                const map = {
                    '语文': 'icon_subject_chinese.png',
                    '数学': 'icon_subject_math.png',
                    '英语': 'icon_subject_english.png',
                    '其它': 'icon_subject_other.png',
                    '口语': 'icon_subject_oral.png',
                    '新东方': 'icon_subject_xdf.png'
                };
                return map[subject] || 'icon_subject_custom.png';
            }

            const defaultTasks = [
                { id: 't1', name: '习题册', reward: 0, daily: true, note: '', category: '校内任务', subject: '语文', startDate: '2026-11-01', endDate: '' },
                { id: 't2', name: '口算', reward: 0, daily: true, note: '', category: '校内任务', subject: '数学', startDate: '2026-11-01', endDate: '' },
                { id: 't3', name: '英语阅读', reward: 0, daily: true, note: '', category: '校内任务', subject: '英语', startDate: '2026-11-01', endDate: '' }
            ];

            const defaultState = {
                tasks: [...defaultTasks],
                checkins: [],
                exams: [],
                extraTasks: [],
                shopItems: [],
                redemptions: [],
                profile: { name: 'HEIDI', avatar: '' }
            };

            function loadStateLocal() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        parsed.tasks = (parsed.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        if (!parsed.profile) parsed.profile = { name: 'HEIDI', avatar: '' };
                        if (!parsed.exams) parsed.exams = [];
                        if (!parsed.extraTasks) parsed.extraTasks = [];
                        if (!parsed.checkins) parsed.checkins = [];
                        if (!parsed.shopItems) parsed.shopItems = [];
                        if (!parsed.redemptions) parsed.redemptions = [];
                        return parsed;
                    } catch (e) {}
                }
                return JSON.parse(JSON.stringify(defaultState));
            }

            let state = loadStateLocal();
            let currentRole = 'child';
            let isAdminAuthenticated = false;

            const bjInit = getBeijingNow();
            let calendarWeekStart = getMondayOf(bjInit);

            let saveTimeout = null;
            let isSyncingFromCloud = false;
            let pendingLocalWrite = false;   // 本地改动尚未上传完成
            let pendingSince = 0;

            function hasPendingLocalWrite() {
                // 10 秒兜底，避免网络异常时永久阻塞云端读取
                return pendingLocalWrite && (Date.now() - pendingSince) < 10000;
            }

            function saveState() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                if (supabaseClient && !isSyncingFromCloud) {
                    pendingLocalWrite = true;
                    pendingSince = Date.now();
                    if (saveTimeout) clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(async () => {
                        try {
                            const payload = JSON.parse(JSON.stringify(state));
                            await supabaseClient.from('app_state').upsert({ id: 1, state_data: payload, updated_at: new Date().toISOString() });
                        } catch (error) {}
                        pendingLocalWrite = false;
                    }, 800);
                }
            }

            async function fetchCloudState() {
                if (!supabaseClient) return;
                if (hasPendingLocalWrite()) return;   // 本地刚打卡，别被云端旧数据覆盖
                try {
                    const { data, error } = await supabaseClient.from('app_state').select('state_data').eq('id', 1).single();
                    if (error) throw error;
                    if (data && data.state_data && Object.keys(data.state_data).length > 0) {
                        isSyncingFromCloud = true;
                        state = data.state_data;
                        state.tasks = (state.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        renderAll();
                        isSyncingFromCloud = false;
                    }
                } catch (error) {}
            }

            function setupRealtime() {
                if (!supabaseClient) return;
                supabaseClient.channel('app_state_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
                    if (hasPendingLocalWrite()) return;
                    const newState = payload.new.state_data;
                    if (newState && Object.keys(newState).length > 0) {
                        isSyncingFromCloud = true;
                        state = newState;
                        state.tasks = (state.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        renderAll();
                        setTimeout(() => { isSyncingFromCloud = false; }, 100);
                    }
                }).subscribe();
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getExamStars(score) {
                if (score === null || score === undefined || score === '') return 0;
                const s = parseFloat(score);
                if (s >= 100) return 50;
                if (s >= 90) return 25;
                return 0;
            }

            function calcTodayStars() {
                const today = getBeijingDateStr();
                let sum = 0;
                state.checkins.forEach(c => {
                    if (c.date === today && c.isExtra) sum += (c.reward || 0);
                });
                state.exams.forEach(e => {
                    if (e.date === today) sum += getExamStars(e.score);
                });
                return sum;
            }

            const MONTH_SETTLE_BONUS = 20;   // 每月结算固定奖励

            function getBeijingMonthPrefix(offsetMonths = 0) {
                const bj = getBeijingNow();
                const d = new Date(bj.getFullYear(), bj.getMonth() + offsetMonths, 1);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            }

            // 某月是否产生过星值（有额外任务打卡或考试记录）；空月份不结算 20 奖励，避免凭空累积
            function monthHasActivity(prefix) {
                return state.checkins.some(c => c.isExtra && c.date && c.date.startsWith(prefix))
                    || state.exams.some(e => e.date && e.date.startsWith(prefix));
            }

            // 某月结算星值 = 额外任务 + 考试 + 20（该月有记录才给）
            function calcMonthSettled(prefix) {
                let sum = 0;
                state.checkins.forEach(c => { if (c.isExtra && c.date && c.date.startsWith(prefix)) sum += (c.reward || 0); });
                state.exams.forEach(e => { if (e.date && e.date.startsWith(prefix)) sum += getExamStars(e.score); });
                if (monthHasActivity(prefix)) sum += MONTH_SETTLE_BONUS;
                return sum;
            }

            // 本月获得（当月未结束 → 尚未结算，不含 20 奖励）
            function calcMonthStars() {
                const prefix = getBeijingMonthPrefix(0);
                let extraSum = 0;
                let examSum = 0;
                state.checkins.forEach(c => { if (c.isExtra && c.date && c.date.startsWith(prefix)) extraSum += (c.reward || 0); });
                state.exams.forEach(e => { if (e.date && e.date.startsWith(prefix)) examSum += getExamStars(e.score); });
                return { total: extraSum + examSum, extraSum, examSum, monthlyBonus: 0, prefix };
            }

            // 已结算累计：所有"已过完"的月份（本月之前）结算之和，跨月不清零
            function calcSettledStars() {
                const cur = getBeijingMonthPrefix(0);
                const months = new Set();
                state.checkins.forEach(c => { if (c.isExtra && c.date) months.add(c.date.slice(0, 7)); });
                state.exams.forEach(e => { if (e.date) months.add(e.date.slice(0, 7)); });
                let total = 0;
                months.forEach(m => { if (m < cur) total += calcMonthSettled(m); });
                return total;
            }

            function calcRedeemedStars() {
                return (state.redemptions || []).reduce((sum, r) => sum + (r.cost || 0), 0);
            }

            // 星值商店可用余额 = 已结算累计 − 已兑换核销
            function calcShopBalance() {
                return calcSettledStars() - calcRedeemedStars();
            }

            // ===== 统一时间基准：全部用北京时间日期字符串 YYYY-MM-DD（字典序即时间序），不再混用 Date 时间戳 =====
            function shiftDateStr(dateStr, days) {
                const p = (dateStr || '').split('-');
                if (p.length !== 3) return dateStr;
                const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
                d.setUTCDate(d.getUTCDate() + days);
                return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
            }
            // 某任务在某一天是否有打卡
            function isCheckedOnDate(taskId, dateStr) {
                return state.checkins.some(c => !c.isExtra && c.taskId === taskId && c.date === dateStr);
            }
            // 周期任务：周期内任意一天打过卡即算完成（只需打一下）
            function isPeriodTaskChecked(task) {
                const from = task.startDate || '0000-01-01';
                const to = task.endDate || '9999-12-31';
                return state.checkins.some(c => !c.isExtra && c.taskId === task.id && c.date >= from && c.date <= to);
            }
            // 任务三类：每日重复 / 周期任务 / 今日任务（沿用现有字段，不新增必需字段）
            function isDailyTask(task) { return !!task.daily; }
            function isPeriodTask(task) { return !task.daily && !!task.endDate; }

            function isTaskCheckedToday(taskId) {
                return isCheckedOnDate(taskId, getBeijingDateStr());
            }
            // 任务是否处于有效期（决定能否出现在打卡列表）
            function isTaskInValidPeriod(task, today) {
                const start = task.startDate || today;
                if (today < start) return false;
                if (isDailyTask(task)) return !task.endDate || today <= task.endDate;
                if (isPeriodTask(task)) return today <= task.endDate;
                return task.startDate === today;   // 今日任务仅当天有效
            }
            function canTaskCheck(task) {
                const today = getBeijingDateStr();
                if (!isTaskInValidPeriod(task, today)) return false;
                if (isPeriodTask(task) && isPeriodTaskChecked(task)) return false;  // 周期任务只需打一次
                return true;
            }
            // 打卡列表里的"完成态"
            function isTaskCheckedForDisplay(task, today) {
                if (isPeriodTask(task)) return isPeriodTaskChecked(task);
                return isCheckedOnDate(task.id, today);
            }
            // 该任务在指定日期是否"应打卡"（日历标注与未完成任务共用同一判定源）
            function isTaskDueOnDate(task, dateStr) {
                const start = task.startDate || dateStr;
                if (dateStr < start) return false;
                if (isDailyTask(task)) return !task.endDate || dateStr <= task.endDate;
                if (isPeriodTask(task)) return dateStr === task.endDate;  // 周期任务只在结束日结算
                return task.startDate === dateStr;                        // 今日任务只在任务日
            }
            function isTaskDoneOnDate(task, dateStr) {
                if (isPeriodTask(task)) return isPeriodTaskChecked(task);
                return isCheckedOnDate(task.id, dateStr);
            }

            function getDayCompletionStatus(dateStr) {
                const today = getBeijingDateStr();
                if (dateStr >= today) return 'none';   // 今天及未来不做完成标注
                const dueTasks = state.tasks.filter(t => isTaskDueOnDate(t, dateStr));
                const extraTasks = state.extraTasks.filter(t => t.createdDate === dateStr);
                const total = dueTasks.length + extraTasks.length;
                if (total === 0) return 'none';

                let completed = 0;
                dueTasks.forEach(t => { if (isTaskDoneOnDate(t, dateStr)) completed++; });
                extraTasks.forEach(t => {
                    if (state.checkins.some(c => c.date === dateStr && c.taskId === t.id && c.isExtra)) completed++;
                });
                return completed >= total ? 'completed' : 'incomplete';
            }

                monthLabel.textContent = monthNames[start.getMonth()];

                grid.innerHTML = cells.map(c => {

            function renderOverdueTasks() {
                const container = document.getElementById('overdueTaskList');
                if (!container) return;

                const today = getBeijingDateStr();
                // 每日任务只回溯最近 2 个"已过 24:00"的日期（昨天、前天）；今天仍可打卡，不计入未完成。
                // 这里只做渲染过滤，绝不删除 state 里的任何数据。
                const LOOKBACK_DAYS = 2;
                const lookbackDates = [];
                for (let i = 1; i <= LOOKBACK_DAYS; i++) lookbackDates.push(shiftDateStr(today, -i));

                const items = [];   // { task, missed: [日期...] }

                state.tasks.forEach(task => {
                    const start = task.startDate || today;
                    if (isDailyTask(task)) {
                        // 每日重复：列出最近两天内漏打卡的日期
                        const missed = lookbackDates.filter(d => {
                            if (d < start) return false;
                            if (task.endDate && d > task.endDate) return false;
                            return !isCheckedOnDate(task.id, d);
                        });
                        if (missed.length > 0) items.push({ task, missed });
                    } else if (isPeriodTask(task)) {
                        // 周期任务：结束当天过了 24:00 才结算；周期内打过一次即完成
                        if (today > task.endDate && !isPeriodTaskChecked(task)) {
                            items.push({ task, missed: [task.endDate] });
                        }
                    } else {
                        // 今日任务：任务当天过了 24:00 才显示
                        if (today > start && !isCheckedOnDate(task.id, start)) {
                            items.push({ task, missed: [start] });
                        }
                    }
                });

                items.sort((a, b) => (b.missed[0] || '').localeCompare(a.missed[0] || ''));
                document.getElementById('overdueCountBadge').textContent = `${items.length}项`;

                if (items.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 8px; padding:16px;color:var(--text-sub);background:transparent;border-radius:var(--radius-card);font-weight:800;"><img src="icon_done.svg" class="zoom-icon" style="width: 18px; height: 18px; object-fit: contain;"> 全部完成啦！</div>`;
                    return;
                }

                container.innerHTML = items.map(({ task, missed }) => {
                    let tagsHtml = `
                        <span class="tag ${getTagClass(task.category)}">${task.category}</span>
                        ${task.subject ? `<span class="tag ${getTagClass(task.subject)}">${task.subject}</span>` : ''}
                    `;

                    if (isDailyTask(task)) {
                        tagsHtml += `<span class="tag tag-green"><img src="icon_repeat.svg" class="icon-repeat-small"> 每日</span>`;
                    } else if (isPeriodTask(task)) {
                        tagsHtml += `<span class="tag tag-date">周期任务</span>`;
                    } else {
                        tagsHtml += `<span class="tag tag-today">今日任务</span>`;
                    }

                    // 未完成时间：每日任务列出具体漏打卡日期，其余列出结算日
                    const missedLabel = missed.map(d => d.slice(5)).join('、');
                    tagsHtml += `<span class="tag tag-pink">未完成：${missedLabel}</span>`;

                    const showAdminActions = (currentRole === 'admin' && isAdminAuthenticated);
                    const actionHtml = showAdminActions ? `
                        <div class="task-actions">
                            <button class="icon-btn" data-action="edit-task" data-task-id="${task.id}"><img src="icon_edit.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>
                            <button class="icon-btn" data-action="delete-task" data-task-id="${task.id}"><img src="icon_delete.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>
                        </div>
                    ` : '';

                    return `
                        <div class="task-item overdue">
                            <div class="task-icon">
                                <img src="${getSubjectIcon(task.subject)}" class="zoom-icon" style="width: 26px; height: 26px; object-fit: contain;">
                            </div>
                            <div class="task-info">
                                <div class="task-name">${escapeHtml(task.name)}</div>
                                <div class="task-meta">
                                    ${tagsHtml}
                                </div>
                            </div>
                            ${actionHtml}
                        </div>
                    `;
                }).join('');
            }

                currentView = view;
                ['home', 'shop', 'stats'].forEach(v => {
                    const el = document.getElementById('view' + v.charAt(0).toUpperCase() + v.slice(1));
                    if (el) el.classList.toggle('hidden', v !== view);
                });
                document.querySelectorAll('.bottom-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === view);
                });
                if (view === 'shop') renderShopPage();
                if (view === 'stats') renderStatsPage();
                window.scrollTo({ top: 0, behavior: 'auto' });
            }

            // ================= 星值商店 =================
            function uid() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            }

            // 固定兑换商品 money：不写入 state.shopItems，始终存在、不可删除
            const MONEY_ITEM_ID = '__money__';
            const MONEY_ICON = 'icon_shop_money.png';
            let moneyAmount = 0;   // 本次要兑换的星值（仅内存，兑换后清零）

            function renderShopPage() {
                const balanceEl = document.getElementById('shopBalanceNum');
                if (!balanceEl) return;
                const balance = Math.max(0, calcShopBalance());
                balanceEl.textContent = balance;
                const pending = calcMonthStars().total;   // 本月尚未结算，过月底 24:00 后才进入总星值
                const tip = document.getElementById('shopHeroTip');
                if (tip) tip.innerHTML = `本月待结算 <b>${pending}</b> 星值`;

                const isAdmin = (currentRole === 'admin' && isAdminAuthenticated);
                const addBtn = document.getElementById('addShopItemBtn');
                if (addBtn) addBtn.classList.toggle('hidden', !isAdmin);

                const items = state.shopItems || [];
                // money 为固定项，不参与"已删除商品"清理
                selectedShopIds = new Set([...selectedShopIds].filter(id =>
                    id === MONEY_ITEM_ID || items.some(i => i.id === id)));

                const grid = document.getElementById('shopGrid');
                const empty = document.getElementById('shopEmpty');
                if (empty) empty.classList.add('hidden');   // 固定商品 money 始终存在

                const moneySelected = selectedShopIds.has(MONEY_ITEM_ID);
                const moneyCard = `
                    <div class="shop-item ${moneySelected ? 'selected' : ''}" data-shop-id="${MONEY_ITEM_ID}">
                        <div class="shop-item-img" style="position:relative; background:#fff6e0;">
                            <span style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900; color:#e3a53c;">¥</span>
                            <img src="${MONEY_ICON}" alt="" style="position:relative; object-fit: contain; padding: 6px; background:#fff6e0;"
                                 onload="this.previousElementSibling.style.display='none'"
                                 onerror="this.style.display='none';this.removeAttribute('src')">
                        </div>
                        <div class="shop-item-info">
                            <div class="shop-item-name">money</div>
                            <div class="shop-money-row">
                                <input id="moneyAmountInput" class="shop-money-input" type="text" inputmode="numeric"
                                       placeholder="填星值" value="${moneyAmount || ''}" aria-label="兑换星值">
                                <span class="shop-money-hint">可填 1 ~ ${balance} 的整数</span>
                            </div>
                        </div>
                        <div class="shop-check">✓</div>
                    </div>
                `;

                const otherCards = items.map(item => `
                    <div class="shop-item ${selectedShopIds.has(item.id) ? 'selected' : ''}" data-shop-id="${item.id}">
                        <div class="shop-item-img">
                            ${item.image
                                ? `<img src="${item.image}" alt="">`
                                : `<img src="icon_gift_card.png" alt="" style="object-fit: contain; padding: 6px;">`}
                        </div>
                        <div class="shop-item-info">
                            <div class="shop-item-name">${escapeHtml(item.name)}</div>
                            <div class="shop-item-cost"><img src="icon_star.svg">${item.cost}</div>
                        </div>
                        ${isAdmin ? `<button class="shop-item-del" data-action="del-shop-item" data-shop-id="${item.id}" title="删除">×</button>` : ''}
                        <div class="shop-check">✓</div>
                    </div>
                `).join('');

                grid.innerHTML = moneyCard + otherCards;
            }

            function toggleShopSelect(id) {
                // money 打勾前必须填好合法整数（1 ~ 可用星值）
                if (id === MONEY_ITEM_ID && !selectedShopIds.has(id)) {
                    const balance = Math.max(0, calcShopBalance());
                    const el = document.getElementById('moneyAmountInput');
                    const raw = el ? el.value : moneyAmount;
                    const v = parseInt(String(raw).replace(/[^0-9]/g, ''), 10);
                    if (!v || v < 1) { showToast('请先填写要兑换的星值', false); return; }
                    if (v > balance) { showToast(`不能超过可用星值 ${balance}`, false); return; }
                    moneyAmount = v;
                }
                if (selectedShopIds.has(id)) selectedShopIds.delete(id);
                else selectedShopIds.add(id);
                renderShopPage();
            }

            function doClearSelection() {
                if (selectedShopIds.size === 0 && !moneyAmount) { showToast('当前没有选择', false); return; }
                selectedShopIds.clear();
                moneyAmount = 0;
                renderShopPage();
                showToast('已清空选择');
            }

            function doRedeem() {
                if (selectedShopIds.size === 0) { showToast('请先选择要兑换的商品', false); return; }
                const balance = calcShopBalance();
                const items = [...selectedShopIds].map(id => {
                    if (id === MONEY_ITEM_ID) return { id: MONEY_ITEM_ID, name: 'money', cost: moneyAmount };
                    return (state.shopItems || []).find(i => i.id === id);
                }).filter(Boolean);

                // money 金额再次校验，避免输入被改动后超额
                if (selectedShopIds.has(MONEY_ITEM_ID)) {
                    if (!moneyAmount || moneyAmount < 1) { showToast('请先填写要兑换的星值', false); return; }
                    if (moneyAmount > balance) { showToast(`不能超过可用星值 ${balance}`, false); return; }
                }

                const cost = items.reduce((sum, i) => sum + (i.cost || 0), 0);
                if (cost > balance) {
                    showToast(`星值不足，还差 ${cost - balance}`, false);
                    return;
                }
                const names = items.map(i => `${escapeHtml(i.name)}（${i.cost}★）`).join('、');
                showModal({
                    title: '确认兑换',
                    contentHTML: `<div style="font-size:14px; font-weight:800; line-height:1.7; color:var(--text-main);">
                        商品：${names}<br>
                        合计扣除：<span style="color:var(--accent);">${cost}</span> 星值<br>
                        兑换后可用星值：<span style="color:var(--accent);">${balance - cost}</span>
                    </div>`,
                    confirmText: '确认兑换',
                    cancelText: '再想想',
                    onConfirm: () => {
                        const today = getBeijingDateStr();
                        items.forEach(i => {
                            state.redemptions.push({ id: uid(), itemId: i.id, name: i.name, cost: i.cost || 0, date: today, timestamp: Date.now() });
                        });
                        selectedShopIds.clear();
                        moneyAmount = 0;
                        saveState();
                        renderAll();
                        renderShopPage();
                        showToast(`兑换成功，扣除 ${cost} 星值`);
                    }
                });
            }

            function openShopItemModal() {
                let pendingImage = '';
                showModal({
                    title: '新增商品',
                    contentHTML: `
                        <div style="display:flex; flex-direction:column; gap:2px;">
                            <div class="modal-label" style="margin-bottom:8px;">商品图片</div>
                            <div style="display:flex; align-items:center; gap:14px; margin-bottom:18px;">
                                <label for="shopImgInput" style="width:72px; height:72px; border-radius:20px; background:var(--bg-card); border:1px dashed var(--border-light); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; flex-shrink:0;" id="shopImgPreview">
                                    <img src="icon_camera.svg" class="zoom-icon" style="width: 14px; height: 14px;">
                                </label>
                                <span style="font-size:12px; color:var(--text-sub); font-weight:700;">点击左侧上传（可选）</span>
                                <input id="shopImgInput" type="file" accept="image/*" style="display:none;">
                            </div>
                            <label class="modal-label" for="shopItemName">商品名称</label>
                            <input id="shopItemName" type="text" placeholder="例如：看动画片 30 分钟">
                            <label class="modal-label" for="shopItemCost">所需星值</label>
                            <input id="shopItemCost" type="text" inputmode="numeric" value="20" placeholder="例如：20">
                            <div class="shop-item-err" id="shopItemErr"></div>
                        </div>
                    `,
                    confirmText: '保存',
                    onConfirm: () => {
                        // 校验不通过时返回 false → 弹窗保持打开，直接改，不会出现"点了保存却没加上"
                        const errEl = document.getElementById('shopItemErr');
                        const fail = (msg) => {
                            if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
                            showToast(msg, false);
                            return false;
                        };
                        const nameEl = document.getElementById('shopItemName');
                        const costEl = document.getElementById('shopItemCost');
                        const name = nameEl ? (nameEl.value || '').trim() : '';
                        const costRaw = costEl ? String(costEl.value || '').replace(/[^0-9]/g, '') : '';
                        const cost = parseInt(costRaw, 10);
                        if (!name) return fail('请填写商品名称');
                        if (!cost || cost <= 0) return fail('请填写正确的星值（大于 0 的整数）');

                        if (!state.shopItems) state.shopItems = [];
                        state.shopItems.push({ id: uid(), name, cost, image: pendingImage, createdAt: getBeijingDateStr() });
                        saveState();
                        renderShopPage();
                        showToast('商品已添加');
                    }
                });

                setTimeout(() => {
                    const input = document.getElementById('shopImgInput');
                    const preview = document.getElementById('shopImgPreview');
                    if (!input) return;
                    input.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                const maxSize = 160;
                                let w = img.width, h = img.height;
                                if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
                                else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
                                const canvas = document.createElement('canvas');
                                canvas.width = w; canvas.height = h;
                                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                pendingImage = canvas.toDataURL('image/jpeg', 0.82);
                                if (preview) preview.innerHTML = `<img src="${pendingImage}" style="width:100%;height:100%;object-fit:cover;">`;
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }, 0);
            }

            function deleteShopItem(id) {
                const item = (state.shopItems || []).find(i => i.id === id);
                if (!item) return;
                showModal({
                    title: '删除商品',
                    content: `确定删除「${item.name}」？已兑换的记录会保留。`,
                    confirmText: '删除',
                    danger: true,
                    onConfirm: () => {
                        state.shopItems = state.shopItems.filter(i => i.id !== id);
                        selectedShopIds.delete(id);
                        saveState();
                        renderShopPage();
                        showToast('商品已删除');
                    }
                });
            }

            // ================= 统计页面 =================

                const redeemed = calcRedeemedStars();
                const balance = settled - redeemed;
                const isAdmin = (currentRole === 'admin' && isAdminAuthenticated);

                // 纯展示：只在当月最后一天显示 20，不写入 state、不参与任何星值计算
                const bjNow = getBeijingNow();
                const isMonthLastDay = bjNow.getDate() === new Date(bjNow.getFullYear(), bjNow.getMonth() + 1, 0).getDate();
                const monthBonusCell = isMonthLastDay
                    ? `<div style="color:var(--accent); display:flex; align-items:center; gap:4px; font-weight:900;">20<img src="icon_star.svg" style="width:16px;height:16px;object-fit:contain;"></div>`

                const logs = (state.redemptions || []).slice().sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 20);
                const logHtml = logs.length === 0

                                ${isAdmin ? `<button class="icon-btn" data-action="revoke-redeem" data-redeem-id="${r.id}" title="撤销并退回星值"><img src="icon_delete.svg" class="zoom-icon" style="width: 12px; height: 12px;"></button>` : ''}

                    `).join('');

                el.innerHTML = `
                    <div class="section-title" style="font-size:20px; margin:4px 4px 14px;">星值统计</div>
                    <div class="stats-page-card hl">

                        <span class="val">${calcTodayStars()}<img src="icon_star.svg"></span>
                    </div>
                    <div class="stats-page-card">
                        <span class="lbl">本月获得（未结算）</span>
                        <span class="val">${monthData.total}<img src="icon_star.svg"></span>

                    <div class="stats-page-card">

                    </div>
                    <div class="stats-page-card">
                        <span class="lbl">可用星值</span>
                        <span class="val">${Math.max(0, balance)}<img src="icon_star.svg"></span>
                    </div>

                    <div class="section-wrapper" style="margin-top:14px;">
                        <div class="section-title"><span>本月明细</span></div>
                        <div style="padding:4px 4px 12px;">
                            <div class="redeem-log-row"><div>额外任务奖励</div><div style="color:var(--accent);">${monthData.extraSum}</div></div>
                            <div class="redeem-log-row"><div>考试任务奖励</div><div style="color:var(--accent);">${monthData.examSum}</div></div>
                            <div class="redeem-log-row"><div>月底结算奖励</div>${monthBonusCell}</div>

            function revokeRedeem(recordId) {
                const rec = (state.redemptions || []).find(r => r.id === recordId);
                if (!rec) return;
                showModal({
                    title: '撤销兑换',
                    content: `撤销「${rec.name}」的兑换，${rec.cost} 星值将退回可用星值。`,
                    confirmText: '撤销',
                    danger: true,
                    onConfirm: () => {
                        state.redemptions = state.redemptions.filter(r => r.id !== recordId);
                        saveState();
                        renderStatsPage();
                        renderShopPage();
                        showToast(`已撤销，退回 ${rec.cost} 星值`);
                    }
                });
            }

            function showToast(message, isSuccess = true) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';
                const icon = isSuccess ? 'icon_toast_ok.svg' : 'icon_toast_warn.svg';
                toast.innerHTML = `<img src="${icon}" class="zoom-icon" style="width: 14px; height: 14px;"> ${escapeHtml(message)}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    toast.style.transition = 'all 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }

            function toggleTaskCheck(taskId) {
                const today = getBeijingDateStr();
                const task = state.tasks.find(t => t.id === taskId);
                if (!task) return;

                const isAdminOp = (currentRole === 'admin' && isAdminAuthenticated);

                // 周期任务：周期内打一次即完成，因此取消也要能取消"非今天"的那一条
                if (isPeriodTask(task)) {
                    const pIdx = state.checkins.findIndex(c => !c.isExtra && c.taskId === taskId
                        && c.date >= (task.startDate || '0000-01-01') && c.date <= (task.endDate || '9999-12-31'));
                    const expired = today > (task.endDate || '9999-12-31');   // 过了截止 24:00
                    if (pIdx !== -1) {
                        if (expired && !isAdminOp) {
                            showToast('该周期任务已截止，不可取消', false);
                            return;
                        }
                        state.checkins.splice(pIdx, 1);
                        showToast('取消完成');
                    } else {
                        if (expired && !isAdminOp) {
                            showToast('该周期任务已截止，不可打卡', false);
                            return;
                        }
                        if (!canTaskCheck(task)) {
                            showToast('该任务当前不可打卡', false);
                            return;
                        }
                        state.checkins.push({ date: today, taskId, timestamp: Date.now() });
                        showToast('完成打卡');
                    }
                    saveState();
                    renderAll();
                    return;
                }

                // 非周期任务：历史日期的打卡不可取消（跨天不可改），管理员可操作
                const existingIndex = state.checkins.findIndex(c => c.date === today && c.taskId === taskId && !c.isExtra);
                if (existingIndex !== -1) {
                    state.checkins.splice(existingIndex, 1);
                    showToast(`取消完成`);
                } else {
                    if (!canTaskCheck(task)) {
                        showToast(`该任务当前不可打卡`, false);
                        return;
                    }
                    state.checkins.push({ date: today, taskId, timestamp: Date.now() });
                    showToast(`完成打卡`);
                }
                saveState();
                renderAll();
            }

            function toggleExtraCheck(extraId) {
                const today = getBeijingDateStr();
                const extraTask = state.extraTasks.find(t => t.id === extraId);
                if (!extraTask) return;

                const existingIndex = state.checkins.findIndex(c => c.date === today && c.taskId === extraId && c.isExtra);
                if (existingIndex !== -1) {
                    // 统一北京时间：只允许取消当天产生的打卡
                    if (state.checkins[existingIndex].date !== getBeijingDateStr() && currentRole !== 'admin') {
                        showToast('过期的打卡不可取消', false);
                        return;
                    }
                    state.checkins.splice(existingIndex, 1);
                    showToast(`取消额外任务`);
                } else {
                    state.checkins.push({ date: today, taskId: extraId, reward: extraTask.reward, timestamp: Date.now(), isExtra: true });
                    const rewardStr = extraTask.reward >= 0 ? '+' + extraTask.reward : extraTask.reward;
                    showToast(`完成额外任务 ${rewardStr}星`);
                }
                saveState();
                renderAll();
            }

            function deleteTaskConfirm(taskId) {
                if (!(currentRole === 'admin' && isAdminAuthenticated)) return;

                showModal({

            function showModal({ title, content, contentHTML, confirmText = '确认', cancelText = '取消', danger = false, onConfirm, onCancel }) {
                const modalRoot = document.getElementById('modalRoot');
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'modal-content';

                const cancelBtnHtml = cancelText ? `<button class="btn-cancel" id="modalCancel">${cancelText}</button>` : '';
                const actionStyle = cancelText ? '' : 'width: 100%;';

                let titleHtml = title.includes('<img') ? `<div style="display:flex; justify-content:center; align-items:center; gap:8px;">${title}</div>` : escapeHtml(title);

                modal.innerHTML = `
                    <h3>${titleHtml}</h3>
                    <div id="modalBody">${contentHTML || `<p style="margin-bottom:24px; color:var(--text-main); font-weight:600; text-align:center;">${escapeHtml(content || '')}</p>`}</div>
                    <div class="modal-actions">
                        ${cancelBtnHtml}
                        <button class="${danger ? 'btn-danger' : 'btn-confirm'}" id="modalConfirm" style="${actionStyle}">${confirmText}</button>
                    </div>
                `;
                overlay.appendChild(modal);
                modalRoot.appendChild(overlay);

                const closeModal = () => overlay.remove();

                const cancelBtn = document.getElementById('modalCancel');
                if (cancelBtn) {
                    cancelBtn.onclick = () => {
                        if (onCancel && onCancel() === false) return;
                        closeModal();
                    };
                }

                document.getElementById('modalConfirm').onclick = () => {
                    if (onConfirm && onConfirm() === false) return;
                    closeModal();
                };
                overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
                // Esc 关闭弹窗（桌面端/外接键盘的常见预期）
                const onEsc = (e) => {
                    if (e.key === 'Escape') {
                        closeModal();
                        document.removeEventListener('keydown', onEsc);
                    }
                };
                document.addEventListener('keydown', onEsc);
            }

                let pendingAvatar = state.profile.avatar || '';

                showModal({

                    confirmText: '保存',
                    onConfirm: () => {
                        const name = document.getElementById('profileNameInput').value.trim() || 'HEIDI';
                        state.profile.name = name;
                        state.profile.avatar = pendingAvatar;
                        saveState();
                        renderAll();
                        showToast('资料已更新');
                    }
                });

                setTimeout(() => {
                    const fileInput = document.getElementById('avatarFileInput');
                    const preview = document.getElementById('avatarPreview');
                    if (!fileInput) return;
                    fileInput.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                const maxSize = 200;
                                let w = img.width, h = img.height;
                                if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
                                else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
                                const canvas = document.createElement('canvas');
                                canvas.width = w; canvas.height = h;
                                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                pendingAvatar = canvas.toDataURL('image/jpeg', 0.85);
                                preview.style.backgroundImage = `url(${pendingAvatar})`;
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }, 0);
            }

                        <textarea id="ocrResult" rows="6" placeholder="识别结果会显示在这里..."></textarea>

                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">

                            <label for="ocrSplitCheck" style="margin:0; font-size:14px; color:var(--text-main); cursor:pointer; font-weight:800;">按换行拆分多个任务</label>
                        </div>

                        <div style="background:var(--bg-page); padding:16px; border-radius:20px; border: 1px solid var(--border-light);">
                            <div style="font-size:13px; font-weight:900; color:var(--text-main); margin-bottom:12px;">统一设置（应用给上述任务）</div>
                            <label style="color:var(--text-main);">分类</label>
                            <select id="ocrCategory" onchange="updateOcrSubjectOptions()">
                                <option value="校内任务">校内任务</option>
                                <option value="校外任务">校外任务</option>
                            </select>
                            <label style="color:var(--text-main);">学科</label>
                            <div id="ocrSubjectContainer">
                                <select id="ocrSubjectSelect">
                                    <option value="语文">语文</option>

                                </select>

                            <div style="display:flex; gap:12px; margin-bottom:16px;">
                                <div style="flex:1;">
                                    <label style="color:var(--text-main);">开始时间</label>

                                    <label style="color:var(--text-main);">结束时间(留空即当日)</label>

                                        <button type="button" class="btn-outline" onclick="document.getElementById('ocrEndDate').value=''" style="padding:0 10px; font-size:12px; height: 50px;">清空</button>
                                    </div>
                                </div>
                            </div>

                            <label style="color:var(--text-main);">每日重复</label>
                            <select id="ocrDaily" style="margin-bottom:0; background:var(--bg-nav);">
                                <option value="false" selected>否</option>
                                <option value="true">是</option>
                            </select>
                        </div>
                    `,
                    confirmText: '批量生成',
                    onConfirm: () => {
                        const rawText = document.getElementById('ocrResult').value.trim();
                        if (!rawText) { showToast('请先识别或输入文字', false); return false; }

                        const isSplit = document.getElementById('ocrSplitCheck').checked;
                        const category = document.getElementById('ocrCategory').value;
                        let subject = '';
                        const ocrSelect = document.getElementById('ocrSubjectSelect');
                        if (category === '校内任务') {
                            subject = ocrSelect.value;
                        } else {
                            if (ocrSelect.value === '__custom__') {
                                const customVal = (document.getElementById('ocrSubjectInput') || {}).value || '';

                                subject = ocrSelect.value;

                        }
                        const startDate = document.getElementById('ocrStartDate').value || today;
                        const endDate = document.getElementById('ocrEndDate').value;
                        const daily = document.getElementById('ocrDaily').value === 'true';

                window.toggleOcrCustomSubjectInput = function() {

                    if (!select || !input) return;
                    if (select.value === '__custom__') {
                        input.style.display = '';
                    } else {
                        input.style.display = 'none';
                    }
                };

                window.updateOcrSubjectOptions = function() {
                    const cat = document.getElementById('ocrCategory').value;
                    const container = document.getElementById('ocrSubjectContainer');
                    if (cat === '校内任务') {
                        container.innerHTML = `
                            <select id="ocrSubjectSelect">
                                <option value="语文">语文</option>
                                <option value="数学">数学</option>
                                <option value="英语">英语</option>
                                <option value="其它">其它</option>

                                <option value="新东方">新东方</option>
                                <option value="__custom__">自定义</option>
