            function openImageCropper(src, onDone) {
                const overlay = document.createElement('div');
                overlay.className = 'crop-overlay';
                overlay.innerHTML = `
                    <div class="crop-title">拖动图片 · 缩放后裁剪</div>
                    <div class="crop-stage" id="cropStage">
                        <img id="cropImg" src="${src}" alt="">
                        <div class="crop-guide"></div>
                    </div>
                    <div class="crop-toolbar">
                        <span>缩放</span>
                        <input type="range" id="cropZoom" min="100" max="400" value="100">
                    </div>
                    <div class="crop-actions">
                        <button class="btn-outline" id="cropCancel">取消</button>
                        <button class="btn-primary" id="cropConfirm">使用图片</button>
                    </div>
                `;
                document.body.appendChild(overlay);

                const stage = overlay.querySelector('#cropStage');
                const img = overlay.querySelector('#cropImg');
                const zoomInput = overlay.querySelector('#cropZoom');
                let zoom = 1, k = 1, left = 0, top = 0;
                let dragging = false, dsx = 0, dsy = 0, dl = 0, dt = 0;
                let pinchDist = 0, pinchZoom = 1;

                const apply = () => {
                    img.style.width = (img.naturalWidth * k) + 'px';
                    img.style.height = (img.naturalHeight * k) + 'px';
                    img.style.left = left + 'px';
                    img.style.top = top + 'px';
                };
                const clamp = () => {
                    const S = stage.clientWidth;
                    left = Math.min(0, Math.max(S - img.naturalWidth * k, left));
                    top = Math.min(0, Math.max(S - img.naturalHeight * k, top));
                };
                const init = () => {
                    const S = stage.clientWidth;
                    k = Math.max(S / img.naturalWidth, S / img.naturalHeight);
                    left = (S - img.naturalWidth * k) / 2;
                    top = (S - img.naturalHeight * k) / 2;
                    clamp(); apply();
                };
                const setZoom = (z, cx, cy) => {
                    if (!img.naturalWidth) return;
                    const S = stage.clientWidth;
                    const oldK = k;
                    zoom = Math.max(1, Math.min(4, z));
                    k = Math.max(S / img.naturalWidth, S / img.naturalHeight) * zoom;
                    const ax = (cx == null ? S / 2 : cx), ay = (cy == null ? S / 2 : cy);
                    left = ax - (ax - left) * (k / oldK);
                    top = ay - (ay - top) * (k / oldK);
                    clamp(); apply();
                    zoomInput.value = Math.round(zoom * 100);
                };
                if (img.complete && img.naturalWidth) init(); else img.onload = init;

                stage.addEventListener('pointerdown', (e) => {
                    if (e.isPrimary === false) return;
                    dragging = true; dsx = e.clientX; dsy = e.clientY; dl = left; dt = top;
                    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
                });
                stage.addEventListener('pointermove', (e) => {
                    if (!dragging) return;
                    left = dl + (e.clientX - dsx);
                    top = dt + (e.clientY - dsy);
                    clamp(); apply();
                });
                const endDrag = () => { dragging = false; };
                stage.addEventListener('pointerup', endDrag);
                stage.addEventListener('pointercancel', endDrag);

                stage.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    setZoom(zoom * (e.deltaY < 0 ? 1.1 : 0.9));
                }, { passive: false });

                stage.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        dragging = false;
                        pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                               e.touches[0].clientY - e.touches[1].clientY);
                        pinchZoom = zoom;
                    }
                }, { passive: true });
                stage.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && pinchDist) {
                        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                             e.touches[0].clientY - e.touches[1].clientY);
                        const r = stage.getBoundingClientRect();
                        setZoom(pinchZoom * d / pinchDist,
                                (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left,
                                (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top);
                        e.preventDefault();
                    }
                }, { passive: false });
                stage.addEventListener('touchend', () => { pinchDist = 0; }, { passive: true });

                zoomInput.addEventListener('input', () => setZoom(parseInt(zoomInput.value, 10) / 100));

                const escHandler = (e) => {
                    if (e.key === 'Escape') { e.stopImmediatePropagation(); e.preventDefault(); close(); }
                };
                const close = () => {
                    overlay.remove();
                    document.removeEventListener('keydown', escHandler, true);
                };
                document.addEventListener('keydown', escHandler, true);

                overlay.querySelector('#cropCancel').onclick = () => close();
                overlay.querySelector('#cropConfirm').onclick = () => {
                    if (!img.naturalWidth) { close(); return; }
                    const S = stage.clientWidth;
                    const sx = -left / k, sy = -top / k, sw = S / k, sh = S / k;
                    const canvas = document.createElement('canvas');
                    canvas.width = 160; canvas.height = 160;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 160, 160);
                    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 160, 160);
                    const out = canvas.toDataURL('image/jpeg', 0.82);
                    close();
                    onDone(out);
                };
            }

            function toggleTaskCheck(taskId) {
                const today = getBeijingDateStr();
                const task = state.tasks.find(t => t.id === taskId);
                if (!task) return;

                const isAdminOp = (currentRole === 'admin' && isAdminAuthenticated);

                if (isPeriodTask(task)) {
                    const pIdx = state.checkins.findIndex(c => !c.isExtra && c.taskId === taskId
                        && c.date >= (task.startDate || '0000-01-01') && c.date <= (task.endDate || '9999-12-31'));
                    const expired = today > (task.endDate || '9999-12-31');
                    if (pIdx !== -1) {
                        if (expired && !isAdminOp) {
                            showToast('该周期任务已截止，不可取消', false);
                            return;
                        }
                        state.checkins.splice(pIdx, 1);
                        showToast('取消完成');
                    } else {
                        if (expired && !isAdminOp) {
                            showToast('该周期任务已截止，不可打卡', false);
                            return;
                        }
                        if (!canTaskCheck(task)) {
                            showToast('该任务当前不可打卡', false);
                            return;
                        }
                        state.checkins.push({ date: today, taskId, timestamp: Date.now() });
                        showToast('完成打卡');
                    }
                    saveState();
                    renderAll();
                    maybeCelebrateToday();
                stmOnCheckinChange();
                    return;
                }

                const existingIndex = state.checkins.findIndex(c => c.date === today && c.taskId === taskId && !c.isExtra);
                if (existingIndex !== -1) {
                    state.checkins.splice(existingIndex, 1);
                    showToast(`取消完成`);
                } else {
                    if (!canTaskCheck(task)) {
                        showToast(`该任务当前不可打卡`, false);
                        return;
                    }
                    state.checkins.push({ date: today, taskId, timestamp: Date.now() });
                    showToast(`完成打卡`);
                }
                saveState();
                renderAll();
                maybeCelebrateToday();
                stmOnCheckinChange();
            }

            function toggleExtraCheck(extraId) {
                const today = getBeijingDateStr();
                const extraTask = state.extraTasks.find(t => t.id === extraId);
                if (!extraTask) return;

                const existingIndex = state.checkins.findIndex(c => c.taskId === extraId && c.isExtra);
                if (existingIndex !== -1) {
                    if (state.checkins[existingIndex].date !== getBeijingDateStr() && currentRole !== 'admin') {

            function showModal({ title, content, contentHTML, confirmText = '确认', cancelText = '取消', danger = false, onConfirm, onCancel }) {
                const modalRoot = document.getElementById('modalRoot');
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'modal-content';

                const cancelBtnHtml = cancelText ? `<button class="btn-cancel" id="modalCancel">${cancelText}</button>` : '';
                const actionStyle = cancelText ? '' : 'width: 100%;';

                let titleHtml = title.includes('<img') ? `<div style="display:flex; justify-content:center; align-items:center; gap:8px;">${title}</div>` : escapeHtml(title);

                modal.innerHTML = `
                    <h3>${titleHtml}</h3>
                    <div id="modalBody">${contentHTML || `<p style="margin-bottom:24px; color:var(--text-main); font-weight:600; text-align:center;">${escapeHtml(content || '')}</p>`}</div>
                    <div class="modal-actions">
                        ${cancelBtnHtml}
                        <button class="${danger ? 'btn-danger' : 'btn-confirm'}" id="modalConfirm" style="${actionStyle}">${confirmText}</button>
                    </div>
                `;
                overlay.appendChild(modal);
                modalRoot.appendChild(overlay);

                const closeModal = () => overlay.remove();

                const cancelBtn = document.getElementById('modalCancel');
                if (cancelBtn) {
                    cancelBtn.onclick = () => {
                        if (onCancel && onCancel() === false) return;
                        closeModal();
                    };
                }

                document.getElementById('modalConfirm').onclick = () => {
                    if (onConfirm && onConfirm() === false) return;
                    closeModal();
                };
                overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
                const onEsc = (e) => {
                    if (e.key === 'Escape') {
                        closeModal();
                        document.removeEventListener('keydown', onEsc);
                    }
                };
                document.addEventListener('keydown', onEsc);
            }

                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                const maxSize = 200;
                                let w = img.width, h = img.height;
                                if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
                                else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
                                const canvas = document.createElement('canvas');
                                canvas.width = w; canvas.height = h;
                                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                pendingAvatar = canvas.toDataURL('image/jpeg', 0.85);
                                preview.style.backgroundImage = `url(${pendingAvatar})`;
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }, 0);
            }

            // ===== 全部打卡庆祝：双侧拉炮彩纸 + 毛玻璃 =====
            const CELEB_COLORS = ['#3695e3', '#71c1ff', '#ffd166', '#ff8fab', '#7ee0c0', '#c792ea', '#ffffff'];
            let celebCtx = null;
            let celebParticles = [];
            let celebRaf = null;
            let celebRunning = false;

            function celebPrepareCanvas() {
                const canvas = document.getElementById('celebrateCanvas');
                if (!canvas) return null;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const W = window.innerWidth, H = window.innerHeight;
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);
                const ctx = canvas.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                celebCtx = ctx;
                return ctx;
            }

            function celebStarPath(ctx, cx, cy, outer, inner, rot) {
                ctx.beginPath();
                for (let i = 0; i < 10; i++) {
                    const r = i % 2 === 0 ? outer : inner;
                    const a = rot + i * Math.PI / 5 - Math.PI / 2;
                    const x = cx + Math.cos(a) * r;
                    const y = cy + Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath();
            }

            function spawnCelebBurst() {
                const W = window.innerWidth, H = window.innerHeight;
                for (let side = 0; side < 2; side++) {
                    const isLeft = side === 0;
                    const ox = isLeft ? 6 : W - 6;
                    const oy = H + 6;
                    // 朝屏幕中上方喷射
                    const baseAngle = isLeft ? -Math.PI / 3.05 : -Math.PI + Math.PI / 3.05;
                    for (let i = 0; i < 82; i++) {
                        const angle = baseAngle + (Math.random() - .5) * 1.05;
                        const speed = 15 + Math.random() * 12;
                        const shape = Math.random();
                        celebParticles.push({
                            x: ox, y: oy,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            w: 5 + Math.random() * 7,
                            h: 9 + Math.random() * 9,
                            rot: Math.random() * Math.PI * 2,
                            vrot: (Math.random() - .5) * .35,
                            color: CELEB_COLORS[(Math.random() * CELEB_COLORS.length) | 0],
                            shape: shape < .22 ? 'star' : (shape < .45 ? 'circle' : 'strip'),
                            life: 1,
                            decay: .006 + Math.random() * .008,
                            gravity: .42 + Math.random() * .16,
                            drag: .988,
                            wobble: Math.random() * Math.PI * 2
                        });
                    }
                }
            }

            function celebTick() {
                if (!celebRunning || !celebCtx) return;
                const W = window.innerWidth, H = window.innerHeight;
                const ctx = celebCtx;
                ctx.clearRect(0, 0, W, H);
                for (let i = celebParticles.length - 1; i >= 0; i--) {
                    const p = celebParticles[i];
                    p.vx *= p.drag;
                    p.vy = p.vy * p.drag + p.gravity;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.vrot;
                    p.wobble += .18;
                    p.life -= p.decay;
                    if (p.life <= 0 || p.y > H + 80) { celebParticles.splice(i, 1); continue; }
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.25));
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    if (p.shape === 'star') {
                        celebStarPath(ctx, 0, 0, p.w * .9, p.w * .4, p.wobble * .2);
                        ctx.fill();
                    } else if (p.shape === 'circle') {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.w * .42, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        const flip = .35 + Math.abs(Math.cos(p.wobble)) * .65;
                        ctx.fillRect(-p.w / 2 * flip, -p.h / 2, p.w * flip, p.h);
                    }
                    ctx.restore();
                }
                if (celebParticles.length > 0) {
                    celebRaf = requestAnimationFrame(celebTick);
                } else {
                    celebRunning = false;
                    ctx.clearRect(0, 0, W, H);
                }
            }

            function showCelebration() {
                const layer = document.getElementById('celebrateLayer');
                if (!layer) return;
                const today = getBeijingDateStr();
                // 今日完成项数（必做任务 + 额外任务）
                const required = getTodayRequiredTasks().length;
                const extraDone = state.checkins.filter(c => c.isExtra && c.date === today).length;
                // 今日星值（额外奖励 + 考试）
                let stars = 0;
                state.checkins.forEach(c => { if (c.isExtra && c.date === today) stars += (c.reward || 0); });
                state.exams.forEach(e => { if (e.date === today) stars += getExamStars(e.score); });

                const desc = document.getElementById('celebrateDesc');
                if (desc) desc.innerHTML = `今天 ${required + extraDone} 项打卡全部搞定<br>今天也超棒的`;
                const starWrap = document.getElementById('celebrateStars');
                const starNum = document.getElementById('celebrateStarNum');
                if (starWrap && starNum) {
                    if (stars > 0) { starNum.textContent = '+' + stars; starWrap.classList.remove('hidden'); }
                    else { starWrap.classList.add('hidden'); }
                }

                // 重置状态
                if (celebRaf) { cancelAnimationFrame(celebRaf); celebRaf = null; }
                celebParticles = [];
                celebRunning = false;
                layer.classList.remove('show');
                layer.classList.add('open');
                const glow = document.getElementById('celebrateGlow');
                if (glow) glow.classList.remove('on');
                celebPrepareCanvas();

                requestAnimationFrame(() => {
                    layer.classList.add('show');
                    if (glow) glow.classList.add('on');
                    spawnCelebBurst();
                    celebRunning = true;
                    celebRaf = requestAnimationFrame(celebTick);
                    setTimeout(() => { if (glow) glow.classList.remove('on'); }, 950);
                });
            }

            function dismissCelebration() {
                const layer = document.getElementById('celebrateLayer');
                if (!layer) return;
                layer.classList.remove('show');
                setTimeout(() => {
                    layer.classList.remove('open');
                    if (celebRaf) { cancelAnimationFrame(celebRaf); celebRaf = null; }
                    celebRunning = false;
                    celebParticles = [];
                    if (celebCtx) celebCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                }, 400);

            ];
            let stmPrevDays = null;

            function stmInitState(){
                if (!state) return;
                if (!state.starman) state.starman = { perfectDays: [], unlockedIds: [] };
                if (!Array.isArray(state.starman.perfectDays)) state.starman.perfectDays = [];
                if (!Array.isArray(state.starman.unlockedIds)) state.starman.unlockedIds = [];
            }

            // 跨天锁定：把起算日以来、昨天及更早的完美日写入独立账本（不受3个月清理影响）
            function stmSync(){
                stmInitState();
                if (!state) return;
                const today = getBeijingDateStr();
                const perf = state.starman.perfectDays;
                let d = STARMAN_START, guard = 0;
                while (d < today && guard++ < 4000){
                    if (perf.indexOf(d) === -1 && getDayCompletionStatus(d) === 'completed') perf.push(d);
                    d = shiftDateStr(d, 1);
                }
                perf.sort();
            }

            // 当前累积天数：锁定账本 + 今天实时判定（24h内可增减）
            function stmCalcDays(){
                stmInitState();
                if (!state) return 0;
                const today = getBeijingDateStr();
                let n = 0;
                (state.starman.perfectDays||[]).forEach(day=>{
                    if (day >= STARMAN_START && day < today) n++;
                });
                if (today >= STARMAN_START){
                    const req = getTodayRequiredTasks();
                    if (req.length > 0 && req.every(t=>isTaskDoneOnDate(t, today))) n++;
                }
                return n;
            }

            // 当前应显示的形象序号；-1 表示全部未解锁
            function stmDisplayIndex(days){
                let idx = -1;
                STARMAN_LIST.forEach((s,i)=>{ if (days >= s.days) idx = i; });
                return idx;
            }

            // 下一待解锁形象
            function stmNextInfo(days){
                for (let i=0;i<STARMAN_LIST.length;i++){
                    if (days < STARMAN_LIST[i].days)
                        return { name:STARMAN_LIST[i].name, remain:STARMAN_LIST[i].days - days };
                }
                return null;
            }

            // 图鉴卡片 HTML
            function stmRenderCard(){
                stmInitState();
                const days = stmCalcDays();
                const idx = stmDisplayIndex(days);
                const next = stmNextInfo(days);
                const shown = idx >= 0 ? STARMAN_LIST[idx] : null;
                const hint = next
                    ? `再完成打卡 ${next.remain} 天<br>解锁${next.name}`
                    : `已解锁全部形象<br>新朋友筹备中`;

                const dots = STARMAN_LIST.map((s,i)=>
                    i <= idx
                        ? `<div class="stm-dot"><img src="${s.img}" alt=""></div>`
                        : `<div class="stm-dot locked"></div>`
                ).join('');

                let fig;
                if (shown){
                    fig = `<div class="stm-fig"><img src="${shown.img}" alt="${shown.name}"></div>`;
                } else {
                    fig = `<div class="stm-fig locked"><img src="${STARMAN_LIST[0].img}" alt=""></div>`
                        + `<div class="stm-lock"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="10" rx="2.4" fill="#2A79C6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="#2A79C6" stroke-width="2" fill="none"/></svg></div>`;
                }

                return `<div class="starman-card">
                    <div class="stm-glow"></div>
                    <div class="stm-label">星星人图鉴</div>
                    <div class="stm-num">${days}<span>天</span></div>
                    <div class="stm-sub">累计完美打卡日</div>
                    <div class="stm-dots">${dots}</div>
                    ${fig}
                    <div class="stm-hint">${hint}</div>
                </div>`;
            }

            // 打卡变化后调用：判定新解锁 / 回退 / 动画
            function stmOnCheckinChange(){
                stmSync();
                const now = stmCalcDays();
                const prev = (typeof stmPrevDays === 'number') ? stmPrevDays : now;
                let hit = null;
                for (let i=0;i<STARMAN_LIST.length;i++){
                    const s = STARMAN_LIST[i];
                    if (prev < s.days && now >= s.days && state.starman.unlockedIds.indexOf(s.id) === -1){
                        hit = s; break;
                    }
                }
                stmPrevDays = now;
                saveState();
                if (currentView === 'stats') renderStatsPage();
                if (hit){
                    state.starman.unlockedIds.push(hit.id);
                    saveState();
                    setTimeout(()=>stmPlayUnlock(hit, now), 460);
                }
            }

            // 3.4 秒四步解锁动画
            function stmPlayUnlock(item, days){
                const layer = document.getElementById('stmAnim');
                const fig = document.getElementById('stmAnimFig');
                const name = document.getElementById('stmAnimName');
                const day = document.getElementById('stmAnimDay');
                const star = document.getElementById('stmAnimStar');
                if (!layer || !fig || !star) return;

                fig.innerHTML = `<img src="${item.img}" alt="${item.name}">`;
                name.textContent = item.name;
                day.textContent = `第 ${days} 个完美打卡日`;

                // 重置动画
                layer.classList.remove('open');
                star.style.transition = 'none'; star.style.opacity = '0';
                document.querySelectorAll('.stm-trail').forEach(e=>e.remove());
                void layer.offsetWidth;
                layer.classList.add('open');

                // 飞行终点：底栏第三个图标（统计页）
                setTimeout(()=>{
                    const nav = document.getElementById('navStats');
                    const box = nav ? nav.getBoundingClientRect() : {left:window.innerWidth/2, top:window.innerHeight-40, width:40, height:40};
                    const tx = box.left + box.width/2;
                    const ty = box.top + box.height/2;
                    const sx = window.innerWidth/2;
                    const sy = window.innerHeight*0.5 - 0; // 与 .stm-anim-star 初始 top:50% 对齐
                    const dx = tx - sx, dy = ty - sy;

                    // 飞行拖尾
                    const trail = document.createElement('div');
                    trail.className = 'stm-trail';
                    document.body.appendChild(trail);

                    star.style.transition = 'transform 1.45s cubic-bezier(.55,.02,.72,.36), opacity 1.45s linear';
                    star.style.opacity = '1';
                    star.style.transform = `translate(-50%,-50%)`;
                    void star.offsetWidth;
                    star.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.16) rotate(330deg)`;
                    star.style.opacity = '0.02';

                    trail.style.transition = 'left 1.45s cubic-bezier(.55,.02,.72,.36), top 1.45s cubic-bezier(.55,.02,.72,.36), opacity 1.45s linear';
                    trail.style.left = sx + 'px'; trail.style.top = sy + 'px'; trail.style.opacity = '.45';
                    void trail.offsetWidth;
                    trail.style.left = tx + 'px'; trail.style.top = ty + 'px'; trail.style.opacity = '0';

                    // 命中：图标弹一下
                    setTimeout(()=>{
                        if (nav){ nav.classList.remove('stm-nav-hit'); void nav.offsetWidth; nav.classList.add('stm-nav-hit'); }
                        setTimeout(()=>{ if (nav) nav.classList.remove('stm-nav-hit'); }, 520);
                    }, 1400);
                }, 1950);

                // 收尾
                setTimeout(()=>{
                    layer.classList.remove('open');
                    star.style.transition = 'none'; star.style.opacity = '0';
                    star.style.transform = 'translate(-50%,-50%)';
                    document.querySelectorAll('.stm-trail').forEach(e=>e.remove());
                }, 3400);
            }

            // 首次加载：同步账本并把已达成形象静默标记为已播（不播动画）
            function stmBootstrap(){
                stmSync();
                const days = stmCalcDays();
                STARMAN_LIST.forEach(s=>{
                    if (days >= s.days && state.starman.unlockedIds.indexOf(s.id) === -1)
                        state.starman.unlockedIds.push(s.id);
                });
                stmPrevDays = days;
                saveState();
            }

            init();
        })();
    </script>

  var anims = {};
  var stopListeners = {};
  var current = null;
  var dot = document.querySelector('.nav-dot');
  var dotTail = document.querySelector('.nav-dot-tail');
  var dotBridge = document.querySelector('.nav-dot-bridge');
  var dotX = null;

  function centerOf(btn) {
    var barRect = document.querySelector('.bottom-bar').getBoundingClientRect();
    var btnRect = btn.getBoundingClientRect();
    return btnRect.left - barRect.left + btnRect.width / 2 - 26;
  }

  // 果冻胶囊：用连续函数烘焙关键帧，位移平滑 S 曲线 + 形变连续脉冲，全程速度不跳变
  function moveDot(view) {
    var btn = document.querySelector('.bottom-btn[data-view="' + view + '"]');
    if (!dot || !btn) return;
    var target = centerOf(btn);
    if (dotX === null) {
      dotX = target;
      dot.style.transform = 'translateX(' + dotX + 'px)';
      return;
    }
    var from = dotX;
    var diff = target - from;
    if (Math.abs(diff) < 0.5) return;
    dotX = target;
    if (typeof dot.animate !== 'function') {
      dot.style.transition = 'transform 0.55s cubic-bezier(0.33, 0, 0.2, 1)';
      dot.style.transform = 'translateX(' + target + 'px)';
      return;
    }
    // 单调平滑位移（三次 S 曲线，无回头抖动）
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    // 钟形脉冲，乘 sin(πt) 保证首尾严格回到 1，边界无跳变
    function bell(t, c, w) {
      var z = (t - c) / w;
      return Math.exp(-z * z) * Math.sin(Math.PI * t);
    }
    var frames = [];
    var N = 60;
    for (var i = 0; i <= N; i++) {
      var t = i / N;
      var x = from + diff * easeInOutCubic(t);
      var stretch = 0.52 * bell(t, 0.27, 0.19); // 起步沿方向拉伸成胶囊
      var squash = 0.16 * bell(t, 0.80, 0.09);  // 接近目标反向挤压
      var rebound = 0.06 * bell(t, 0.93, 0.05); // 轻微回弹收尾
      var sx = 1 + stretch - squash + rebound;
      var sy = 1 - 0.55 * stretch + 0.55 * squash - 0.55 * rebound;
      frames.push({
        transform: 'translateX(' + x.toFixed(2) + 'px) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')',
        offset: t,
        easing: 'linear'
      });
    }
    dot.animate(frames, { duration: 660, fill: 'forwards' });
  }
  function playTo(view, from, to) {
    var anim = anims[view];
    if (!anim) return;
    if (stopListeners[view]) {
      anim.removeEventListener('enterFrame', stopListeners[view]);
      stopListeners[view] = null;
    }
    anim.goToAndPlay(from, true);
    var listener = function (e) {
      if (e.currentTime >= to - 0.02) {
        anim.removeEventListener('enterFrame', listener);
        if (stopListeners[view] === listener) stopListeners[view] = null;
        anim.goToAndStop(to - 0.001, true);
      }
    };
    stopListeners[view] = listener;
    anim.addEventListener('enterFrame', listener);
  }

  function syncFromDOM() {
    var activeView = null;
    document.querySelectorAll('.bottom-btn').forEach(function (btn) {
      if (btn.classList.contains('active')) activeView = btn.dataset.view;
    });
    if (activeView === current) return;
    var previous = current;
    current = activeView;
    moveDot(current);
    if (previous) playTo(previous, 30, 61);
    if (current) playTo(current, 0, 31);
  }

  function start() {
    document.querySelectorAll('.nav-lottie').forEach(function (host) {
      var view = host.dataset.view;
      var anim = lottie.loadAnimation({
        container: host,
        renderer: 'svg',
        loop: false,
        autoplay: false,
        animationData: DATA[view],
        rendererSettings: { progressiveLoad: false, preserveAspectRatio: 'xMidYMid meet' }
      });
      anim.goToAndStop(0, true);
      anims[view] = anim;
    });
    // 初始 active 的图标直接显示选中终态，避免页面加载时闪一下
    document.querySelectorAll('.bottom-btn').forEach(function (btn) {
      if (btn.classList.contains('active')) {
        current = btn.dataset.view;
        if (anims[current]) anims[current].goToAndStop(30, true);
        moveDot(current);
      }
    });
    // 监听原页面 switchView() 对 active 类的切换，无需改动原有逻辑
    var observer = new MutationObserver(syncFromDOM);
    document.querySelectorAll('.bottom-btn').forEach(function (btn) {
      observer.observe(btn, { attributes: true, attributeFilter: ['class'] });
    });
  }

  if (typeof lottie === 'undefined') {
    window.addEventListener('load', start);
  } else {
    start();
  }
})();
