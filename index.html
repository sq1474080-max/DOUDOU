                                    <option value="英语" selected>英语</option>
                                    <option value="其它">其它</option>
                                </select>
                            </div>
                            <div style="display:flex; gap:12px; margin-bottom:16px;">
                                <div style="flex:1;">
                                    <label style="color:var(--ink);">开始时间</label>
                                    <input id="ocrStartDate" type="date" value="${today}" style="margin-bottom:0; background:white;" />
                                </div>
                                <div style="flex:1;">
                                    <label style="color:var(--ink);">结束时间(留空即当日)</label>
                                    <div style="display:flex; gap:6px;">
                                        <input id="ocrEndDate" type="date" value="" style="margin-bottom:0; background:white;" />
                                        <button type="button" class="btn-outline" onclick="document.getElementById('ocrEndDate').value=''" style="padding:0 10px; font-size:12px;">清空</button>
                                    </div>
                                </div>
                            </div>
                            
                            <label style="color:var(--ink);">每日重复</label>
                            <select id="ocrDaily" style="margin-bottom:0; background:white;">
                                <option value="false" selected>否</option>
                                <option value="true">是</option>
                            </select>
                        </div>
                    `,
                    confirmText: '批量生成',
                    onConfirm: () => {
                        const rawText = document.getElementById('ocrResult').value.trim();
                        if (!rawText) { showToast('请先识别或输入文字', false); return false; }
                        
                        const isSplit = document.getElementById('ocrSplitCheck').checked;
                        const category = document.getElementById('ocrCategory').value;
                        let subject = '';
                        if (category === '校内任务') {
                            subject = document.getElementById('ocrSubjectSelect').value;
                        } else {
                            subject = document.getElementById('ocrSubjectInput').value.trim() || '其它';
                        }
                        const startDate = document.getElementById('ocrStartDate').value || today;
                        const endDate = document.getElementById('ocrEndDate').value;
                        const daily = document.getElementById('ocrDaily').value === 'true';

                        let taskNames = [];
                        if (isSplit) {
                            taskNames = rawText.split('\n')
                                .map(line => line.replace(/^\d+[\.\、\s]+/, '').trim()) 
                                .filter(name => name.length > 0);
                        } else {
                            taskNames = [rawText.replace(/\n/g, ' ')];
                        }

                        if (taskNames.length === 0) {
                            showToast('没有提取到有效任务名', false);
                            return false;
                        }

                        taskNames.forEach(name => {
                            state.tasks.push({
                                id: 'task_ocr_' + Date.now() + '_' + Math.random().toString(36).substr(2,4),
                                name: name, 
                                daily: daily, 
                                note: 'OCR导入', 
                                category: category, 
                                subject: subject, 
                                startDate: startDate, 
                                endDate: endDate
                            });
                        });
                        
                        saveState();
                        renderAll();
                        showToast(`成功生成 ${taskNames.length} 个任务`);
                    }
                });

                window.updateOcrSubjectOptions = function() {
                    const cat = document.getElementById('ocrCategory').value;
                    const container = document.getElementById('ocrSubjectContainer');
                    if (cat === '校内任务') {
                        container.innerHTML = `
                            <select id="ocrSubjectSelect" style="background:white;">
                                <option value="语文">语文</option>
                                <option value="数学">数学</option>
                                <option value="英语">英语</option>
                                <option value="其它">其它</option>
                            </select>
                        `;
                    } else {
                        container.innerHTML = `<input id="ocrSubjectInput" type="text" placeholder="自定义学科" style="background:white;" />`;
                    }
                };

                setTimeout(() => {
                    const fileInput = document.getElementById('ocrFileInput');
                    const statusEl = document.getElementById('ocrStatus');
                    const previewContainer = document.getElementById('ocrPreviewContainer');
                    const previewImg = document.getElementById('ocrPreviewImg');
                    const resultEl = document.getElementById('ocrResult');

                    if (!fileInput) return;

                    fileInput.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            previewContainer.style.display = 'block';
                            previewImg.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);

                        statusEl.innerHTML = '⏳ 正在识别中，请稍候...';
                        resultEl.value = '';
                        
                        try {
                            const { data: { text } } = await Tesseract.recognize(
                                file,
                                'chi_sim+eng', 
                                { logger: m => {
                                    if (m.status === 'recognizing text') {
                                        statusEl.innerHTML = `⏳ 识别进度：${Math.round(m.progress * 100)}%`;
                                    }
                                }}
                            );
                            
                            let cleanText = text.split('\n')
                                .map(l => l.trim())
                                .filter(l => l.length > 0)
                                .join('\n');
                                
                            resultEl.value = cleanText;
                            statusEl.innerHTML = '✅ 识别完成，请在文本框内修改';
                            if (!cleanText) {
                                statusEl.innerHTML = '⚠️ 未能识别出文字，请重试';
                            }
                        } catch (error) {
                            console.error('OCR Error:', error);
                            statusEl.innerHTML = '❌ 识别失败，请检查网络或重试';
                        }
                    });
                }, 100);
            }

            function bindEvents() {
                document.getElementById('btnChildMode').addEventListener('click', () => {
                    currentRole = 'child';
                    isAdminAuthenticated = false;
                    renderAll();
                });

                document.getElementById('btnAdminMode').addEventListener('click', () => {
                    if (isAdminAuthenticated && currentRole === 'admin') return;
                    showModal({
                        title: '管理员验证',
                        contentHTML: `<input id="pwdInput" type="password" placeholder="请输入密码" autofocus style="text-align:center; letter-spacing:5px;" />`,
                        confirmText: '进入',
                        onConfirm: () => {
                            const pwd = document.getElementById('pwdInput').value;
                            if (pwd === ADMIN_PASSWORD) {
                                currentRole = 'admin';
                                isAdminAuthenticated = true;
                                renderAll();
                                showToast('欢迎回来，管理员');
                                return true;
                            } else {
                                alert('密码错误');
                                return false;
                            }
                        }
                    });
                });

                document.body.addEventListener('click', (e) => {
                    if (e.target.closest('.collapse-btn')) {
                        const btn = e.target.closest('.collapse-btn');
                        const targetId = btn.dataset.target;
                        const targetEl = document.getElementById(targetId);
                        if (targetEl) {
                            if (targetEl.style.display === 'none') {
                                targetEl.style.display = '';
                                btn.innerHTML = '<img src="icon_expand.svg" class="zoom-icon" style="width: 18px; height: 18px;">';
                            } else {
                                targetEl.style.display = 'none';
                                btn.innerHTML = '<img src="icon_collapse.svg" class="zoom-icon" style="width: 18px; height: 18px;">';
                            }
                        }
                    }
                });

                document.body.addEventListener('change', (e) => {
                    if (e.target.matches('.exam-score-input')) {
                        const examId = e.target.dataset.examId;
                        const exam = state.exams.find(x => x.id === examId);
                        if (exam && exam.score !== null && !(currentRole === 'admin' && isAdminAuthenticated)) {
                            showToast('无法修改已录入的分数', false);
                            renderExams();
                            return;
                        }

                        let val = parseFloat(e.target.value);
                        if (e.target.value.trim() === '') {
                            val = null;
                        } else if (isNaN(val) || val < 0 || val > 100) {
                            showToast('请输入0-100的有效分数', false);
                            renderExams();
                            return;
                        }
                        if (exam) {
                            exam.score = val;
                            saveState();
                            renderAll();
                            if (val !== null) {
                                showToast(`分数已录入，获得 ${getExamStars(val)} 星`);
                            }
                        }
                    }
                });

                document.getElementById('addExamBtn').addEventListener('click', () => openExamModal(null));
                document.getElementById('addInSchoolBtn').addEventListener('click', () => openTaskModal(null, '校内任务'));
                document.getElementById('addOutSchoolBtn').addEventListener('click', () => openTaskModal(null, '校外任务'));
                document.getElementById('openCreateTaskBtn').addEventListener('click', () => openTaskModal(null, '校内任务'));

                document.getElementById('addExtraBtn').addEventListener('click', () => openExtraModal(null));
                document.getElementById('editProfileBtn').addEventListener('click', openProfileModal);
                document.getElementById('ocrBtn').addEventListener('click', openOcrModal);
                document.getElementById('resetStarsBtn').addEventListener('click', resetStarsConfirm);

                document.body.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-action]');
                    if (!target) return;
                    const action = target.dataset.action;
                    
                    if (action === 'toggle-check') {
                        toggleTaskCheck(target.dataset.taskId);
                    } else if (action === 'toggle-extra') {
                        toggleExtraCheck(target.dataset.extraId);
                    } else if (action === 'edit-task') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const task = state.tasks.find(t => t.id === target.dataset.taskId);
                            if (task) openTaskModal(task);
                        }
                    } else if (action === 'delete-task') {
                        if (currentRole === 'admin' && isAdminAuthenticated) deleteTaskConfirm(target.dataset.taskId);
                    } else if (action === 'edit-extra') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const extra = state.extraTasks.find(t => t.id === target.dataset.extraId);
                            if (extra) openExtraModal(extra);
                        }
                    } else if (action === 'delete-extra') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const extraId = target.dataset.extraId;
                            showModal({
                                title: '删除额外任务',
                                content: '确定删除吗？',
                                confirmText: '删除',
                                danger: true,
                                onConfirm: () => {
                                    state.extraTasks = state.extraTasks.filter(t => t.id !== extraId);
                                    state.checkins = state.checkins.filter(c => !(c.taskId === extraId && c.isExtra));
                                    saveState();
                                    renderAll();
                                    showToast('已删除');
                                }
                            });
                        }
                    } else if (action === 'edit-exam') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const exam = state.exams.find(x => x.id === target.dataset.examId);
                            if (exam) openExamModal(exam);
                        }
                    } else if (action === 'delete-exam') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const examId = target.dataset.examId;
                            showModal({
                                title: '删除考试',
                                content: '确定删除该考试记录吗？',
                                confirmText: '删除',
                                danger: true,
                                onConfirm: () => {
                                    state.exams = state.exams.filter(x => x.id !== examId);
                                    saveState();
                                    renderAll();
                                    showToast('已删除');
                                }
                            });
                        }
                    }
                });

                document.getElementById('prevMonth').addEventListener('click', () => {
                    calendarMonth--; if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
                    renderCalendar();
                });
                document.getElementById('nextMonth').addEventListener('click', () => {
                    calendarMonth++; if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
                    renderCalendar();
                });

                document.getElementById('exportCsvBtn').addEventListener('click', () => {
                    const rows = [['日期', '类型', '名称', '详情/分数', '获得星值']];
                    state.checkins.forEach(c => {
                        if (c.isExtra) {
                            const t = state.extraTasks.find(x => x.id === c.taskId);
                            rows.push([c.date, '额外任务', t ? t.name : '已删除', '-', c.reward + '星']);
                        } else {
                            const t = state.tasks.find(x => x.id === c.taskId);
                            rows.push([c.date, '日常打卡', t ? t.name : '已删除', '-', '见月度奖励']);
                        }
                    });
                    state.exams.forEach(e => {
                        if (e.score !== null) {
                            rows.push([e.date, '考试', e.name, e.score + '分', getExamStars(e.score)]);
                        }
                    });
                    const csv = rows.map(r => r.join(',')).join('\n');
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv'}));
                    link.download = `星值记录_${getBeijingDateStr()}.csv`;
                    link.click();
                    showToast('CSV 已导出');
                });

                document.getElementById('bottomHome').addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                
                document.getElementById('bottomStats').addEventListener('click', () => {
                    const monthData = calcMonthStars();
                    const isAdmin = (currentRole === 'admin' && isAdminAuthenticated);
                    
                    let html = `
                        <div style="padding: 10px;">
                            <div style="font-size:18px; font-weight:900; color:var(--ink); margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; background:var(--aqua); color:white; padding:16px 24px; border-radius:20px;">
                                <span>今日获得</span>
                                <span>${calcTodayStars()} <img src="icon_star.svg" class="zoom-icon" style="width: 20px; height: 20px;"></span>
                            </div>
                            <div style="font-size:18px; font-weight:900; color:var(--ink); margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; background:var(--lilac); color:white; padding:16px 24px; border-radius:20px;">
                                <span>本月累计</span>
                                <span>${monthData.total} <img src="icon_star.svg" class="zoom-icon" style="width: 20px; height: 20px;"></span>
                            </div>
                            <div style="font-size:18px; font-weight:900; color:var(--ink); margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; background:var(--white); border: 2px solid var(--icy-blue); padding:16px 24px; border-radius:20px;">
                                <span>本月奖励</span>
                                <span style="color:var(--lilac);">${monthData.total} 元</span>
                            </div>
                        </div>
                    `;

                    if (isAdmin) {
                        showModal({
                            title: '📊 星值统计',
                            contentHTML: html,
                            confirmText: '知道了',
                            cancelText: '清零',
                            onCancel: () => {
                                setTimeout(() => {
                                    showModal({
                                        title: '⚠️ 清零确认',
                                        content: '确定要清空现有所有任务、打卡记录、额外任务和考试记录吗？清零后不影响后续新增。',
                                        confirmText: '确认',
                                        cancelText: '取消',
                                        danger: true,
                                        onConfirm: () => {
                                            state.tasks = [];
                                            state.checkins = [];
                                            state.extraTasks = [];
                                            state.exams = [];
                                            saveState();
                                            renderAll();
                                            showToast('已清空现有所有记录');
                                        }
                                    });
                                }, 50);
                            }
                        });
                    } else {
                        showModal({
                            title: '📊 星值统计',
                            contentHTML: html,
                            confirmText: '知道了',
                            cancelText: '' 
                        });
                    }
                });
            }

            function init() {
                if (!state.checkins) state.checkins = [];
                if (!state.exams) state.exams = [];
                if (!state.extraTasks) state.extraTasks = [];
                if (!state.profile) state.profile = { name: 'HEIDI', avatar: '' };
                
                bindEvents();
                renderAll();
                
                if (supabaseClient) {
                    fetchCloudState();
                    setupRealtime();
                }
            }

            init();
        })();
    </script>
</body>
</html>
