<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HEIDI STAR">
    <link rel="apple-touch-icon" href="icon.png">
    <title>HEIDI星旅</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-page: #f5f5f5;
            --bg-card: #f7f7f7;
            --bg-wrapper: #fefefe;
            --text-main: #383b42;
            --text-sub: #b7b7b7;
            --accent: #74b0e1;
            --accent-light: #c0e2f9;
            --accent-warm: #f4c65c;
            --bg-nav: #ffffff;
            --border-light: #ebebeb;
            --radius-card: 22px;
            --radius-wrapper: 32px;
            --radius-btn: 999px;
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.03);
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'URW Gothic', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .fixed-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-page);
            z-index: -10;
            pointer-events: none;
        }

        html, body {
            overscroll-behavior-y: none;
            background-color: transparent;
        }

        body {
            min-height: 100vh;
            padding: 12px 20px 100px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
        }

        .zoom-icon {
            transform: scale(2);
            transform-origin: center;
            max-width: none !important;
            object-fit: contain;
            z-index: 10;
            display: block;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--bg-nav);
            border-radius: var(--radius-btn);
            padding: 4px 10px;
            box-shadow: var(--shadow-soft);
            flex-shrink: 0;
            border: 1px solid var(--border-light);
        }

        .header-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            border: none;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: 0.3s;
        }
        .header-btn.active {
            color: var(--text-main);
            background: var(--bg-card);
        }

        .layout-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .left-panel, .right-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .section-wrapper {
            border-radius: var(--radius-wrapper);
            padding: 16px;
            margin-bottom: 0;
            transition: 0.3s;
            background-color: var(--bg-wrapper) !important;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-light);
        }
        .section-wrapper.collapsed .section-title {
            margin-bottom: 0;
        }

        .profile-stats-bar {
            display: flex;
            gap: 16px;
            align-items: stretch;
            margin-bottom: 0;
        }

        .profile-card {
            background: var(--bg-wrapper);
            border-radius: var(--radius-card);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            flex: 0 0 auto;
            min-width: 120px;
            border: 1px solid var(--border-light);
        }

        .avatar-container {
            width: 76px;
            height: 76px;
            background: var(--accent-light);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            animation: blobFloat 4s ease-in-out infinite alternate;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.05);
        }

        @keyframes blobFloat {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translateY(0); }
            100% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; transform: translateY(-5px); }
        }

        .avatar-eye {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--text-main);
            border-radius: 50%;
            top: 40%;
        }
        .avatar-eye.left { left: 25%; }
        .avatar-eye.right { right: 25%; }

        .avatar-smile {
            position: absolute;
            width: 20px;
            height: 10px;
            border-bottom: 3px solid var(--text-main);
            border-radius: 0 0 20px 20px;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
        }

        .avatar {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 28px;
            font-weight: 900;
            background-size: cover;
            background-position: center;
            z-index: 2;
        }
        .avatar[style*="url"] ~ .avatar-eye,
        .avatar[style*="url"] ~ .avatar-smile { display: none; }

        .profile-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-main);
            text-align: center;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-profile-btn {
            background: var(--bg-page);
            border: none;
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: var(--radius-btn);
            font-size: 12px;
            cursor: pointer;
            font-weight: 800;
        }

        .stats-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stats-card {
            flex: 1;
            border-radius: var(--radius-card);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }
        .stats-card.today { background: var(--accent); color: #ffffff; border-color: var(--accent); }
        .stats-card.month { background: var(--bg-wrapper); color: var(--text-main); }
        .stats-card.today .stats-number { color: #ffffff; }

        .stats-label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .stats-number {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            line-height: 1;
        }
        .stats-number img {
            display: block;
            flex-shrink: 0;
        }

        .calendar-card {
            background: var(--bg-wrapper);
            border-radius: var(--radius-card);
            padding: 20px;
            box-shadow: var(--shadow-soft);
            width: 100%;
            border: 1px solid var(--border-light);
        }

        .calendar-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
        }

        .calendar-header .month-label {
            font-weight: 800;
            color: var(--text-main);
            font-size: 18px;
        }

        .calendar-nav-btn {
            position: absolute;
            background: var(--bg-page);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        #prevMonth { left: 0; }
        #nextMonth { right: 0; }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 40px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            border-radius: 50%;
            color: var(--text-main);
        }

        .calendar-day.today {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 900;
        }
        .calendar-day.completed {
            background: var(--accent);
            color: #ffffff;
            font-weight: 900;
        }
        .calendar-day.incomplete {
            background: var(--accent-warm);
            color: #ffffff;
            font-weight: 900;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 12px 0;
            font-weight: 800;
            color: var(--text-main);
            font-size: 21px;
            width: 100%;
        }
        .section-title .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .title-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collapse-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sub-title {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 800;
            margin: 12px 0 6px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1;
        }
        .sub-title img {
            display: block;
            flex-shrink: 0;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 4px;
            width: 100%;
        }

        .task-grid-inner {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .task-item {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-card);
            transition: 0.2s;
            width: 100%;
            border: 1px solid var(--border-light);
        }

        .task-item.completed {
            background: var(--bg-card);
            box-shadow: none;
            opacity: 0.6;
        }

        .task-item.overdue {
            background: color-mix(in srgb, var(--accent-warm) 16%, var(--bg-wrapper));
        }

        .task-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            height: 48px;
            background: transparent;
            flex-shrink: 0;
        }

        .task-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .task-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-main);
            word-break: break-word;
        }
        .task-item.completed .task-name {
            color: var(--text-sub);
            text-decoration: line-through;
        }

        .task-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: var(--border-light);
            color: var(--text-main);
            line-height: 1;
        }
        .tag-green { background: var(--accent-light); color: var(--accent); }
        .tag-purple, .tag-pink, .tag-blue { background: var(--bg-page); color: var(--text-main); }
        .tag-orange { background: color-mix(in srgb, var(--accent-warm) 30%, var(--bg-wrapper)); color: var(--text-main); }
        .tag-date { background: transparent; color: var(--text-sub); padding-left: 0; }
        .tag-today { background: var(--accent-light); color: var(--accent); }
        .tag-deadline { background: var(--border-light); color: var(--text-main); }

        .icon-repeat-small {
            width: 12px;
            height: 12px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 2px;
        }

        .task-check {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
            background: var(--bg-wrapper);
        }
        .task-item.completed .task-check {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-nav);
        }

        .task-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon-btn {
            background: var(--bg-wrapper);
            border: 1px solid var(--border-light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            font-size: 16px;
        }

        .overdue-badge {
            background: var(--accent-warm);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .btn-primary {
            background: var(--accent);
            border: none;
            color: var(--bg-nav);
            padding: 12px 20px;
            border-radius: var(--radius-btn);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-primary:active { transform: scale(0.96); }

        .btn-outline {
            background: var(--bg-nav);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: var(--radius-btn);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-outline:active { background: var(--bg-page); }
        .btn-sm { padding: 8px 14px; font-size: 13px; }

        .hidden { display: none !important; }

        #examTaskList { display: flex; flex-direction: column; gap: 12px; }
        .exam-item {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }
        .exam-score-input {
            width: 90px;
            padding: 8px 12px;
            border-radius: var(--radius-btn);
            border: 2px solid var(--border-light);
            text-align: center;
            font-weight: 800;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            background: var(--bg-wrapper);
            line-height: 1;
        }
        .exam-score-input:focus { border-color: var(--accent); background: var(--bg-nav); }
        .exam-stars {
            font-weight: 800;
            font-size: 14px;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1;
        }
        .exam-stars.zero { color: var(--text-sub); }
        .exam-stars img {
            display: block;
            flex-shrink: 0;
        }

        .view-page { padding-bottom: 90px; }
        .shop-page-title {
            font-size: 22px; font-weight: 900; color: var(--text-main);
            margin: 2px 4px 0;
        }
        .shop-hero { position: relative; overflow: visible; }
        .hero-decor {
            position: absolute;
            right: 0; bottom: 0;
            height: calc(100% + 56px);
            width: auto;
            max-width: 70%;
            object-fit: contain;
            object-position: bottom right;
            z-index: 5;
            pointer-events: none;
            user-select: none; -webkit-user-select: none;
        }
        .shop-hero {
            background: linear-gradient(135deg, var(--accent) 0%, #5a9dd4 100%);
            border-radius: var(--radius-wrapper);
            padding: 24px 26px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(116, 176, 225, 0.32);
            margin-bottom: 14px;
        }
        .shop-hero-label { font-size: 14px; font-weight: 800; opacity: 0.92; letter-spacing: 0.5px; }
        .shop-hero-num {
            display: flex; align-items: center; gap: 10px;
            font-size: 40px; font-weight: 900; line-height: 1;
            margin: 10px 0 8px 0;
        }
        .shop-hero-num img { filter: brightness(0) invert(1); }
        .shop-hero-tip { font-size: 12px; font-weight: 700; opacity: 0.85; line-height: 1.4; }

        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }
        .shop-grid.money-grid { margin-top: 0; }
        .shop-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            background: var(--bg-wrapper);
            border: 2px solid var(--border-light);
            border-radius: var(--radius-card);
            padding: 12px 14px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: var(--shadow-card);
        }
        .shop-item.selected {
            border-color: var(--accent);
            background: #f2f9ff;
        }
        .shop-item-img {
            width: 52px; height: 52px;
            border-radius: 16px;
            background: var(--bg-card);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .shop-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .shop-item-img.bare {
            background: transparent;
            width: 72px; height: 72px;
            position: relative;
        }
        .shop-item-img.bare img { object-fit: contain; padding: 0; }
        .money-fallback {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; font-weight: 900; color: var(--accent-warm);
        }
        .shop-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }
        .shop-item-name {
            font-size: 15px; font-weight: 800; color: var(--text-main);
            line-height: 1.25; word-break: break-all;
        }
        .shop-item-cost {
            display: flex; align-items: center; gap: 4px;
            font-size: 13px; font-weight: 900; color: var(--accent); line-height: 1;
        }
        .shop-item-cost img { width: 16px; height: 16px; object-fit: contain; }
        .shop-money-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .shop-money-input {
            width: 108px; height: 38px;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            padding: 0 10px;
            font-family: inherit;
            font-size: 15px; font-weight: 900;
            color: var(--accent);
            background: var(--bg-nav);
            outline: none;
            box-sizing: border-box;
        }
        .shop-money-input:focus { border-color: var(--accent); }
        .shop-money-hint { font-size: 11px; font-weight: 800; color: var(--text-sub); }
        .shop-check {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border-light);
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 900; color: transparent;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .shop-item.selected .shop-check {
            background: var(--accent); border-color: var(--accent); color: #fff;
        }
        .shop-item-del {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-light);
            background: #ffeeee; color: #e46a6a;
            font-size: 17px; font-weight: 900; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .shop-item-err {
            display: none; color: #e46a6a; font-size: 13px; font-weight: 800;
            text-align: center; margin-bottom: 10px;
        }
        .stats-layout { display: flex; flex-direction: column; gap: 14px; }
        .shop-layout { display: flex; flex-direction: column; gap: 14px; }
        .shop-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
        .shop-side { min-width: 0; }
        .shop-hero { margin-bottom: 0; }
        .shop-actions {
            display: flex; gap: 10px; margin-top: 0;
        }
        .shop-actions button { flex: 1; height: 48px; }
        .shop-empty {
            text-align: center; padding: 32px 0; color: var(--text-sub);
            font-size: 14px; font-weight: 800;
        }
        .redeem-log-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: var(--bg-card);
            border-radius: 16px; margin-bottom: 8px; font-size: 13px; font-weight: 800;
        }
        .redeem-log-row .meta { color: var(--text-sub); font-size: 11px; font-weight: 700; margin-top: 3px; }
        .stat-row .val { display: flex; align-items: center; gap: 4px; font-size: 18px; font-weight: 900; color: var(--accent); line-height: 1; }
        .stat-row .lbl { font-size: 14px; font-weight: 800; }
        .stat-row.hl { background: var(--accent); color: #fff; border-color: var(--accent); }
        .stat-row.hl .lbl, .stat-row.hl .val { color: #fff; }

    <script>
        if ('serviceWorker' in navigator) {

        }

        const SUPABASE_URL = 'https://skgxcnnagfgwfrccwwrx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_t96OWboqHhMc4CSJLEuQXQ_TE_xIMdw';

        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_URL !== '替换为您的_SUPABASE_URL') {
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (e) {
                console.warn('云同步初始化失败，已切换为本地模式');
            }
        }

        (function() {
            const STORAGE_KEY = 'star_task_app_v1';
            const ADMIN_PASSWORD = '111';
            const MONTH_SETTLE_BONUS = 20;

            function getBeijingNow() {
                const now = new Date();
                const utc = now.getTime() + now.getTimezoneOffset() * 60000;
                return new Date(utc + 8 * 3600000);
            }
            function getBeijingDateStr() {
                const bj = getBeijingNow();
                return `${bj.getFullYear()}-${String(bj.getMonth()+1).padStart(2,'0')}-${String(bj.getDate()).padStart(2,'0')}`;
            }
            function formatDate(d) {
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            }
            function getMondayOf(date) {
                const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                const day = d.getDay();
                const diff = day === 0 ? -6 : 1 - day;
                d.setDate(d.getDate() + diff);
                return d;
            }
            function getBeijingMonthPrefix(offsetMonths = 0) {
                const bj = getBeijingNow();
                const d = new Date(bj.getFullYear(), bj.getMonth() + offsetMonths, 1);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            }
            function getSubjectIcon(subject) {
                const map = {
                    '语文': 'icon_subject_chinese.png',
                    '数学': 'icon_subject_math.png',
                    '英语': 'icon_subject_english.png',
                    '其它': 'icon_subject_other.png',
                    '口语': 'icon_subject_oral.png',
                    '新东方': 'icon_subject_xdf.png'
                };
                return map[subject] || 'icon_subject_custom.png';
            }

            const defaultTasks = [
                { id: 't1', name: '习题册', reward: 0, daily: true, note: '', category: '校内任务', subject: '语文', startDate: '2026-11-01', endDate: '' },
                { id: 't2', name: '口算', reward: 0, daily: true, note: '', category: '校内任务', subject: '数学', startDate: '2026-11-01', endDate: '' },
                { id: 't3', name: '英语阅读', reward: 0, daily: true, note: '', category: '校内任务', subject: '英语', startDate: '2026-11-01', endDate: '' }
            ];

            const defaultState = {
                tasks: [...defaultTasks],
                checkins: [],
                exams: [],
                extraTasks: [],
                shopItems: [],
                redemptions: [],
                archive: { lastCleanupMonth: '', months: {} },
                profile: { name: 'HEIDI', avatar: '' }
            };

            function loadStateLocal() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        parsed.tasks = (parsed.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        if (!parsed.profile) parsed.profile = { name: 'HEIDI', avatar: '' };
                        if (!parsed.exams) parsed.exams = [];
                        if (!parsed.extraTasks) parsed.extraTasks = [];
                        if (!parsed.checkins) parsed.checkins = [];
                        if (!parsed.shopItems) parsed.shopItems = [];
                        if (!parsed.redemptions) parsed.redemptions = [];
                        if (!parsed.archive) parsed.archive = { lastCleanupMonth: '', months: {} };
                        return parsed;
                    } catch (e) {}
                }
                return JSON.parse(JSON.stringify(defaultState));
            }

            let state = loadStateLocal();
            let currentRole = 'child';
            let isAdminAuthenticated = false;

            const bjInit = getBeijingNow();
            let calendarWeekStart = getMondayOf(bjInit);

            let saveTimeout = null;
            let isSyncingFromCloud = false;
            let pendingLocalWrite = false;
            let pendingSince = 0;

            function hasPendingLocalWrite() {
                return pendingLocalWrite && (Date.now() - pendingSince) < 10000;
            }

            function saveState() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                if (supabaseClient && !isSyncingFromCloud) {
                    pendingLocalWrite = true;
                    pendingSince = Date.now();
                    if (saveTimeout) clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(async () => {
                        try {
                            const payload = JSON.parse(JSON.stringify(state));
                            await supabaseClient.from('app_state').upsert({ id: 1, state_data: payload, updated_at: new Date().toISOString() });
                        } catch (error) {}
                        pendingLocalWrite = false;
                    }, 800);
                }
            }

            // ============ 归档 + 清理：保留最近 3 个自然月 ============
            // 规则：每次初始化时若当前月 ≠ lastCleanupMonth，则把 "早于 3 个月前边界" 的月份
            // 汇总归档到 archive.months，再从本地/云端数据中删除，保证星值账目精确。
            function performCleanupIfNeeded() {
                if (!state.archive) state.archive = { lastCleanupMonth: '', months: {} };
                const curMonth = getBeijingMonthPrefix(0);
                if (state.archive.lastCleanupMonth === curMonth) return false;

                // 保留当月、上月、上上月 → cutoff 为"上上月的月初"
                const cutoff = getBeijingMonthPrefix(-2);

                const oldMonths = new Set();
                state.checkins.forEach(c => { if (c.date && c.date.slice(0,7) < cutoff) oldMonths.add(c.date.slice(0,7)); });
                state.exams.forEach(e => { if (e.date && e.date.slice(0,7) < cutoff) oldMonths.add(e.date.slice(0,7)); });
                state.extraTasks.forEach(t => { if (t.createdDate && t.createdDate.slice(0,7) < cutoff) oldMonths.add(t.createdDate.slice(0,7)); });
                state.redemptions.forEach(r => { if (r.date && r.date.slice(0,7) < cutoff) oldMonths.add(r.date.slice(0,7)); });

                oldMonths.forEach(m => {
                    if (state.archive.months[m]) return;
                    let settled = 0, hasActivity = false;
                    state.checkins.forEach(c => { if (c.isExtra && c.date && c.date.startsWith(m)) { settled += (c.reward || 0); hasActivity = true; } });
                    state.exams.forEach(e => { if (e.date && e.date.startsWith(m)) { settled += getExamStars(e.score); hasActivity = true; } });
                    if (hasActivity) settled += MONTH_SETTLE_BONUS;
                    let redeemed = 0;
                    state.redemptions.forEach(r => { if (r.date && r.date.startsWith(m)) redeemed += (r.cost || 0); });
                    state.archive.months[m] = { settled, redeemed };
                });

                state.checkins = state.checkins.filter(c => !(c.date && c.date.slice(0,7) < cutoff));
                state.exams = state.exams.filter(e => !(e.date && e.date.slice(0,7) < cutoff));
                state.extraTasks = state.extraTasks.filter(t => !(t.createdDate && t.createdDate.slice(0,7) < cutoff));
                state.redemptions = state.redemptions.filter(r => !(r.date && r.date.slice(0,7) < cutoff));
                state.archive.lastCleanupMonth = curMonth;
                return true;
            }

            async function fetchCloudState() {
                if (!supabaseClient) return;
                if (hasPendingLocalWrite()) return;
                try {
                    const { data, error } = await supabaseClient.from('app_state').select('state_data').eq('id', 1).single();
                    if (error) throw error;
                    if (data && data.state_data && Object.keys(data.state_data).length > 0) {
                        isSyncingFromCloud = true;
                        state = data.state_data;
                        state.tasks = (state.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        if (!state.archive) state.archive = { lastCleanupMonth: '', months: {} };
                        if (performCleanupIfNeeded()) {
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        } else {
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        }
                        renderAll();
                        isSyncingFromCloud = false;
                    }
                } catch (error) {}
            }

            function setupRealtime() {
                if (!supabaseClient) return;
                supabaseClient.channel('app_state_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
                    if (hasPendingLocalWrite()) return;
                    const newState = payload.new.state_data;
                    if (newState && Object.keys(newState).length > 0) {
                        isSyncingFromCloud = true;
                        state = newState;
                        state.tasks = (state.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        if (!state.archive) state.archive = { lastCleanupMonth: '', months: {} };
                        performCleanupIfNeeded();
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        renderAll();
                        setTimeout(() => { isSyncingFromCloud = false; }, 100);
                    }
                }).subscribe();
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getExamStars(score) {
                if (score === null || score === undefined || score === '') return 0;
                const s = parseFloat(score);
                if (s >= 100) return 50;
                if (s >= 90) return 25;
                return 0;
            }

            function calcTodayStars() {
                const today = getBeijingDateStr();
                let sum = 0;
                state.checkins.forEach(c => {
                    if (c.date === today && c.isExtra) sum += (c.reward || 0);
                });
                state.exams.forEach(e => {
                    if (e.date === today) sum += getExamStars(e.score);
                });
                return sum;
            }

            function monthHasActivity(prefix) {
                return state.checkins.some(c => c.isExtra && c.date && c.date.startsWith(prefix))
                    || state.exams.some(e => e.date && e.date.startsWith(prefix));
            }

            function calcMonthSettled(prefix) {
                let sum = 0;
                state.checkins.forEach(c => { if (c.isExtra && c.date && c.date.startsWith(prefix)) sum += (c.reward || 0); });
                state.exams.forEach(e => { if (e.date && e.date.startsWith(prefix)) sum += getExamStars(e.score); });
                if (monthHasActivity(prefix)) sum += MONTH_SETTLE_BONUS;
                return sum;
            }

            function calcMonthStars() {
                const prefix = getBeijingMonthPrefix(0);
                let extraSum = 0;
                let examSum = 0;
                state.checkins.forEach(c => { if (c.isExtra && c.date && c.date.startsWith(prefix)) extraSum += (c.reward || 0); });
                state.exams.forEach(e => { if (e.date && e.date.startsWith(prefix)) examSum += getExamStars(e.score); });
                return { total: extraSum + examSum, extraSum, examSum, monthlyBonus: 0, prefix };
            }

            // 已结算累计 = 归档月份 settled 之和 + 现存数据中"过去月份"的结算
            function calcSettledStars() {
                const cur = getBeijingMonthPrefix(0);
                let total = 0;
                const archived = (state.archive && state.archive.months) || {};
                Object.values(archived).forEach(m => { total += (m.settled || 0); });
                const months = new Set();
                state.checkins.forEach(c => { if (c.isExtra && c.date) months.add(c.date.slice(0, 7)); });
                state.exams.forEach(e => { if (e.date) months.add(e.date.slice(0, 7)); });
                months.forEach(m => { if (m < cur) total += calcMonthSettled(m); });
                return total;
            }

            // 已兑换消耗 = 归档月份 redeemed 之和 + 现存 redemptions
            function calcRedeemedStars() {
                let total = 0;
                const archived = (state.archive && state.archive.months) || {};
                Object.values(archived).forEach(m => { total += (m.redeemed || 0); });
                total += (state.redemptions || []).reduce((sum, r) => sum + (r.cost || 0), 0);
                return total;
            }

            function calcShopBalance() {
                return calcSettledStars() - calcRedeemedStars();
            }

            function shiftDateStr(dateStr, days) {
                const p = (dateStr || '').split('-');
                if (p.length !== 3) return dateStr;
                const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
                d.setUTCDate(d.getUTCDate() + days);
                return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
            }
            function isCheckedOnDate(taskId, dateStr) {
                return state.checkins.some(c => !c.isExtra && c.taskId === taskId && c.date === dateStr);
            }
            function isPeriodTaskChecked(task) {
                const from = task.startDate || '0000-01-01';
                const to = task.endDate || '9999-12-31';
                return state.checkins.some(c => !c.isExtra && c.taskId === task.id && c.date >= from && c.date <= to);
            }
            function isDailyTask(task) { return !!task.daily; }
            function isPeriodTask(task) { return !task.daily && !!task.endDate; }

            function isTaskCheckedToday(taskId) {
                return isCheckedOnDate(taskId, getBeijingDateStr());
            }
            function isTaskInValidPeriod(task, today) {
                const start = task.startDate || today;
                if (today < start) return false;
                if (isDailyTask(task)) return !task.endDate || today <= task.endDate;
                if (isPeriodTask(task)) return today <= task.endDate;
                return task.startDate === today;
            }
            function canTaskCheck(task) {
                const today = getBeijingDateStr();
                if (!isTaskInValidPeriod(task, today)) return false;
                if (isPeriodTask(task) && isPeriodTaskChecked(task)) return false;
                return true;
            }
            function isTaskCheckedForDisplay(task, today) {
                if (isPeriodTask(task)) return isPeriodTaskChecked(task);
                return isCheckedOnDate(task.id, today);
            }
            function isTaskDueOnDate(task, dateStr) {
                const start = task.startDate || dateStr;
                if (dateStr < start) return false;
                if (isDailyTask(task)) return !task.endDate || dateStr <= task.endDate;
                if (isPeriodTask(task)) return dateStr === task.endDate;
                return task.startDate === dateStr;
            }
            function isTaskDoneOnDate(task, dateStr) {
                if (isPeriodTask(task)) return isPeriodTaskChecked(task);
                return isCheckedOnDate(task.id, dateStr);
            }

            function getDayCompletionStatus(dateStr) {
                const today = getBeijingDateStr();
                if (dateStr >= today) return 'none';
                const dueTasks = state.tasks.filter(t => isTaskDueOnDate(t, dateStr));
                const extraTasks = state.extraTasks.filter(t => t.createdDate === dateStr);
                const total = dueTasks.length + extraTasks.length;
                if (total === 0) return 'none';
                let completed = 0;
                dueTasks.forEach(t => { if (isTaskDoneOnDate(t, dateStr)) completed++; });
                extraTasks.forEach(t => {
                    if (state.checkins.some(c => c.date === dateStr && c.taskId === t.id && c.isExtra)) completed++;
                });
                return completed >= total ? 'completed' : 'incomplete';
            }

            function renderCalendar() {
                const start = calendarWeekStart;
                const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
                const monthLabel = document.getElementById('calendarMonth');
                monthLabel.textContent = monthNames[start.getMonth()];

                const grid = document.getElementById('calendarGrid');
                const todayStr = getBeijingDateStr();
                const cells = [];

                for (let i = 0; i < 7; i++) {
                    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
                    const dateStr = formatDate(d);
                    const isToday = dateStr === todayStr;
                    const isFuture = dateStr > todayStr;
                    let status = '';
                    if (!isToday && !isFuture) {
                        const s = getDayCompletionStatus(dateStr);
                        if (s === 'completed') status = 'completed';
                        else if (s === 'incomplete') status = 'incomplete';
                    }
                    cells.push({ day: d.getDate(), isToday, status });
                }
                grid.innerHTML = cells.map(c => {
                    let cls = 'calendar-day';
                    if (c.isToday) cls += ' today';
                    else if (c.status) cls += ' ' + c.status;
                    return `<div class="${cls}">${c.day}</div>`;
                }).join('');
            }

            function getTagClass(text) {
                if (text === '校内任务' || text === '校外任务') return 'tag-green';
                if (text === '语文' || text === '数学' || text === '英语') return 'tag-purple';
                return 'tag-orange';

            function renderTaskGroup(containerId, category, countBadgeId) {
                const container = document.getElementById(containerId);
                if (!container) return;

                const today = getBeijingDateStr();
                const todayCheckTaskIds = new Set(state.checkins.filter(c => c.date === today && !c.isExtra).map(c => c.taskId));

                const isAdminOp = (currentRole === 'admin' && isAdminAuthenticated);
                const tasks = state.tasks.filter(task => {
                    if (task.category !== category) return false;
                    if (todayCheckTaskIds.has(task.id)) return true;
                    if (isAdminOp && isPeriodTask(task) && isPeriodTaskChecked(task)) return true;
                    return isTaskInValidPeriod(task, today);
                });

                if (countBadgeId) {
                    const badge = document.getElementById(countBadgeId);
                    if (badge) badge.textContent = `${tasks.length}项`;
                }

                if (tasks.length === 0) {
                    container.innerHTML = `<div style="text-align:center;padding:16px;color:var(--text-sub);background:transparent;border-radius:var(--radius-card);font-weight:800;">暂无任务，好好休息~</div>`;
                    return;

                    sortedSubjects.sort((a,b) => (order[a]||99) - (order[b]||99));

                    sortedSubjects.sort((a,b) => (order[a]||99) - (order[b]||99));

            function renderOverdueTasks() {
                const container = document.getElementById('overdueTaskList');
                if (!container) return;

                const today = getBeijingDateStr();
                const LOOKBACK_DAYS = 2;
                const lookbackDates = [];
                for (let i = 1; i <= LOOKBACK_DAYS; i++) lookbackDates.push(shiftDateStr(today, -i));

                const items = [];

                state.tasks.forEach(task => {
                    const start = task.startDate || today;
                    if (isDailyTask(task)) {
                        const missed = lookbackDates.filter(d => {
                            if (d < start) return false;
                            if (task.endDate && d > task.endDate) return false;
                            return !isCheckedOnDate(task.id, d);
                        });
                        if (missed.length > 0) items.push({ task, missed });
                    } else if (isPeriodTask(task)) {
                        if (today > task.endDate && !isPeriodTaskChecked(task)) {
                            items.push({ task, missed: [task.endDate] });
                        }
                    } else {
                        if (today > start && !isCheckedOnDate(task.id, start)) {
                            items.push({ task, missed: [start] });
                        }
                    }
                });

                items.sort((a, b) => (b.missed[0] || '').localeCompare(a.missed[0] || ''));
                document.getElementById('overdueCountBadge').textContent = `${items.length}项`;

                if (items.length === 0) {

            function toggleShopSelect(id) {
                if (id === MONEY_ITEM_ID && !selectedShopIds.has(id)) {
                    const balance = Math.max(0, calcShopBalance());
                    const el = document.getElementById('moneyAmountInput');
                    const raw = el ? el.value : moneyAmount;
                    const v = parseInt(String(raw).replace(/[^0-9]/g, ''), 10);
                    if (!v || v < 1) { showToast('请先填写要兑换的星值', false); return; }
                    if (v > balance) { showToast(`不能超过可用星值 ${balance}`, false); return; }

                }
                if (selectedShopIds.has(id)) selectedShopIds.delete(id);
                else selectedShopIds.add(id);

            function doClearSelection() {
                if (selectedShopIds.size === 0 && !moneyAmount) { showToast('当前没有选择', false); return; }
                selectedShopIds.clear();
                moneyAmount = 0;
                renderShopPage();
                showToast('已清空选择');
            }

            function doRedeem() {
                if (selectedShopIds.size === 0) { showToast('请先选择要兑换的商品', false); return; }
                const balance = calcShopBalance();
                const items = [...selectedShopIds].map(id => {
                    if (id === MONEY_ITEM_ID) return { id: MONEY_ITEM_ID, name: 'MONEY', cost: moneyAmount };
                    return (state.shopItems || []).find(i => i.id === id);
                }).filter(Boolean);

                if (selectedShopIds.has(MONEY_ITEM_ID)) {
                    if (!moneyAmount || moneyAmount < 1) { showToast('请先填写要兑换的星值', false); return; }
                    if (moneyAmount > balance) { showToast(`不能超过可用星值 ${balance}`, false); return; }
                }

                const cost = items.reduce((sum, i) => sum + (i.cost || 0), 0);
                if (cost > balance) {
                    showToast(`星值不足，还差 ${cost - balance}`, false);
                    return;
                }
                const names = items.map(i => `${escapeHtml(i.name)}（${i.cost}★）`).join('、');
                showModal({
                    title: '确认兑换',
                    contentHTML: `<div style="font-size:14px; font-weight:800; line-height:1.7; color:var(--text-main);">
                        商品：${names}<br>

                    </div>`,
                    confirmText: '确认兑换',
                    cancelText: '再想想',
                    onConfirm: () => {

            function openImageCropper(src, onDone) {
                const overlay = document.createElement('div');
                overlay.className = 'crop-overlay';
                overlay.innerHTML = `
                    <div class="crop-title">拖动图片 · 缩放后裁剪</div>
                    <div class="crop-stage" id="cropStage">
                        <img id="cropImg" src="${src}" alt="">
                        <div class="crop-guide"></div>
                    </div>
                    <div class="crop-toolbar">
                        <span>缩放</span>
                        <input type="range" id="cropZoom" min="100" max="400" value="100">
                    </div>
                    <div class="crop-actions">
                        <button class="btn-outline" id="cropCancel">取消</button>
                        <button class="btn-primary" id="cropConfirm">使用图片</button>
                    </div>
                `;
                document.body.appendChild(overlay);

                const stage = overlay.querySelector('#cropStage');
                const img = overlay.querySelector('#cropImg');
                const zoomInput = overlay.querySelector('#cropZoom');
                let zoom = 1, k = 1, left = 0, top = 0;
                let dragging = false, dsx = 0, dsy = 0, dl = 0, dt = 0;
                let pinchDist = 0, pinchZoom = 1;

                const apply = () => {
                    img.style.width = (img.naturalWidth * k) + 'px';
                    img.style.height = (img.naturalHeight * k) + 'px';
                    img.style.left = left + 'px';
                    img.style.top = top + 'px';
                };
                const clamp = () => {
                    const S = stage.clientWidth;
                    left = Math.min(0, Math.max(S - img.naturalWidth * k, left));
                    top = Math.min(0, Math.max(S - img.naturalHeight * k, top));
                };
                const init = () => {
                    const S = stage.clientWidth;
                    k = Math.max(S / img.naturalWidth, S / img.naturalHeight);
                    left = (S - img.naturalWidth * k) / 2;
                    top = (S - img.naturalHeight * k) / 2;
                    clamp(); apply();
                };
                const setZoom = (z, cx, cy) => {
                    if (!img.naturalWidth) return;
                    const S = stage.clientWidth;
                    const oldK = k;
                    zoom = Math.max(1, Math.min(4, z));
                    k = Math.max(S / img.naturalWidth, S / img.naturalHeight) * zoom;
                    const ax = (cx == null ? S / 2 : cx), ay = (cy == null ? S / 2 : cy);
                    left = ax - (ax - left) * (k / oldK);
                    top = ay - (ay - top) * (k / oldK);
                    clamp(); apply();
                    zoomInput.value = Math.round(zoom * 100);
                };
                if (img.complete && img.naturalWidth) init(); else img.onload = init;

                stage.addEventListener('pointerdown', (e) => {
                    if (e.isPrimary === false) return;
                    dragging = true; dsx = e.clientX; dsy = e.clientY; dl = left; dt = top;
                    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
                });
                stage.addEventListener('pointermove', (e) => {
                    if (!dragging) return;
                    left = dl + (e.clientX - dsx);
                    top = dt + (e.clientY - dsy);
                    clamp(); apply();
                });
                const endDrag = () => { dragging = false; };
                stage.addEventListener('pointerup', endDrag);
                stage.addEventListener('pointercancel', endDrag);

                stage.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    setZoom(zoom * (e.deltaY < 0 ? 1.1 : 0.9));
                }, { passive: false });

                stage.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        dragging = false;
                        pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                               e.touches[0].clientY - e.touches[1].clientY);
                        pinchZoom = zoom;
                    }
                }, { passive: true });
                stage.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && pinchDist) {
                        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                                             e.touches[0].clientY - e.touches[1].clientY);
                        const r = stage.getBoundingClientRect();
                        setZoom(pinchZoom * d / pinchDist,
                                (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left,
                                (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top);
                        e.preventDefault();
                    }
                }, { passive: false });
                stage.addEventListener('touchend', () => { pinchDist = 0; }, { passive: true });

                zoomInput.addEventListener('input', () => setZoom(parseInt(zoomInput.value, 10) / 100));

                const escHandler = (e) => {
                    if (e.key === 'Escape') { e.stopImmediatePropagation(); e.preventDefault(); close(); }
                };
                const close = () => {
                    overlay.remove();
                    document.removeEventListener('keydown', escHandler, true);
                };
                document.addEventListener('keydown', escHandler, true);

                overlay.querySelector('#cropCancel').onclick = () => close();
                overlay.querySelector('#cropConfirm').onclick = () => {
                    if (!img.naturalWidth) { close(); return; }
                    const S = stage.clientWidth;
                    const sx = -left / k, sy = -top / k, sw = S / k, sh = S / k;
                    const canvas = document.createElement('canvas');
                    canvas.width = 160; canvas.height = 160;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 160, 160);
                    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 160, 160);
                    const out = canvas.toDataURL('image/jpeg', 0.82);
                    close();
                    onDone(out);
                };
            }

                let pendingImage = '';
                showModal({
                    title: '新增商品',
                    contentHTML: `
                        <div style="display:flex; flex-direction:column; gap:2px;">
                            <div class="modal-label" style="margin-bottom:8px;">商品图片</div>
                            <div style="display:flex; align-items:center; gap:14px; margin-bottom:18px;">

                            <div class="shop-item-err" id="shopItemErr"></div>
                        </div>
                    `,
                    confirmText: '保存',
                    onConfirm: () => {
                        const errEl = document.getElementById('shopItemErr');
                        const fail = (msg) => {
                            if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
                            showToast(msg, false);
                            return false;
                        };
                        const nameEl = document.getElementById('shopItemName');
                        const costEl = document.getElementById('shopItemCost');
                        const name = nameEl ? (nameEl.value || '').trim() : '';
                        const costRaw = costEl ? String(costEl.value || '').replace(/[^0-9]/g, '') : '';
                        const cost = parseInt(costRaw, 10);
                        if (!name) return fail('请填写商品名称');

                            });
                        };
                        reader.readAsDataURL(file);
                        e.target.value = '';
                    });
                }, 0);
            }

            function revokeRedeem(recordId) {
                const rec = (state.redemptions || []).find(r => r.id === recordId);
                if (!rec) {
                    showToast('该记录已归档，无法撤销', false);
                    return;
                }
                showModal({
                    title: '撤销兑换',
                    content: `撤销「${rec.name}」的兑换，${rec.cost} 星值将退回可用星值。`,
                    confirmText: '撤销',
                    danger: true,
                    onConfirm: () => {
                        state.redemptions = state.redemptions.filter(r => r.id !== recordId);
                        saveState();
                        renderAll();
                        renderShopPage();
                        showToast(`已撤销，退回 ${rec.cost} 星值`);
                    }
                });
            }

            function showToast(message, isSuccess = true) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';
                const icon = isSuccess ? 'icon_toast_ok.svg' : 'icon_toast_warn.svg';
                toast.innerHTML = `<img src="${icon}" class="zoom-icon" style="width: 14px; height: 14px;"> ${escapeHtml(message)}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    toast.style.transition = 'all 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }

            function toggleTaskCheck(taskId) {
                const today = getBeijingDateStr();
                const task = state.tasks.find(t => t.id === taskId);
                if (!task) return;

                const isAdminOp = (currentRole === 'admin' && isAdminAuthenticated);

                if (isPeriodTask(task)) {
                    const pIdx = state.checkins.findIndex(c => !c.isExtra && c.taskId === taskId
                        && c.date >= (task.startDate || '0000-01-01') && c.date <= (task.endDate || '9999-12-31'));
                    const expired = today > (task.endDate || '9999-12-31');
                    if (pIdx !== -1) {
                        if (expired && !isAdminOp) {
                            showToast('该周期任务已截止，不可取消', false);
                            return;
                        }
                        state.checkins.splice(pIdx, 1);
                        showToast('取消完成');
                    } else {
                        if (expired && !isAdminOp) {
                            showToast('该周期任务已截止，不可打卡', false);
                            return;
                        }
                        if (!canTaskCheck(task)) {
                            showToast('该任务当前不可打卡', false);
                            return;
                        }
                        state.checkins.push({ date: today, taskId, timestamp: Date.now() });
                        showToast('完成打卡');
                    }
                    saveState();
                    renderAll();
                    return;
                }

                const existingIndex = state.checkins.findIndex(c => c.date === today && c.taskId === taskId && !c.isExtra);
                if (existingIndex !== -1) {
                    state.checkins.splice(existingIndex, 1);
                    showToast(`取消完成`);
                } else {
                    if (!canTaskCheck(task)) {
                        showToast(`该任务当前不可打卡`, false);
                        return;
                    }
                    state.checkins.push({ date: today, taskId, timestamp: Date.now() });
                    showToast(`完成打卡`);
                }
                saveState();
                renderAll();
            }

            function toggleExtraCheck(extraId) {
                const today = getBeijingDateStr();
                const extraTask = state.extraTasks.find(t => t.id === extraId);
                if (!extraTask) return;

                const existingIndex = state.checkins.findIndex(c => c.taskId === extraId && c.isExtra);
                if (existingIndex !== -1) {
                    if (state.checkins[existingIndex].date !== getBeijingDateStr() && currentRole !== 'admin') {
                        showToast('过期的打卡不可取消', false);
                        return;
                    }
                    state.checkins.splice(existingIndex, 1);
                    showToast(`取消额外任务`);
                } else {
                    state.checkins.push({ date: extraTask.createdDate || today, taskId: extraId, reward: extraTask.reward, timestamp: Date.now(), isExtra: true });
                    const rewardStr = extraTask.reward >= 0 ? '+' + extraTask.reward : extraTask.reward;
                    showToast(`完成额外任务 ${rewardStr}星`);
                }
                saveState();
                renderAll();
            }

            function deleteTaskConfirm(taskId) {
                if (!(currentRole === 'admin' && isAdminAuthenticated)) return;
                const task = state.tasks.find(t => t.id === taskId);
                if (!task) return;
                showModal({
                    title: '删除任务',
                    content: `确定要删除 "${escapeHtml(task.name)}" 吗？相关打卡也会清除。`,
                    confirmText: '删除',
                    danger: true,
                    onConfirm: () => {
                        state.tasks = state.tasks.filter(t => t.id !== taskId);
                        state.checkins = state.checkins.filter(c => c.taskId !== taskId);
                        saveState();
                        renderAll();
                        showToast('已删除');
                    }
                });
            }

            function showModal({ title, content, contentHTML, confirmText = '确认', cancelText = '取消', danger = false, onConfirm, onCancel }) {
                const modalRoot = document.getElementById('modalRoot');
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'modal-content';

                const cancelBtnHtml = cancelText ? `<button class="btn-cancel" id="modalCancel">${cancelText}</button>` : '';
                const actionStyle = cancelText ? '' : 'width: 100%;';

                let titleHtml = title.includes('<img') ? `<div style="display:flex; justify-content:center; align-items:center; gap:8px;">${title}</div>` : escapeHtml(title);

                modal.innerHTML = `
                    <h3>${titleHtml}</h3>
                    <div id="modalBody">${contentHTML || `<p style="margin-bottom:24px; color:var(--text-main); font-weight:600; text-align:center;">${escapeHtml(content || '')}</p>`}</div>
                    <div class="modal-actions">
                        ${cancelBtnHtml}
                        <button class="${danger ? 'btn-danger' : 'btn-confirm'}" id="modalConfirm" style="${actionStyle}">${confirmText}</button>
                    </div>
                `;
                overlay.appendChild(modal);
                modalRoot.appendChild(overlay);

                const closeModal = () => overlay.remove();

                const cancelBtn = document.getElementById('modalCancel');
                if (cancelBtn) {
                    cancelBtn.onclick = () => {
                        if (onCancel && onCancel() === false) return;
                        closeModal();
                    };
                }

                document.getElementById('modalConfirm').onclick = () => {
                    if (onConfirm && onConfirm() === false) return;
                    closeModal();
                };
                overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
                const onEsc = (e) => {
                    if (e.key === 'Escape') {
                        closeModal();
                        document.removeEventListener('keydown', onEsc);
                    }
                };
                document.addEventListener('keydown', onEsc);
            }

            function openProfileModal() {
                if (!(currentRole === 'admin' && isAdminAuthenticated)) return;
                const currentName = state.profile.name || 'HEIDI';
                let pendingAvatar = state.profile.avatar || '';

                showModal({
                    title: '编辑资料',
                    contentHTML: `
                        <label>名字</label>
                        <input id="profileNameInput" type="text" value="${escapeHtml(currentName)}" maxlength="10" />
                        <label>头像</label>
                        <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
                            <div id="avatarPreview" class="avatar" style="width:72px;height:72px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:transparent;${pendingAvatar ? `background-image:url(${pendingAvatar});background-size:cover;` : ''}"></div>
                            <label class="btn-outline" style="cursor:pointer; padding:10px 20px;">
                                上传图片
                                <input id="avatarFileInput" type="file" accept="image/*" style="display:none;" />
                            </label>
                        </div>
                    `,
                    confirmText: '保存',
                    onConfirm: () => {
                        const name = document.getElementById('profileNameInput').value.trim() || 'HEIDI';
                        state.profile.name = name;
                        state.profile.avatar = pendingAvatar;
                        saveState();
                        renderAll();
                        showToast('资料已更新');
                    }
                });

                setTimeout(() => {
                    const fileInput = document.getElementById('avatarFileInput');
                    const preview = document.getElementById('avatarPreview');
                    if (!fileInput) return;
                    fileInput.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                const maxSize = 200;
                                let w = img.width, h = img.height;
                                if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
                                else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
                                const canvas = document.createElement('canvas');
                                canvas.width = w; canvas.height = h;
                                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                pendingAvatar = canvas.toDataURL('image/jpeg', 0.85);
                                preview.style.backgroundImage = `url(${pendingAvatar})`;
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }, 0);
            }

                if (!select || !input) return;
                if (select.value === '__custom__') input.style.display = '';
                else input.style.display = 'none';

                const cat = document.getElementById('modalTaskCategory').value;
                const subContainer = document.getElementById('subjectContainer');

                if (cat === '校内任务') {
                    subContainer.innerHTML = `
                        <select id="modalTaskSubjectSelect">

                            <option value="英语">英语</option>
                            <option value="其它">其它</option>
                        </select>
                    `;

                    subContainer.innerHTML = `
                        <select id="modalTaskSubjectSelect" onchange="toggleCustomSubjectInput()">
                            <option value="口语">口语</option>
                            <option value="新东方">新东方</option>
                            <option value="__custom__">自定义</option>
