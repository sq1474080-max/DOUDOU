                        `;
                    }
                };

                setTimeout(() => {
                    const fileInput = document.getElementById('ocrFileInput');
                    const statusEl = document.getElementById('ocrStatus');
                    const previewContainer = document.getElementById('ocrPreviewContainer');
                    const previewImg = document.getElementById('ocrPreviewImg');
                    const resultEl = document.getElementById('ocrResult');

                    if (!fileInput) return;

                    fileInput.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            previewContainer.style.display = 'block';
                            previewImg.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);

                        statusEl.innerHTML = '⏳ 正在识别中，请稍候...';
                        resultEl.value = '';

                        try {
                            if (typeof Tesseract === 'undefined') {
                                statusEl.innerHTML = '❌ 识别组件未加载（网络受限），请连通网络后重试，或手动输入任务';
                                return;
                            }
                            const { data: { text } } = await Tesseract.recognize(
                                file,
                                'chi_sim+eng',
                                { logger: m => {
                                    if (m.status === 'recognizing text') {
                                        statusEl.innerHTML = `⏳ 识别进度：${Math.round(m.progress * 100)}%`;
                                    }
                                }}
                            );

                            let cleanText = text.split('\n')
                                .map(l => l.trim())
                                .filter(l => l.length > 0)
                                .join('\n');

                            resultEl.value = cleanText;
                            statusEl.innerHTML = '✅ 识别完成，请在文本框内修改';
                            if (!cleanText) {
                                statusEl.innerHTML = '⚠️ 未能识别出文字，请重试';
                            }
                        } catch (error) {
                            console.error('OCR Error:', error);
                            statusEl.innerHTML = '❌ 识别失败，请检查网络或重试';
                        }
                    });
                }, 100);
            }

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    if (supabaseClient) {
                        fetchCloudState();
                    }
                }
            });

            let touchStartY = 0;
            let isPulling = false;

            document.addEventListener('touchstart', (e) => {
                if (window.scrollY <= 0) {
                    touchStartY = e.touches[0].clientY;
                    isPulling = true;
                }
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                if (!isPulling) return;
                let distance = e.changedTouches[0].clientY - touchStartY;
                if (distance > 100 && window.scrollY <= 0) {
                    window.location.reload();
                }
                isPulling = false;
            });

            function bindEvents() {
                document.getElementById('btnChildMode').addEventListener('click', () => {
                    currentRole = 'child';
                    isAdminAuthenticated = false;
                    renderAll();
                });

                document.getElementById('btnAdminMode').addEventListener('click', () => {
                    if (isAdminAuthenticated && currentRole === 'admin') return;
                    showModal({
                        title: '管理员验证',
                        contentHTML: `<input id="pwdInput" type="password" placeholder="请输入密码" autofocus style="text-align:center; letter-spacing:5px;" />`,
                        confirmText: '进入',
                        onConfirm: () => {
                            const pwd = document.getElementById('pwdInput').value;
                            if (pwd === ADMIN_PASSWORD) {
                                currentRole = 'admin';
                                isAdminAuthenticated = true;
                                renderAll();
                                showToast('欢迎回来，管理员');
                                return true;
                            } else {
                                alert('密码错误');
                                return false;
                            }
                        }
                    });
                });

                document.body.addEventListener('click', (e) => {
                    if (e.target.closest('.collapse-btn')) {
                        const btn = e.target.closest('.collapse-btn');
                        const targetId = btn.dataset.target;
                        const targetEl = document.getElementById(targetId);
                        const wrapper = btn.closest('.section-wrapper');
                        if (targetEl) {
                            if (targetEl.style.display === 'none') {
                                targetEl.style.display = '';
                                btn.innerHTML = '<img src="icon_expand.svg" class="zoom-icon" style="width: 14px; height: 14px;">';
                                if (wrapper) wrapper.classList.remove('collapsed');
                            } else {
                                targetEl.style.display = 'none';
                                btn.innerHTML = '<img src="icon_collapse.svg" class="zoom-icon" style="width: 14px; height: 14px;">';
                                if (wrapper) wrapper.classList.add('collapsed');
                            }
                        }
                    }
                });

                document.body.addEventListener('change', (e) => {
                    if (e.target.matches('.exam-score-input')) {
                        const examId = e.target.dataset.examId;
                        const exam = state.exams.find(x => x.id === examId);
                        if (exam && exam.score !== null && !(currentRole === 'admin' && isAdminAuthenticated)) {
                            showToast('无法修改已录入的分数', false);
                            renderExams();
                            return;
                        }

                        let val = parseFloat(e.target.value);
                        if (e.target.value.trim() === '') {
                            val = null;
                        } else if (isNaN(val) || val < 0 || val > 100) {
                            showToast('请输入0-100的有效分数', false);
                            renderExams();
                            return;
                        }
                        if (exam) {
                            exam.score = val;
                            saveState();
                            renderAll();
                            if (val !== null) {
                                showToast(`分数已录入，获得 ${getExamStars(val)} 星`);
                            }
                        }
                    }
                });

                document.getElementById('addExamBtn').addEventListener('click', () => openExamModal(null));
                document.getElementById('addInSchoolBtn').addEventListener('click', () => openTaskModal(null, '校内任务'));
                document.getElementById('addOutSchoolBtn').addEventListener('click', () => openTaskModal(null, '校外任务'));
                document.getElementById('openCreateTaskBtn').addEventListener('click', () => openTaskModal(null, '校内任务'));

                document.getElementById('addExtraBtn').addEventListener('click', () => openExtraModal(null));
                document.getElementById('editProfileBtn').addEventListener('click', openProfileModal);
                document.getElementById('ocrBtn').addEventListener('click', openOcrModal);
                document.getElementById('resetStarsBtn').addEventListener('click', resetStarsConfirm);

                document.body.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-action]');
                    if (!target) return;
                    const action = target.dataset.action;

                    if (action === 'toggle-check') {
                        toggleTaskCheck(target.dataset.taskId);
                    } else if (action === 'toggle-extra') {
                        toggleExtraCheck(target.dataset.extraId);
                    } else if (action === 'edit-task') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const task = state.tasks.find(t => t.id === target.dataset.taskId);
                            if (task) openTaskModal(task);
                        }
                    } else if (action === 'delete-task') {
                        if (currentRole === 'admin' && isAdminAuthenticated) deleteTaskConfirm(target.dataset.taskId);
                    } else if (action === 'edit-extra') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const extra = state.extraTasks.find(t => t.id === target.dataset.extraId);
                            if (extra) openExtraModal(extra);
                        }
                    } else if (action === 'delete-extra') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const extraId = target.dataset.extraId;
                            showModal({
                                title: '删除额外任务',
                                content: '确定删除吗？',
                                confirmText: '删除',
                                danger: true,
                                onConfirm: () => {
                                    state.extraTasks = state.extraTasks.filter(t => t.id !== extraId);
                                    state.checkins = state.checkins.filter(c => !(c.taskId === extraId && c.isExtra));
                                    saveState();
                                    renderAll();
                                    showToast('已删除');
                                }
                            });
                        }
                    } else if (action === 'edit-exam') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const exam = state.exams.find(x => x.id === target.dataset.examId);
                            if (exam) openExamModal(exam);
                        }
                    } else if (action === 'delete-exam') {
                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const examId = target.dataset.examId;
                            showModal({
                                title: '删除考试',
                                content: '确定删除该考试记录吗？',
                                confirmText: '删除',
                                danger: true,
                                onConfirm: () => {
                                    state.exams = state.exams.filter(x => x.id !== examId);
                                    saveState();
                                    renderAll();
                                    showToast('已删除');
                                }
                            });
                        }
                    }
                });

                document.getElementById('prevMonth').addEventListener('click', () => {
                    calendarWeekStart = new Date(calendarWeekStart.getFullYear(), calendarWeekStart.getMonth(), calendarWeekStart.getDate() - 7);
                    renderCalendar();
                });
                document.getElementById('nextMonth').addEventListener('click', () => {
                    calendarWeekStart = new Date(calendarWeekStart.getFullYear(), calendarWeekStart.getMonth(), calendarWeekStart.getDate() + 7);
                    renderCalendar();
                });

                document.getElementById('exportCsvBtn').addEventListener('click', () => {
                    const rows = [['日期', '类型', '名称', '详情/分数', '获得星值']];
                    state.checkins.forEach(c => {
                        if (c.isExtra) {
                            const t = state.extraTasks.find(x => x.id === c.taskId);
                            rows.push([c.date, '额外任务', t ? t.name : '已删除', '-', c.reward + '星']);
                        } else {
                            const t = state.tasks.find(x => x.id === c.taskId);
                            rows.push([c.date, '日常打卡', t ? t.name : '已删除', '-', '见月度奖励']);
                        }
                    });
                    state.exams.forEach(e => {
                        if (e.score !== null) {
                            rows.push([e.date, '考试', e.name, e.score + '分', getExamStars(e.score)]);
                        }
                    });
                    const csv = rows.map(r => r.join(',')).join('\n');
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv'}));
                    link.download = `星值记录_${getBeijingDateStr()}.csv`;
                    link.click();
                    showToast('CSV 已导出');
                });

                // ===== 底部导航：首页 / 星值商店 / 统计 =====
                document.querySelectorAll('.bottom-btn').forEach(btn => {
                    btn.addEventListener('click', () => switchView(btn.dataset.view));
                });

                // ===== 星值商店 =====
                document.getElementById('shopGrid').addEventListener('click', (e) => {
                    if (e.target.closest('#moneyAmountInput')) return;   // 点输入框不触发勾选
                    const delBtn = e.target.closest('[data-action="del-shop-item"]');
                    if (delBtn) { e.stopPropagation(); deleteShopItem(delBtn.dataset.shopId); return; }
                    const card = e.target.closest('.shop-item');
                    if (card) toggleShopSelect(card.dataset.shopId);
                });
                // 输入金额时同步到内存变量（不重渲染，避免输入框失焦）
                document.getElementById('shopGrid').addEventListener('input', (e) => {
                    if (e.target.id !== 'moneyAmountInput') return;
                    const v = parseInt(String(e.target.value || '').replace(/[^0-9]/g, ''), 10);
                    moneyAmount = v > 0 ? v : 0;
                });
                document.getElementById('redeemBtn').addEventListener('click', doRedeem);
                document.getElementById('clearSelBtn').addEventListener('click', doClearSelection);
                document.getElementById('addShopItemBtn').addEventListener('click', openShopItemModal);

                // ===== 统计页：管理员撤销兑换 =====
                document.getElementById('statsPageContent').addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-action="revoke-redeem"]');
                    if (btn) revokeRedeem(btn.dataset.redeemId);
                });
            }

            function init() {
                if (!state.checkins) state.checkins = [];
                if (!state.exams) state.exams = [];
                if (!state.extraTasks) state.extraTasks = [];
                if (!state.profile) state.profile = { name: 'HEIDI', avatar: '' };

                bindEvents();
                renderAll();

                if (supabaseClient) {
                    fetchCloudState();
                    setupRealtime();
                }
            }

            init();
        })();
    </script>
</body>
</html>
