<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA 核心配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HEIDI STAR">
    <link rel="apple-touch-icon" href="icon.png">
    
    <title>HEIDI星旅</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        /* 引入圆润现代无衬线字体 */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            --icy-blue: #E5F3FF;
            --soft-pink: #FFE2F4;
            --lilac: #9883F4;
            --aqua: #6AD5E8;
            --coral: #F36C62;
            --lime: #DBFB64;
            --ink: #202536;
            --white: #FFFFFF;
            
            --radius-card: 22px;
            --radius-btn: 999px;
            --shadow-soft: 0 8px 24px rgba(32, 37, 54, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'URW Gothic', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 核心设置：图标放大两倍，但不改变原盒模型大小 */
        .zoom-icon {
            transform: scale(2);
            transform-origin: center;
            max-width: none !important;
            object-fit: contain;
            z-index: 10;
        }

        body {
            background: linear-gradient(135deg, #E5F3FF 0%, #FFE2F4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 12px 20px 100px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            color: var(--ink);
            user-select: none;
            -webkit-user-select: none;
        }

        /* 顶部控制区 */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--ink);
            border-radius: var(--radius-btn);
            padding: 6px 12px;
            box-shadow: 0 10px 30px rgba(32, 37, 54, 0.1);
            flex-shrink: 0;
        }

        .header-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* 放大后略微调整间隙 */
            background: transparent;
            border: none;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 14px;
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: 0.3s;
        }
        .header-btn.active { 
            color: var(--ink); 
            background: var(--white);
        }
        
        /* 布局容器 */
        .layout-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .left-panel, .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        /* 第一栏：头像+名字 | 星值 */
        .profile-stats-bar {
            display: flex;
            gap: 16px;
            align-items: stretch;
        }

        /* 左侧头像卡片 */
        .profile-card {
            background: var(--white);
            border-radius: var(--radius-card);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: var(--shadow-soft);
            flex: 0 0 auto;
            min-width: 120px;
        }

        .avatar-container {
            width: 76px;
            height: 76px;
            background: var(--lilac);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            animation: blobFloat 4s ease-in-out infinite alternate;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
        }

        @keyframes blobFloat {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translateY(0); }
            100% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; transform: translateY(-5px); }
        }

        .avatar-eye {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--ink);
            border-radius: 50%;
            top: 40%;
        }
        .avatar-eye.left { left: 25%; }
        .avatar-eye.right { right: 25%; }
        
        .avatar-smile {
            position: absolute;
            width: 20px;
            height: 10px;
            border-bottom: 3px solid var(--ink);
            border-radius: 0 0 20px 20px;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
        }

        .avatar {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 28px;
            font-weight: 900;
            background-size: cover;
            background-position: center;
            z-index: 2;
        }
        .avatar[style*="url"] ~ .avatar-eye,
        .avatar[style*="url"] ~ .avatar-smile { display: none; }

        .profile-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--ink);
            text-align: center;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-profile-btn {
            background: var(--icy-blue);
            border: none;
            color: var(--ink);
            padding: 6px 14px;
            border-radius: var(--radius-btn);
            font-size: 12px;
            cursor: pointer;
            font-weight: 800;
        }

        /* 右侧星值统计 */
        .stats-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }

        .stats-card {
            border-radius: var(--radius-card);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-soft);
        }
        .stats-card.today { background: var(--aqua); color: var(--white); }
        .stats-card.month { background: var(--white); color: var(--ink); }

        .stats-label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stats-number {
            font-size: 26px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        /* 第二栏：日历 */
        .calendar-card {
            background: var(--white);
            border-radius: var(--radius-card);
            padding: 20px;
            box-shadow: var(--shadow-soft);
            width: 100%;
        }

        .calendar-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
        }

        .calendar-header .month-label {
            font-weight: 800;
            color: var(--ink);
            font-size: 18px;
        }

        .calendar-nav-btn {
            position: absolute;
            background: var(--icy-blue);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        #prevMonth { left: 0; }
        #nextMonth { right: 0; }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            text-align: center;
            font-size: 12px;
            color: #8892A6;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 4px;
        }

        .calendar-day {
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            border-radius: 50%;
            color: var(--ink);
        }

        .calendar-day.other-month { color: #D1D5E0; }
        
        .calendar-day.today {
            background: var(--lilac);
            color: var(--white);
            font-weight: 900;
        }

        /* 通用标题：压缩段前段后间距 */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 6px; /* 这里已调整为更紧凑 */
            font-weight: 800;
            color: var(--ink);
            font-size: 21px;
            width: 100%;
        }
        .section-title .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .title-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .collapse-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sub-title {
            font-size: 14px; 
            color: var(--ink); 
            font-weight: 800; 
            margin: 12px 0 6px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
            width: 100%;
        }

        /* 任务卡片 */
        .task-item {
            background: var(--white);
            border-radius: var(--radius-card);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-soft);
            transition: 0.2s;
            width: 100%;
        }

        .task-item.completed {
            background: rgba(255, 255, 255, 0.6);
            box-shadow: none;
            opacity: 0.7;
        }
        
        .task-item.overdue {
            background: #FFF0F0;
        }

        /* 任务图标容器：去除背景色，让其彻底透明 */
        .task-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
            background: transparent; /* 去掉浅蓝底色 */
            border-radius: 16px;
        }
        /* 移除之前对已完成和过期的额外背景覆盖 */
        .task-item.completed .task-icon { background: transparent; }
        .task-item.overdue .task-icon { background: transparent; }

        .task-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--ink);
            word-break: break-word;
        }

        .task-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* 标签胶囊 */
        .tag {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .tag-green { background: var(--lime); color: var(--ink); } 
        .tag-purple { background: #EDE8FF; color: var(--lilac); } 
        .tag-pink { background: var(--soft-pink); color: var(--ink); } 
        .tag-blue { background: var(--icy-blue); color: var(--ink); } 
        .tag-orange { background: #FFF3D6; color: #D48A3D; } 
        .tag-date { background: #F4F5F8; color: var(--ink); }
        .tag-today { background: var(--lilac); color: var(--white); }
        .tag-deadline { background: var(--aqua); color: var(--white); }

        /* 打卡圆形选择点 */
        .task-check {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid var(--icy-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
            background: var(--white);
        }
        .task-item.completed .task-check {
            background: var(--aqua);
            border-color: var(--aqua);
            color: var(--white);
        }

        /* 操作按钮 */
        .task-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            justify-content: center;
        }
        .icon-btn {
            background: var(--white);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--ink);
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(32, 37, 54, 0.05);
        }

        .overdue-badge {
            background: #FFE5E5;
            color: var(--coral);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }

        /* 按钮 */
        .btn-primary {
            background: var(--lilac);
            border: none;
            color: var(--white);
            padding: 12px 20px;
            border-radius: var(--radius-btn);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 12px rgba(152, 131, 244, 0.3);
            transition: 0.2s;
        }
        .btn-primary:active { transform: scale(0.96); }
        
        .btn-outline {
            background: var(--white);
            border: 2px solid var(--lilac);
            color: var(--lilac);
            padding: 10px 16px;
            border-radius: var(--radius-btn);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-outline:active { background: #EDE8FF; }
        .btn-sm { padding: 8px 14px; font-size: 13px; }

        .hidden { display: none !important; }

        /* 考试任务 */
        .exam-item {
            background: var(--white);
            border-radius: var(--radius-card);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-shadow: var(--shadow-soft);
        }
        .exam-score-input {
            width: 90px;
            padding: 10px 14px;
            border-radius: var(--radius-btn);
            border: 2px solid var(--icy-blue);
            text-align: center;
            font-weight: 800;
            font-size: 15px;
            color: var(--ink);
            outline: none;
            background: var(--icy-blue);
        }
        .exam-score-input:focus { border-color: var(--lilac); background: var(--white); }
        .exam-stars {
            font-weight: 800;
            font-size: 14px;
            color: var(--lilac);
        }
        .exam-stars.zero { color: #8892A6; }

        /* 底部导航（深色胶囊） */
        .bottom-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 400px;
            background: var(--ink);
            padding: 12px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-radius: var(--radius-btn);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(32, 37, 54, 0.2);
        }
        .bottom-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            background: transparent;
            border: none;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 20px;
        }
        .bottom-btn.active { color: var(--white); transform: scale(1.1); }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(32, 37, 54, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--white);
            border-radius: 28px;
            padding: 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { font-size: 22px; margin-bottom: 24px; color: var(--ink); text-align: center; font-weight: 800;}
        .modal-content label { font-size: 14px; font-weight: 800; color: var(--ink); margin-bottom: 8px; display: block; }
        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--icy-blue);
            border-radius: 16px;
            font-size: 15px;
            margin-bottom: 20px;
            background: var(--icy-blue);
            outline: none;
            color: var(--ink);
            font-weight: 600;
            transition: 0.2s;
        }
        .modal-content input:focus, .modal-content select:focus { border-color: var(--lilac); background: var(--white); }
        .modal-content input[type="date"] {
            min-height: 52px;
            -webkit-appearance: none;
            display: flex;
            align-items: center;
        }

        .modal-actions { display: flex; gap: 12px; margin-top: 12px; }
        .modal-actions button {
            flex: 1;
            padding: 16px;
            border-radius: var(--radius-btn);
            border: none;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-cancel { background: #F4F5F8; color: var(--ink); }
        .btn-confirm { background: var(--lilac); color: var(--white); box-shadow: 0 4px 12px rgba(152, 131, 244, 0.3); }
        .btn-danger { background: var(--coral); color: var(--white); }

        /* Toast */
        .toast-container { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
        .toast {
            background: var(--ink);
            color: var(--white);
            padding: 14px 24px;
            border-radius: var(--radius-btn);
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(32, 37, 54, 0.2);
            animation: dropDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        @keyframes dropDown { from { opacity: 0; transform: translateY(-30px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* --- 大屏 / iPad 横屏适配 --- */
        @media (min-width: 900px) {
            body { padding: 24px 40px 100px; }
            .app-header { max-width: 1200px; width: 100%; margin: 0 auto 24px auto; }
            .layout-container { flex-direction: row; align-items: flex-start; max-width: 1200px; width: 100%; margin: 0 auto; }
            .left-panel { flex: 0 0 340px; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 24px;}
            .right-panel { flex: 1; min-width: 0; }
            #inSchoolGroups, #outSchoolGroups { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
            .sub-title { grid-column: span 2; font-size: 15px; margin-top: 16px; }
            #overdueTaskList, #extraTaskList { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <button class="header-btn" id="btnChildMode"><img src="icon_child.svg" class="zoom-icon" style="width: 18px; height: 18px;"> 儿童模式</button>
        <button class="header-btn" id="btnAdminMode"><img src="icon_admin.svg" class="zoom-icon" style="width: 18px; height: 18px;"> 管理员</button>
        <button class="header-btn" id="exportCsvBtn"><img src="icon_export.svg" class="zoom-icon" style="width: 18px; height: 18px;"> 导出CSV</button>
    </div>

    <div class="layout-container">
        <div class="left-panel">
            <div class="profile-stats-bar">
                <div class="profile-card">
                    <div class="avatar-container">
                        <div class="avatar" id="avatarDisplay"></div>
                        <div class="avatar-eye left"></div>
                        <div class="avatar-eye right"></div>
                        <div class="avatar-smile"></div>
                    </div>
                    <div class="profile-name" id="profileName">HEIDI</div>
                    <button class="edit-profile-btn hidden" id="editProfileBtn">编辑资料</button>
                </div>
                <div class="stats-group">
                    <div class="stats-card today">
                        <span class="stats-label">今日获得</span>
                        <span class="stats-number" id="todayStars">0 <img src="icon_star.svg" class="zoom-icon" style="width: 22px; height: 22px;"></span>
                    </div>
                    <div class="stats-card month">
                        <span class="stats-label">本月获得</span>
                        <span class="stats-number" id="monthStars">0 <img src="icon_star.svg" class="zoom-icon" style="width: 22px; height: 22px;"></span>
                    </div>
                </div>
            </div>

            <div class="calendar-card">
                <div class="calendar-header">
                    <button class="calendar-nav-btn" id="prevMonth">‹</button>
                    <span class="month-label" id="calendarMonth">2026年11月</span>
                    <button class="calendar-nav-btn" id="nextMonth">›</button>
                </div>
                <div class="calendar-weekdays">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="section-title" style="margin-top:0;">
                <div class="title-left">
                    <img src="icon_gift_title.svg" class="zoom-icon" style="width: 22px; height: 22px;"> 额外任务
                </div>
                <div class="title-right">
                    <button class="btn-outline btn-sm hidden" id="addExtraBtn">+ 新增</button>
                    <button class="collapse-btn hidden" data-target="extraTaskList"><img src="icon_expand.svg" class="zoom-icon" style="width: 18px; height: 18px;"></button>
                </div>
            </div>
            <div id="extraTaskList" class="task-list"></div>
        </div>

        <div class="right-panel">
            <div class="section-title" style="margin-top:0;">
                <div class="title-left">
                    <img src="icon_school_title.svg" class="zoom-icon" style="width: 22px; height: 22px;"> 校内任务
                    <span id="inSchoolCountBadge" style="font-size:13px; background:var(--white); color:var(--ink); padding:4px 12px; border-radius:999px; font-weight:900; box-shadow: var(--shadow-soft);">0项</span>
                </div>
                <div class="title-right">
                    <button class="btn-outline btn-sm" id="addInSchoolBtn">+ 新增</button>
                    <button class="collapse-btn hidden" data-target="inSchoolGroups"><img src="icon_expand.svg" class="zoom-icon" style="width: 18px; height: 18px;"></button>
                </div>
            </div>
            <div id="inSchoolGroups"></div>

            <div class="section-title" style="margin-top:12px;">
                <div class="title-left">
                    <img src="icon_out_title.svg" class="zoom-icon" style="width: 22px; height: 22px;"> 校外任务
                    <span id="outSchoolCountBadge" style="font-size:13px; background:var(--white); color:var(--ink); padding:4px 12px; border-radius:999px; font-weight:900; box-shadow: var(--shadow-soft);">0项</span>
                </div>
                <div class="title-right">
                    <button class="btn-outline btn-sm" id="addOutSchoolBtn">+ 新增</button>
                    <button class="collapse-btn hidden" data-target="outSchoolGroups"><img src="icon_expand.svg" class="zoom-icon" style="width: 18px; height: 18px;"></button>
                </div>
            </div>
            <div id="outSchoolGroups"></div>

            <div class="section-title" style="margin-top:12px;">
                <div class="title-left">
                    <img src="icon_exam_title.svg" class="zoom-icon" style="width: 22px; height: 22px;"> 考试任务
                </div>
                <div class="title-right">
                    <button class="btn-outline btn-sm" id="addExamBtn">+ 新增考试</button>
                    <button class="collapse-btn hidden" data-target="examTaskList"><img src="icon_expand.svg" class="zoom-icon" style="width: 18px; height: 18px;"></button>
                </div>
            </div>
            <div id="examTaskList"></div>

            <div class="section-title" style="margin-top:12px;">
                <div class="title-left" style="font-size:18px;">
                    <img src="icon_overdue_title.svg" class="zoom-icon" style="width: 22px; height: 22px;"> 未完成任务
                </div>
                <div class="title-right">
                    <span id="overdueCountBadge" style="font-size:13px; background:var(--white); color:var(--ink); padding:4px 12px; border-radius:999px; font-weight:900; box-shadow: var(--shadow-soft);">0项</span>
                    <button class="collapse-btn hidden" data-target="overdueTaskList"><img src="icon_expand.svg" class="zoom-icon" style="width: 18px; height: 18px;"></button>
                </div>
            </div>
            <div id="overdueTaskList" class="task-list"></div>

            <div id="adminTaskLibrarySection" class="hidden">
                <div class="section-title" style="margin-top:12px;">
                    <span><img src="icon_book_title.svg" class="zoom-icon" style="width: 22px; height: 22px;"> 任务库管理</span>
                    <button class="btn-primary btn-sm" id="openCreateTaskBtn">+ 新增任务</button>
                </div>
                <div class="flex-row" style="display:flex; gap:8px; margin-bottom:12px;">
                    <button class="btn-outline btn-sm" id="ocrBtn"><img src="icon_camera.svg" class="zoom-icon" style="width: 18px; height: 18px;"> 拍照 OCR</button>
                    <button class="btn-outline btn-sm" id="resetStarsBtn" style="color:var(--coral); border-color:var(--coral);"><img src="icon_reset.svg" class="zoom-icon" style="width: 18px; height: 18px;"> 重置星值</button>
                </div>
                <div id="taskLibraryList" class="task-list"></div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="bottom-btn active" id="bottomHome">
            <img src="icon_nav_home.svg" class="zoom-icon" style="width: 24px; height: 24px;"> 今日
        </button>
        <button class="bottom-btn" id="bottomStats">
            <img src="icon_nav_stats.svg" class="zoom-icon" style="width: 24px; height: 24px;"> 统计
        </button>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <div id="modalRoot"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        const SUPABASE_URL = 'https://skgxcnnagfgwfrccwwrx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_t96OWboqHhMc4CSJLEuQXQ_TE_xIMdw';

        let supabaseClient = null;
        if (SUPABASE_URL && SUPABASE_URL !== '替换为您的_SUPABASE_URL') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        (function() {
            const STORAGE_KEY = 'star_task_app_v1';
            const ADMIN_PASSWORD = '111';

            function getBeijingNow() {
                const now = new Date();
                const utc = now.getTime() + now.getTimezoneOffset() * 60000;
                return new Date(utc + 8 * 3600000);
            }
            function getBeijingDateStr() {
                const bj = getBeijingNow();
                return `${bj.getFullYear()}-${String(bj.getMonth()+1).padStart(2,'0')}-${String(bj.getDate()).padStart(2,'0')}`;
            }

            const defaultTasks = [
                { id: 't1', name: '习题册', reward: 0, daily: true, note: '', category: '校内任务', subject: '语文', startDate: '2026-11-01', endDate: '' },
                { id: 't2', name: '口算', reward: 0, daily: true, note: '', category: '校内任务', subject: '数学', startDate: '2026-11-01', endDate: '' },
                { id: 't3', name: '英语阅读', reward: 0, daily: true, note: '', category: '校内任务', subject: '英语', startDate: '2026-11-01', endDate: '' }
            ];

            const defaultState = {
                tasks: [...defaultTasks],
                checkins: [],
                exams: [],
                extraTasks: [],
                profile: { name: 'HEIDI', avatar: '' }
            };

            function loadStateLocal() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try { 
                        const parsed = JSON.parse(stored);
                        parsed.tasks = (parsed.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        if (!parsed.profile) parsed.profile = { name: 'HEIDI', avatar: '' };
                        if (!parsed.exams) parsed.exams = [];
                        if (!parsed.extraTasks) parsed.extraTasks = [];
                        if (!parsed.checkins) parsed.checkins = [];
                        return parsed;
                    } catch (e) {}
                }
                return JSON.parse(JSON.stringify(defaultState));
            }

            let state = loadStateLocal();
            let currentRole = 'child';
            let isAdminAuthenticated = false;

            const bjInit = getBeijingNow();
            let calendarYear = bjInit.getFullYear();
            let calendarMonth = bjInit.getMonth();

            let saveTimeout = null;
            let isSyncingFromCloud = false;

            function saveState() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                if (supabaseClient && !isSyncingFromCloud) {
                    if (saveTimeout) clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(async () => {
                        try {
                            const payload = JSON.parse(JSON.stringify(state));
                            await supabaseClient.from('app_state').upsert({ id: 1, state_data: payload, updated_at: new Date().toISOString() });
                        } catch (error) {}
                    }, 800);
                }
            }

            async function fetchCloudState() {
                if (!supabaseClient) return;
                try {
                    const { data, error } = await supabaseClient.from('app_state').select('state_data').eq('id', 1).single();
                    if (error) throw error;
                    if (data && data.state_data && Object.keys(data.state_data).length > 0) {
                        isSyncingFromCloud = true;
                        state = data.state_data;
                        state.tasks = (state.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        renderAll();
                        isSyncingFromCloud = false;
                    }
                } catch (error) {}
            }

            function setupRealtime() {
                if (!supabaseClient) return;
                supabaseClient.channel('app_state_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
                    const newState = payload.new.state_data;
                    if (newState && Object.keys(newState).length > 0) {
                        isSyncingFromCloud = true;
                        state = newState;
                        state.tasks = (state.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        renderAll();
                        setTimeout(() => { isSyncingFromCloud = false; }, 100);
                    }
                }).subscribe();
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getExamStars(score) {
                if (score === null || score === undefined || score === '') return 0;
                const s = parseFloat(score);
                if (s >= 100) return 50;
                if (s >= 90) return 25;
                return 0;
            }

            function calcTodayStars() {
                const today = getBeijingDateStr();
                let sum = 0;
                state.checkins.forEach(c => {
                    if (c.date === today && c.isExtra) sum += (c.reward || 0);
                });
                state.exams.forEach(e => {
                    if (e.date === today) sum += getExamStars(e.score);
                });
                return sum;
            }

            function calcMonthStars() {
                const bj = getBeijingNow();
                const prefix = `${bj.getFullYear()}-${String(bj.getMonth()+1).padStart(2,'0')}`;
                const todayDate = bj.getDate();
                
                let extraSum = 0;
                let examSum = 0;
                
                state.checkins.forEach(c => {
                    if (c.date.startsWith(prefix) && c.isExtra) extraSum += (c.reward || 0);
                });
                
                state.exams.forEach(e => {
                    if (e.date.startsWith(prefix)) examSum += getExamStars(e.score);
                });
                
                const homeworkDates = new Set();
                state.checkins.forEach(c => {
                    if (!c.date.startsWith(prefix) || c.isExtra) return;
                    const task = state.tasks.find(t => t.id === c.taskId);
                    if (task && task.category === '校内任务') {
                        homeworkDates.add(c.date);
                    }
                });
                
                let isFullMonth = false;
                if (homeworkDates.size > 0) {
                    isFullMonth = true;
                    for (let i = 1; i <= todayDate; i++) {
                        const dStr = `${prefix}-${String(i).padStart(2,'0')}`;
                        if (!homeworkDates.has(dStr)) {
                            isFullMonth = false;
                            break;
                        }
                    }
                }
                
                const bonus = isFullMonth ? 20 : 0;
                return { total: extraSum + examSum + bonus, hasHomework: isFullMonth, extraSum, examSum, bonus };
            }

            function isTaskCheckedToday(taskId) {
                const today = getBeijingDateStr();
                return state.checkins.some(c => c.date === today && c.taskId === taskId && !c.isExtra);
            }

            function canTaskCheck(task) {
                const today = getBeijingDateStr();
                const now = getBeijingNow();

                if (task.endDate) {
                    const parts = task.endDate.split('-');
                    const deadline = new Date(parts[0], parts[1] - 1, parts[2]);
                    deadline.setHours(23, 59, 59, 999);
                    return now.getTime() <= deadline.getTime();
                } else {
                    if (task.startDate === today) return true;
                    if (task.daily) return true;
                    const parts = task.startDate.split('-');
                    const deadline = new Date(parts[0], parts[1] - 1, parts[2]);
                    deadline.setDate(deadline.getDate() + 1);
                    deadline.setHours(6, 0, 0, 0); 
                    return now.getTime() < deadline.getTime();
                }
            }

            function renderProfile() {
                const name = state.profile.name || 'HEIDI';
                const avatar = state.profile.avatar || '';
                const avatarEl = document.getElementById('avatarDisplay');
                
                if (avatar) {
                    avatarEl.style.backgroundImage = `url(${avatar})`;
                    avatarEl.textContent = '';
                } else {
                    avatarEl.style.backgroundImage = '';
                    avatarEl.textContent = ''; 
                }
                document.getElementById('profileName').textContent = name;

                const editBtn = document.getElementById('editProfileBtn');
                if (currentRole === 'admin' && isAdminAuthenticated) {
                    editBtn.classList.remove('hidden');
                } else {
                    editBtn.classList.add('hidden');
                }
            }

            function renderCalendar() {
                const monthLabel = document.getElementById('calendarMonth');
                monthLabel.textContent = `${calendarYear}年${calendarMonth + 1}月`;

                const grid = document.getElementById('calendarGrid');
                const firstDay = new Date(calendarYear, calendarMonth, 1);
                const startWeekday = firstDay.getDay();
                const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
                const prevMonthDays = new Date(calendarYear, calendarMonth, 0).getDate();

                const bj = getBeijingNow();
                const todayY = bj.getFullYear();
                const todayM = bj.getMonth();
                const todayD = bj.getDate();

                const cells = [];
                for (let i = 0; i < startWeekday; i++) {
                    cells.push({ day: prevMonthDays - startWeekday + 1 + i, otherMonth: true, isToday: false });
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    cells.push({ day: d, otherMonth: false, isToday: (calendarYear === todayY && calendarMonth === todayM && d === todayD) });
                }
                let nextDay = 1;
                while (cells.length % 7 !== 0) {
                    cells.push({ day: nextDay++, otherMonth: true, isToday: false });
                }

                grid.innerHTML = cells.map(c => `
                    <div class="calendar-day ${c.otherMonth ? 'other-month' : ''} ${c.isToday ? 'today' : ''}">${c.day}</div>
                `).join('');
            }

            function getTagClass(text) {
                if (text === '校内任务') return 'tag-green';
                if (text === '校外任务') return 'tag-orange';
                if (text === '语文') return 'tag-purple';
                if (text === '数学') return 'tag-pink';
                if (text === '英语') return 'tag-blue';
                return 'tag-green';
            }

            function renderTaskGroup(containerId, category, countBadgeId) {
                const container = document.getElementById(containerId);
                if (!container) return;

                const today = getBeijingDateStr();
                const todayCheckTaskIds = new Set(state.checkins.filter(c => c.date === today && !c.isExtra).map(c => c.taskId));
                
                const tasks = state.tasks.filter(task => {
                    if (task.category !== category) return false;
                    if (todayCheckTaskIds.has(task.id)) return true;
                    if (task.startDate > today) return false;
                    if (!canTaskCheck(task)) return false;
                    return true;
                });

                if (countBadgeId) {
                    const badge = document.getElementById(countBadgeId);
                    if (badge) badge.textContent = `${tasks.length}项`;
                }

                if (tasks.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center;padding:24px;color:var(--ink);background:var(--white);border-radius:var(--radius-card);font-weight:800;box-shadow:var(--shadow-soft);">暂无任务，好好休息~</div>`;
                    return;
                }

                const groups = {};
                tasks.forEach(t => {
                    const sub = t.subject || '其它';
                    if (!groups[sub]) groups[sub] = [];
                    groups[sub].push(t);
                });

                let html = '';
                let sortedSubjects = Object.keys(groups);
                if (category === '校内任务') {
                    const order = { '语文': 1, '数学': 2, '英语': 3, '其它': 4 };
                    sortedSubjects.sort((a,b) => (order[a]||99) - (order[b]||99));
                } else {
                    sortedSubjects.sort();
                }

                sortedSubjects.forEach(sub => {
                    html += `<div class="sub-title"><img src="icon_subject.svg" class="zoom-icon" style="width: 16px; height: 16px;"> ${sub}</div>`;
                    html += `<div class="task-list" style="display:grid; grid-template-columns:1fr; gap:12px;">`;
                    groups[sub].forEach(task => {
                        html += renderTaskItem(task, isTaskCheckedToday(task.id), false);
                    });
                    html += `</div>`;
                });

                container.innerHTML = html;
            }

            function renderInSchoolTasks() {
                renderTaskGroup('inSchoolGroups', '校内任务', 'inSchoolCountBadge');
            }

            function renderOutSchoolTasks() {
                renderTaskGroup('outSchoolGroups', '校外任务', 'outSchoolCountBadge');
            }

            function renderTaskItem(task, completed, overdue) {
                const showAdminActions = (currentRole === 'admin' && isAdminAuthenticated);
                const today = getBeijingDateStr();
                
                let tagsHtml = '';
                if (task.subject) {
                    tagsHtml += `<span class="tag ${getTagClass(task.subject)}">${task.subject}</span>`;
                }
                if (task.note) {
                    tagsHtml += `<span class="tag tag-orange">${escapeHtml(task.note)}</span>`;
                }
                if (task.daily) {
                    tagsHtml += `<span class="tag tag-green"><img src="icon_repeat.svg" class="zoom-icon" style="width: 14px; height: 14px;"> 每日</span>`;
                }
                
                if (overdue) {
                    tagsHtml += `<span class="tag tag-pink">原定：${task.startDate}${task.endDate ? ' 至 ' + task.endDate : ''}</span>`;
                } else {
                    if (task.endDate) {
                        tagsHtml += `<span class="tag tag-deadline">截止：${task.endDate}</span>`;
                    } else {
                        if (task.startDate === today || task.daily) {
                            tagsHtml += `<span class="tag tag-today">今日任务</span>`;
                        } else {
                            tagsHtml += `<span class="tag tag-date">${task.startDate}</span>`;
                        }
                    }
                }

                const checkHtml = overdue 
                    ? `<span class="overdue-badge">未完成</span>` 
                    : `<div class="task-check" data-action="toggle-check" data-task-id="${task.id}">${completed ? '✓' : ''}</div>`;

                return `
                    <div class="task-item ${completed ? 'completed' : ''} ${overdue ? 'overdue' : ''}" data-task-id="${task.id}">
                        <div class="task-icon">
                            <img src="${task.category === '校内任务' ? 'icon_in_card.svg' : 'icon_out_card.svg'}" class="zoom-icon" style="width: 28px; height: 28px;">
                        </div>
                        <div class="task-info">
                            <div class="task-name">${escapeHtml(task.name)}</div>
                            <div class="task-meta">
                                ${tagsHtml}
                            </div>
                        </div>
                        ${showAdminActions ? `
                        <div class="task-actions">
                            <button class="icon-btn" data-action="edit-task" data-task-id="${task.id}"><img src="icon_edit.svg" class="zoom-icon" style="width: 16px; height: 16px;"></button>
                        </div>` : ''}
                        ${checkHtml}
                    </div>
                `;
            }

            function renderExtraTasks() {
                const container = document.getElementById('extraTaskList');
                if (!container) return;
                
                const today = getBeijingDateStr();
                let todayExtras = state.extraTasks.filter(t => t.createdDate === today);
                
                if (currentRole !== 'admin') {
                    todayExtras = todayExtras.slice(-3);
                }

                if (todayExtras.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center;padding:24px;color:var(--ink);background:var(--white);border-radius:var(--radius-card);font-weight:800;box-shadow:var(--shadow-soft);">暂无额外任务</div>`;
                    return;
                }
                
                container.innerHTML = todayExtras.map(task => {
                    const completed = state.checkins.some(c => c.date === today && c.taskId === task.id && c.isExtra);
                    return `
                        <div class="task-item ${completed ? 'completed' : ''}">
                            <div class="task-icon"><img src="icon_gift_card.svg" class="zoom-icon" style="width: 28px; height: 28px;"></div>
                            <div class="task-info">
                                <div class="task-name">${escapeHtml(task.name)}</div>
                                <div class="task-meta">
                                    <span class="tag tag-orange">⭐${task.reward}</span>
                                    <span class="tag tag-date">${task.createdDate}</span>
                                </div>
                            </div>
                            ${currentRole === 'admin' && isAdminAuthenticated ? `
                            <div class="task-actions">
                                <button class="icon-btn" data-action="edit-extra" data-extra-id="${task.id}"><img src="icon_edit.svg" class="zoom-icon" style="width: 16px; height: 16px;"></button>
                                <button class="icon-btn" data-action="delete-extra" data-extra-id="${task.id}"><img src="icon_delete.svg" class="zoom-icon" style="width: 16px; height: 16px;"></button>
                            </div>` : ''}
                            <div class="task-check" data-action="toggle-extra" data-extra-id="${task.id}">${completed ? '✓' : ''}</div>
                        </div>
                    `;
                }).join('');
            }

            function renderExams() {
                const container = document.getElementById('examTaskList');
                if (!container) return;
                
                if (state.exams.length === 0) {
                    container.innerHTML = `<div style="text-align:center;padding:24px;color:var(--ink);background:var(--white);border-radius:var(--radius-card);font-weight:800;box-shadow:var(--shadow-soft);">暂无考试记录</div>`;
                    return;
                }
                
                const sortedExams = [...state.exams].sort((a,b) => b.date.localeCompare(a.date));
                
                container.innerHTML = sortedExams.map(exam => {
                    const stars = exam.score !== null ? getExamStars(exam.score) : 0;
                    const isZero = stars === 0;
                    const starText = exam.score !== null ? `获得 ${stars} 🌟` : '未录入';
                    
                    const canEditScore = (currentRole === 'admin' && isAdminAuthenticated) || (exam.score === null);

                    const scoreHtml = canEditScore
                        ? `<input type="number" step="0.5" min="0" max="100" class="exam-score-input" data-exam-id="${exam.id}" value="${exam.score !== null ? exam.score : ''}" placeholder="输入分数">`
                        : `<span style="font-weight:900; color:var(--ink); font-size:16px; margin-left:4px;">${exam.score}分</span>`;
                        
                    return `
                        <div class="exam-item">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div style="font-weight:800; font-size:16px; color:var(--ink); display:flex; align-items:center; gap:8px;">
                                    <span><img src="icon_exam_card.svg" class="zoom-icon" style="width: 18px; height: 18px;"> ${escapeHtml(exam.name)}</span>
                                </div>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span class="exam-stars ${isZero ? 'zero' : ''}">${starText}</span>
                                    <span style="font-size:12px; color:#8892A6; font-weight:800;">${exam.date}</span>
                                </div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
                                <div>${scoreHtml}</div>
                                ${currentRole === 'admin' && isAdminAuthenticated ? `

            function renderOverdueTasks() {
                const container = document.getElementById('overdueTaskList');
                if (!container) return;

                const today = getBeijingDateStr();
                const todayCheckTaskIds = new Set(state.checkins.filter(c => c.date === today && !c.isExtra).map(c => c.taskId));

                const overdueTasks = state.tasks.filter(task => {
                    if (todayCheckTaskIds.has(task.id)) return false;
                    if (task.startDate > today) return false;
                    return !canTaskCheck(task);
                });

                document.getElementById('overdueCountBadge').textContent = `${overdueTasks.length}项`;

                if (overdueTasks.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center;padding:24px;color:var(--ink);background:var(--white);border-radius:var(--radius-card);font-weight:800;box-shadow:var(--shadow-soft);">🎉 全部完成啦！</div>`;
                    return;

                overdueTasks.sort((a,b) => b.startDate.localeCompare(a.startDate));

                container.innerHTML = overdueTasks.map(task => {
                    let tagsHtml = `
                        <span class="tag ${getTagClass(task.category)}">${task.category}</span>
                        ${task.subject ? `<span class="tag ${getTagClass(task.subject)}">${task.subject}</span>` : ''}

                        tagsHtml += `<span class="tag tag-green"><img src="icon_repeat.svg" class="zoom-icon" style="width: 14px; height: 14px;"> 每日</span>`;

                        dateLabel = `${task.startDate} 至 ${task.endDate}`;
                    } else {
                        dateLabel = `任务日：${task.startDate}`;

                    tagsHtml += `<span class="tag tag-pink">${dateLabel}</span>`;

            function showToast(message, isSuccess = true) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';
                const icon = isSuccess ? 'icon_toast_ok.svg' : 'icon_toast_warn.svg';
                toast.innerHTML = `<img src="${icon}" class="zoom-icon" style="width: 18px; height: 18px;"> ${escapeHtml(message)}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    toast.style.transition = 'all 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }

            function toggleTaskCheck(taskId) {
                const today = getBeijingDateStr();
                const task = state.tasks.find(t => t.id === taskId);
                if (!task) return;
                
                if (!canTaskCheck(task) && !isTaskCheckedToday(taskId)) {
                    showToast('该任务已过期无法打卡', false);
                    return;
                }

                const existingIndex = state.checkins.findIndex(c => c.date === today && c.taskId === taskId && !c.isExtra);
                if (existingIndex !== -1) {
                    state.checkins.splice(existingIndex, 1);
                    showToast(`取消完成`);
                } else {
                    state.checkins.push({ date: today, taskId, timestamp: Date.now() });
                    showToast(`完成打卡`);
                }
                saveState();
                renderAll();
            }

            function toggleExtraCheck(extraId) {
                const today = getBeijingDateStr();
                const extraTask = state.extraTasks.find(t => t.id === extraId);
                if (!extraTask) return;

                const existingIndex = state.checkins.findIndex(c => c.date === today && c.taskId === extraId && c.isExtra);
                if (existingIndex !== -1) {
                    if (currentRole !== 'admin') {
                        const checkinTime = state.checkins[existingIndex].timestamp;
                        const now = Date.now();
                        if (new Date(checkinTime).toDateString() !== new Date().toDateString()) {
                            showToast('过期的打卡不可取消', false);
                            return;
                        }
                    }
                    state.checkins.splice(existingIndex, 1);
                    showToast(`取消额外任务`);
                } else {
                    state.checkins.push({ date: today, taskId: extraId, reward: extraTask.reward, timestamp: Date.now(), isExtra: true });
                    showToast(`完成额外任务 +${extraTask.reward}星`);
                }
                saveState();
                renderAll();
            }

            function showModal({ title, content, contentHTML, confirmText = '确认', cancelText = '取消', danger = false, onConfirm, onCancel }) {
                const modalRoot = document.getElementById('modalRoot');
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'modal-content';
                
                const cancelBtnHtml = cancelText ? `<button class="btn-cancel" id="modalCancel">${cancelText}</button>` : '';
                const actionStyle = cancelText ? '' : 'width: 100%;';

                modal.innerHTML = `
                    <h3>${escapeHtml(title)}</h3>
                    <div id="modalBody">${contentHTML || `<p style="margin-bottom:24px; color:var(--ink); font-weight:600; text-align:center;">${escapeHtml(content || '')}</p>`}</div>
                    <div class="modal-actions">
                        ${cancelBtnHtml}
                        <button class="${danger ? 'btn-danger' : 'btn-confirm'}" id="modalConfirm" style="${actionStyle}">${confirmText}</button>
                    </div>
                `;
                overlay.appendChild(modal);
                modalRoot.appendChild(overlay);

                const closeModal = () => overlay.remove();
                
                const cancelBtn = document.getElementById('modalCancel');
                if (cancelBtn) {
                    cancelBtn.onclick = () => {
                        if (onCancel && onCancel() === false) return;
                        closeModal();
                    };
                }
                
                document.getElementById('modalConfirm').onclick = () => {
                    if (onConfirm && onConfirm() === false) return;
                    closeModal();
                };
                overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
            }

            function openProfileModal() {
                if (!(currentRole === 'admin' && isAdminAuthenticated)) return;

                showModal({

                            <label class="btn-outline" style="cursor:pointer; padding:10px 20px;">
                                上传图片
                                <input id="avatarFileInput" type="file" accept="image/*" style="display:none;" />
                            </label>

                        state.profile.avatar = pendingAvatar;
                        saveState();
                        renderAll();
                        showToast('资料已更新');
                    }
                });

                setTimeout(() => {
                    const fileInput = document.getElementById('avatarFileInput');
                    const preview = document.getElementById('avatarPreview');
                    if (!fileInput) return;
                    fileInput.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                const maxSize = 200;
                                let w = img.width, h = img.height;
                                if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
                                else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
                                const canvas = document.createElement('canvas');
                                canvas.width = w; canvas.height = h;
                                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                pendingAvatar = canvas.toDataURL('image/jpeg', 0.85);
                                preview.style.backgroundImage = `url(${pendingAvatar})`;
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }, 0);
            }
