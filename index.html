<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="豆豆打卡">
    <title>豆豆任务</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f7f1e5;
            background-image: radial-gradient(#efe4d1 1px, transparent 1px), radial-gradient(#efe4d1 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            min-height: 100vh;
            padding: 12px 12px 80px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            color: #4a3b32;
        }

        /* 顶部导航 */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            background: #fdfbf7;
            border-radius: 20px;
            padding: 8px;
            box-shadow: 0 4px 12px rgba(180, 160, 140, 0.15);
            border: 1px solid #f0e6d6;
            flex-shrink: 0;
        }

        .header-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 700;
            color: #6b5b4e;
            padding: 6px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header-btn:active { background: #f0e6d6; }
        .header-btn.active { color: #d48a3d; }
        
        /* 布局容器 */
        .layout-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .left-panel, .right-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 第一栏：头像+名字 | 星值 */
        .profile-stats-bar {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        .profile-card {
            background: #fdfbf7;
            border-radius: 24px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 16px rgba(180, 160, 140, 0.15);
            flex: 0 0 auto;
            min-width: 110px;
            border: 2px solid #f4ead9;
        }

        .avatar-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #f6e3b4;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,#a1c4fd,#c2e9fb);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: 800;
            background-size: cover;
            background-position: center;
        }

        .profile-name {
            font-weight: 800;
            font-size: 15px;
            color: #5c4535;
            text-align: center;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .edit-profile-btn {
            background: #f0e6d6;
            border: none;
            color: #8c7661;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
        }

        .stats-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .stats-card {
            background: linear-gradient(90deg, #d6e8f7, #b8d8f7);
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(140, 170, 200, 0.2);
            border: 2px solid #e8f4ff;
        }

        .stats-label {
            font-size: 16px;
            font-weight: 800;
            color: #2c527a;
            letter-spacing: 1px;
        }

        .stats-number {
            font-size: 24px;
            font-weight: 800;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stats-number span { font-size: 22px; }

        /* 第二栏：日历 */
        .calendar-card {
            background: #fdfbf7;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 4px 12px rgba(180, 160, 140, 0.15);
            border: 2px solid #f4ead9;
            position: relative;
            overflow: hidden;
        }
        
        .calendar-card::before {
            content: '✧ ✦ ✧';
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 20px;
            color: #f0e6d6;
            letter-spacing: 5px;
        }

        .calendar-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            position: relative;
        }

        .calendar-header .month-label {
            font-weight: 800;
            color: #4a3b32;
            font-size: 16px;
        }

        .calendar-nav-btn {
            position: absolute;
            background: transparent;
            border: none;
            width: 24px;
            height: 24px;
            font-size: 18px;
            cursor: pointer;
            color: #a68f7b;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #prevMonth { left: 0; }
        #nextMonth { right: 0; }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            text-align: center;
            font-size: 12px;
            color: #7a6b5d;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 2px;
        }

        .calendar-day {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 50%;
            color: #4a3b32;
        }

        .calendar-day.other-month { color: #d1c5b8; }
        
        .calendar-day.today {
            background: #b8d8f7;
            color: #fff;
            font-weight: 800;
            position: relative;
            box-shadow: 0 2px 6px rgba(140, 170, 200, 0.4);
        }
        .calendar-day.today::after {
            content: '🐾';
            position: absolute;
            font-size: 22px;
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }

        /* 通用 */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px;
            font-weight: 800;
            color: #5c4535;
            font-size: 18px;
        }
        .section-title .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sub-title {
            font-size: 14px; 
            color: #8c7661; 
            font-weight: 800; 
            margin: 12px 0 6px 6px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .task-item {
            background: #f7f0e3;
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 8px rgba(180, 160, 140, 0.08);
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .task-item.completed {
            background: #e9f5ee;
            border-color: #c5e8d3;
            opacity: 0.85;
        }
        
        .task-item.overdue {
            background: #fef5e6;
            border-color: #f5dcc0;
        }

        .task-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            font-size: 24px;
        }

        .task-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-name {
            font-weight: 800;
            font-size: 17px;
            color: #33261d;
            word-break: break-word;
        }

        .task-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .tag-green { background: #c3e6cb; color: #2b6a3d; } 
        .tag-purple { background: #e2d4f0; color: #5a3d77; } 
        .tag-pink { background: #f5c6cb; color: #8a3a44; } 
        .tag-blue { background: #cce5ff; color: #2b4e7a; } 
        .tag-orange { background: #ffe5b4; color: #8a632b; } 
        .tag-date { background: #e0e0e0; color: #666; }
        .tag-today { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .tag-deadline { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }

        .task-check {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #d1c5b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
            background: #fff;
        }
        .task-item.completed .task-check {
            background: #72c293;
            border-color: #72c293;
        }

        .task-actions {
            display: flex;
            gap: 4px;
            margin-left: 4px;
        }
        .icon-btn {
            background: #fff;
            border: 1px solid #e8dcc8;
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #8c7661;
            font-size: 16px;
        }

        .overdue-badge {
            background: #ff9800;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .btn-outline {
            background: #fff;
            border: 2px solid #f0e6d6;
            color: #8c7661;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .btn-sm { padding: 6px 12px; font-size: 13px; }

        .hidden { display: none !important; }

        /* 考试任务专属 */
        .exam-item {
            background: #fdfbf7;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 12px;
            border: 1px solid #f0e6d6;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(180, 160, 140, 0.08);
        }
        .exam-score-input {
            width: 90px;
            padding: 8px;
            border-radius: 12px;
            border: 2px solid #f0e6d6;
            text-align: center;
            font-weight: 800;
            font-size: 15px;
            color: #4a3b32;
            outline: none;
            background: #fff;
            transition: 0.2s;
        }
        .exam-score-input:focus { border-color: #d48a3d; }
        .exam-score-input:disabled {
            background: #f0e6d6;
            color: #a68f7b;
            cursor: not-allowed;
            border-color: transparent;
        }
        .exam-stars {
            font-weight: 800;
            font-size: 15px;
            color: #d48a3d;
        }
        .exam-stars.zero { color: #a68f7b; }

        /* 底部导航 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fdfbf7;
            padding: 12px 16px;
            display: flex;
            justify-content: space-around;
            border-top: 2px solid #f4ead9;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            z-index: 100;
            box-shadow: 0 -4px 12px rgba(180, 160, 140, 0.1);
        }
        .bottom-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: #a68f7b;
            background: transparent;
            border: none;
            gap: 4px;
            cursor: pointer;
        }
        .bottom-btn span { font-size: 22px; }
        .bottom-btn.active { color: #d48a3d; }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(74, 59, 50, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #fdfbf7;
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 2px solid #f4ead9;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { font-size: 20px; margin-bottom: 20px; color: #4a3b32; text-align: center; font-weight: 800;}
        .modal-content label { font-size: 14px; font-weight: 700; color: #6b5b4e; margin-bottom: 6px; display: block; }
        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #f0e6d6;
            border-radius: 16px;
            font-size: 15px;
            margin-bottom: 16px;
            background: #fff;
            outline: none;
            color: #4a3b32;
            font-weight: 600;
        }
        .modal-content input:focus, .modal-content select:focus { border-color: #d48a3d; }
        .modal-actions { display: flex; gap: 12px; margin-top: 8px; }
        .modal-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-cancel { background: #f0e6d6; color: #8c7661; }
        .btn-confirm { background: #d48a3d; color: white; }
        .btn-danger { background: #e57373; color: white; }

        /* Toast */
        .toast-container { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: none; }
        .toast {
            background: rgba(74, 59, 50, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            animation: dropDown 0.3s ease;
            backdrop-filter: blur(4px);
        }
        @keyframes dropDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 大屏 / iPad 横屏适配 --- */
        @media (min-width: 900px) {
            body {
                padding: 24px 24px 90px;
            }
            .app-header {
                max-width: 1200px;
                width: 100%;
                margin: 0 auto 20px auto;
            }
            .layout-container {
                flex-direction: row;
                align-items: flex-start;
                max-width: 1200px;
                width: 100%;
                margin: 0 auto;
            }
            .left-panel {
                flex: 0 0 320px;
                position: sticky;
                top: 24px;
            }
            .right-panel {
                flex: 1;
                min-width: 0;
            }
            /* 右侧任务列表变为两列网格 */
            #inSchoolGroups, #outSchoolGroups {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
            /* 为了大屏内部分组标题正常跨越两列 */
            .sub-title {
                grid-column: span 2;
                font-size: 15px;
                border-bottom: 2px solid #f0e6d6;
                padding-bottom: 6px;
                margin-top: 16px;
            }
            #overdueTaskList {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            #extraTaskList {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .bottom-bar {
                max-width: 800px;
                margin: 0 auto;
                border-radius: 40px 40px 0 0;
                border: 2px solid #f4ead9;
                border-bottom: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <button class="header-btn" id="btnChildMode">🦊 儿童模式</button>
        <button class="header-btn" id="btnAdminMode">🗝️ 管理员</button>
        <button class="header-btn" id="exportCsvBtn">☁️ 导出CSV</button>
    </div>

    <div class="layout-container">
        <!-- 左侧面板：资料、日历、额外任务 -->
        <div class="left-panel">
            <!-- 第一栏：头像+名字 | 星值统计 -->
            <div class="profile-stats-bar">
                <div class="profile-card">
                    <div class="avatar-container">
                        <div class="avatar" id="avatarDisplay">小</div>
                    </div>
                    <div class="profile-name" id="profileName">小朋友</div>
                    <button class="edit-profile-btn hidden" id="editProfileBtn">编辑资料</button>
                </div>
                <div class="stats-group">
                    <div class="stats-card">
                        <span class="stats-label">今日获得</span>
                        <span class="stats-number" id="todayStars">0<span>🌟</span></span>
                    </div>
                    <div>
                        <div class="stats-card" style="background: linear-gradient(90deg, #e2f0f9, #d1e5f7);">
                            <span class="stats-label">本月获得</span>
                            <span class="stats-number" id="monthStars">0<span>🌟</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 第二栏：月历 -->
            <div class="calendar-card">
                <div class="calendar-header">
                    <button class="calendar-nav-btn" id="prevMonth">‹</button>
                    <span class="month-label" id="calendarMonth">2026年11月</span>
                    <button class="calendar-nav-btn" id="nextMonth">›</button>
                </div>
                <div class="calendar-weekdays">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <!-- 额外任务 (放左侧以平衡高度) -->
            <div class="section-title" style="margin-top:0;">
                <div class="title-left"><span>🎁 额外任务</span></div>
                <button class="btn-outline btn-sm hidden" id="addExtraBtn">+ 新增额外</button>
            </div>
            <div id="extraTaskList" class="task-list"></div>
        </div>

        <!-- 右侧面板：核心任务列表 -->
        <div class="right-panel">
            <!-- 校内任务 -->
            <div class="section-title" style="margin-top:0;">
                <div class="title-left">
                    <span>🏫 校内任务</span>
                    <span id="inSchoolCountBadge" style="font-size:13px; background:#f0e6d6; color:#8c7661; padding:2px 8px; border-radius:10px;">0项</span>
                </div>
                <button class="btn-outline btn-sm" id="addInSchoolBtn">+ 新增</button>
            </div>
            <div id="inSchoolGroups"></div>

            <!-- 校外任务 -->
            <div class="section-title" style="margin-top:24px;">
                <div class="title-left">
                    <span>🏫 校外任务</span>
                    <span id="outSchoolCountBadge" style="font-size:13px; background:#f0e6d6; color:#8c7661; padding:2px 8px; border-radius:10px;">0项</span>
                </div>
                <button class="btn-outline btn-sm" id="addOutSchoolBtn">+ 新增</button>
            </div>
            <div id="outSchoolGroups"></div>

            <!-- 考试任务 -->
            <div class="section-title" style="margin-top:24px;">
                <div class="title-left"><span>📝 考试任务</span></div>
                <button class="btn-outline btn-sm" id="addExamBtn">+ 新增考试</button>
            </div>
            <div id="examTaskList"></div>

            <!-- 未完成任务 -->
            <div class="section-title" style="margin-top:24px;">
                <div class="title-left" style="font-size:16px;"><span>⏳ 未完成任务</span></div>
                <span id="overdueCountBadge" style="font-size:13px; background:#f0e6d6; color:#8c7661; padding:2px 8px; border-radius:10px;">0项</span>
            </div>
            <div id="overdueTaskList" class="task-list"></div>

            <!-- 任务库管理（仅管理员） -->
            <div id="adminTaskLibrarySection" class="hidden">
                <div class="section-title" style="margin-top:24px;">
                    <span>📚 任务库管理</span>
                    <button class="btn-outline btn-sm" id="openCreateTaskBtn">+ 新增任务</button>
                </div>
                <div class="flex-row" style="display:flex; gap:8px; margin-bottom:12px;">
                    <button class="btn-outline btn-sm" id="ocrBtn">📷 拍照 OCR</button>
                    <button class="btn-outline btn-sm" id="resetStarsBtn" style="color:#cd5c5c; border-color:#f5c6cb;">🔄 重置星值</button>
                </div>
                <div id="taskLibraryList" class="task-list"></div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-bar">
        <button class="bottom-btn active" id="bottomHome"><span>🏠</span>今日</button>
        <button class="bottom-btn" id="bottomStats"><span>📊</span>统计</button>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <div id="modalRoot"></div>

    <script>
        // ==========================================
        // Supabase 配置
        const SUPABASE_URL = 'https://skgxcnnagfgwfrccwwrx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_t96OWboqHhMc4CSJLEuQXQ_TE_xIMdw';
        // ==========================================

        let supabaseClient = null;
        if (SUPABASE_URL && SUPABASE_URL !== '替换为您的_SUPABASE_URL') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            console.warn('尚未配置 Supabase，当前将使用本地存储模式。');
        }

        (function() {
            const STORAGE_KEY = 'star_task_app_v1';
            const ADMIN_PASSWORD = '111';

            function getBeijingNow() {
                const now = new Date();
                const utc = now.getTime() + now.getTimezoneOffset() * 60000;
                return new Date(utc + 8 * 3600000);
            }
            function getBeijingDateStr() {
                const bj = getBeijingNow();
                return `${bj.getFullYear()}-${String(bj.getMonth()+1).padStart(2,'0')}-${String(bj.getDate()).padStart(2,'0')}`;
            }

            const defaultTasks = [
                { id: 't1', name: '习题册', reward: 0, daily: true, note: '', category: '校内任务', subject: '语文', startDate: '2026-11-01', endDate: '' },
                { id: 't2', name: '口算', reward: 0, daily: true, note: '', category: '校内任务', subject: '数学', startDate: '2026-11-01', endDate: '' },
                { id: 't3', name: '英语阅读', reward: 0, daily: true, note: '', category: '校内任务', subject: '英语', startDate: '2026-11-01', endDate: '' },
                { id: 't4', name: '口语练习', reward: 0, daily: true, note: '', category: '校外任务', subject: '口语', startDate: '2026-11-01', endDate: '' },
                { id: 't5', name: '新东方数学', reward: 0, daily: false, note: '', category: '校外任务', subject: '新东方', startDate: '2026-11-01', endDate: '2026-12-31' }
            ];

            const defaultState = {
                tasks: [...defaultTasks],
                checkins: [],
                exams: [],
                extraTasks: [],
                profile: { name: 'HEIDI', avatar: '' }
            };

            function loadStateLocal() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try { 
                        const parsed = JSON.parse(stored);
                        parsed.tasks = (parsed.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        if (!parsed.profile) parsed.profile = { name: 'HEIDI', avatar: '' };
                        if (!parsed.exams) parsed.exams = [];
                        if (!parsed.extraTasks) parsed.extraTasks = [];
                        if (!parsed.checkins) parsed.checkins = [];
                        return parsed;
                    } catch (e) {}
                }
                return JSON.parse(JSON.stringify(defaultState));
            }

            let state = loadStateLocal();
            let currentRole = 'child';
            let isAdminAuthenticated = false;

            const bjInit = getBeijingNow();
            let calendarYear = bjInit.getFullYear();
            let calendarMonth = bjInit.getMonth();

            let saveTimeout = null;
            let isSyncingFromCloud = false;

            function saveState() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

                if (supabaseClient && !isSyncingFromCloud) {
                    if (saveTimeout) clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(async () => {
                        try {
                            const payload = JSON.parse(JSON.stringify(state));
                            await supabaseClient
                                .from('app_state')
                                .upsert({ id: 1, state_data: payload, updated_at: new Date().toISOString() });
                            console.log('☁️ 云端数据同步成功');
                        } catch (error) {
                            console.error('☁️ 云端同步失败:', error);
                        }
                    }, 800);
                }
            }

            async function fetchCloudState() {
                if (!supabaseClient) return;
                try {
                    const { data, error } = await supabaseClient
                        .from('app_state')
                        .select('state_data')
                        .eq('id', 1)
                        .single();
                    
                    if (error) throw error;
                    
                    if (data && data.state_data && Object.keys(data.state_data).length > 0) {
                        isSyncingFromCloud = true;
                        state = data.state_data;
                        
                        state.tasks = (state.tasks || []).map(t => {
                            let cat = t.category;
                            if (cat === '校内作业') cat = '校内任务';
                            if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                            let sub = t.subject || '其它';
                            if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                            return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                        });
                        
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        renderAll();
                        isSyncingFromCloud = false;
                    }
                } catch (error) {
                    console.error('☁️ 获取云端数据失败:', error);
                }
            }

            function setupRealtime() {
                if (!supabaseClient) return;
                supabaseClient
                    .channel('app_state_changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
                        const newState = payload.new.state_data;
                        if (newState && Object.keys(newState).length > 0) {
                            isSyncingFromCloud = true;
                            state = newState;
                            state.tasks = (state.tasks || []).map(t => {
                                let cat = t.category;
                                if (cat === '校内作业') cat = '校内任务';
                                if (cat === '校外作业' || cat === '课外辅导') cat = '校外任务';
                                let sub = t.subject || '其它';
                                if (!t.startDate) t.startDate = t.createdDate || '2026-11-01';
                                return { ...t, category: cat, subject: sub, endDate: t.endDate || '' };
                            });
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                            renderAll();
                            setTimeout(() => { isSyncingFromCloud = false; }, 100);
                        }
                    })
                    .subscribe((status) => {
                        console.log('☁️ Realtime 状态:', status);
                    });
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getExamStars(score) {
                if (score === null || score === undefined || score === '') return 0;
                const s = parseFloat(score);
                if (s >= 100) return 50;
                if (s >= 90) return 25;
                return 0;
            }

            function calcTodayStars() {
                const today = getBeijingDateStr();
                let sum = 0;
                state.checkins.forEach(c => {
                    if (c.date === today && c.isExtra) sum += (c.reward || 0);
                });
                state.exams.forEach(e => {
                    if (e.date === today) sum += getExamStars(e.score);
                });
                return sum;
            }

            function calcMonthStars() {
                const bj = getBeijingNow();
                const prefix = `${bj.getFullYear()}-${String(bj.getMonth()+1).padStart(2,'0')}`;
                const todayDate = bj.getDate();
                
                let extraSum = 0;
                let examSum = 0;
                
                state.checkins.forEach(c => {
                    if (c.date.startsWith(prefix) && c.isExtra) extraSum += (c.reward || 0);
                });
                
                state.exams.forEach(e => {
                    if (e.date.startsWith(prefix)) examSum += getExamStars(e.score);
                });
                
                const homeworkDates = new Set();
                state.checkins.forEach(c => {
                    if (!c.date.startsWith(prefix) || c.isExtra) return;
                    const task = state.tasks.find(t => t.id === c.taskId);
                    if (task && task.category === '校内任务') {
                        homeworkDates.add(c.date);
                    }
                });
                
                let isFullMonth = false;
                if (homeworkDates.size > 0) {
                    isFullMonth = true;
                    for (let i = 1; i <= todayDate; i++) {
                        const dStr = `${prefix}-${String(i).padStart(2,'0')}`;
                        if (!homeworkDates.has(dStr)) {
                            isFullMonth = false;
                            break;
                        }
                    }
                }
                
                const bonus = isFullMonth ? 20 : 0;
                return { total: extraSum + examSum + bonus, hasHomework: isFullMonth, extraSum, examSum, bonus };
            }

            function isTaskCheckedToday(taskId) {
                const today = getBeijingDateStr();
                return state.checkins.some(c => c.date === today && c.taskId === taskId && !c.isExtra);
            }

            // 判断任务今天是否应当展示在列表中，或者已经过期掉入未完成
            function canTaskCheck(task) {
                const today = getBeijingDateStr();
                const now = getBeijingNow();

                if (task.endDate) {
                    // 有结束时间：只要今天还没过结束日，就能打卡
                    const parts = task.endDate.split('-');
                    const deadline = new Date(parts[0], parts[1] - 1, parts[2]);
                    deadline.setHours(23, 59, 59, 999);
                    return now.getTime() <= deadline.getTime();
                } else {
                    // 无结束时间（当日任务/每日重复任务）：当天或次日06:00前可打卡
                    if (task.startDate === today) return true;
                    
                    // 如果任务有 daily 属性但没结束时间，意味着它是每日重复任务，今天永远有效
                    if (task.daily) return true;
                    
                    // 非每日重复且无结束时间，判断是否在次日 06:00 前
                    const parts = task.startDate.split('-');
                    const deadline = new Date(parts[0], parts[1] - 1, parts[2]);
                    deadline.setDate(deadline.getDate() + 1);
                    deadline.setHours(6, 0, 0, 0);
                    
                    return now.getTime() < deadline.getTime();
                }
            }

            // --- 渲染相关 ---
            function renderProfile() {
                const name = state.profile.name || 'HEIDI';
                const avatar = state.profile.avatar || '';
                const avatarEl = document.getElementById('avatarDisplay');
                if (avatar) {
                    avatarEl.style.backgroundImage = `url(${avatar})`;
                    avatarEl.textContent = '';
                } else {
                    avatarEl.style.backgroundImage = '';
                    avatarEl.textContent = name.charAt(0).toUpperCase();
                }
                document.getElementById('profileName').textContent = name;

                const editBtn = document.getElementById('editProfileBtn');
                if (currentRole === 'admin' && isAdminAuthenticated) {
                    editBtn.classList.remove('hidden');
                } else {
                    editBtn.classList.add('hidden');
                }
            }

            function renderCalendar() {
                const monthLabel = document.getElementById('calendarMonth');
                monthLabel.textContent = `${calendarYear}年${calendarMonth + 1}月`;

                const grid = document.getElementById('calendarGrid');
                const firstDay = new Date(calendarYear, calendarMonth, 1);
                const startWeekday = firstDay.getDay();
                const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
                const prevMonthDays = new Date(calendarYear, calendarMonth, 0).getDate();

                const bj = getBeijingNow();
                const todayY = bj.getFullYear();
                const todayM = bj.getMonth();
                const todayD = bj.getDate();

                const cells = [];
                for (let i = 0; i < startWeekday; i++) {
                    cells.push({ day: prevMonthDays - startWeekday + 1 + i, otherMonth: true, isToday: false });
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    cells.push({ day: d, otherMonth: false, isToday: (calendarYear === todayY && calendarMonth === todayM && d === todayD) });
                }
                let nextDay = 1;
                while (cells.length % 7 !== 0) {
                    cells.push({ day: nextDay++, otherMonth: true, isToday: false });
                }

                grid.innerHTML = cells.map(c => `
                    <div class="calendar-day ${c.otherMonth ? 'other-month' : ''} ${c.isToday ? 'today' : ''}">${c.day}</div>
                `).join('');
            }

            function getTagClass(text) {
                if (text === '校内任务') return 'tag-green';
                if (text === '校外任务') return 'tag-orange';
                if (text === '语文') return 'tag-purple';
                if (text === '数学') return 'tag-pink';
                if (text === '英语') return 'tag-blue';
                if (text === '口语') return 'tag-green';
                if (text === '新东方') return 'tag-orange';
                return 'tag-green';
            }

            function renderTaskGroup(containerId, category, countBadgeId) {
                const container = document.getElementById(containerId);
                if (!container) return;

                const today = getBeijingDateStr();
                const todayCheckTaskIds = new Set(state.checkins.filter(c => c.date === today && !c.isExtra).map(c => c.taskId));
                
                const tasks = state.tasks.filter(task => {
                    if (task.category !== category) return false;
                    if (todayCheckTaskIds.has(task.id)) return true;
                    if (task.startDate > today) return false;
                    if (!canTaskCheck(task)) return false;
                    return true;
                });

                if (countBadgeId) {
                    const badge = document.getElementById(countBadgeId);
                    if (badge) badge.textContent = `${tasks.length}项`;
                }

                if (tasks.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center;padding:20px;color:#a68f7b;background:#fdfbf7;border-radius:20px;font-weight:700;">暂无${category}</div>`;
                    return;
                }

                const groups = {};
                tasks.forEach(t => {
                    const sub = t.subject || '其它';
                    if (!groups[sub]) groups[sub] = [];
                    groups[sub].push(t);
                });

                let html = '';
                let sortedSubjects = Object.keys(groups);
                if (category === '校内任务') {
                    const order = { '语文': 1, '数学': 2, '英语': 3, '其它': 4 };
                    sortedSubjects.sort((a,b) => (order[a]||99) - (order[b]||99));
                } else {
                    sortedSubjects.sort();
                }

                sortedSubjects.forEach(sub => {
                    html += `<div class="sub-title">📖 ${sub}</div>`;
                    html += `<div class="task-list" style="display:grid; grid-template-columns:1fr; gap:12px;">`;
                    groups[sub].forEach(task => {
                        html += renderTaskItem(task, isTaskCheckedToday(task.id), false);
                    });
                    html += `</div>`;
                });

                container.innerHTML = html;
            }

            function renderInSchoolTasks() {
                renderTaskGroup('inSchoolGroups', '校内任务', 'inSchoolCountBadge');
            }

            function renderOutSchoolTasks() {
                renderTaskGroup('outSchoolGroups', '校外任务', 'outSchoolCountBadge');
            }

            function renderTaskItem(task, completed, overdue) {
                const showAdminActions = (currentRole === 'admin' && isAdminAuthenticated);
                const today = getBeijingDateStr();
                
                let tagsHtml = '';
                if (task.subject) {
                    tagsHtml += `<span class="tag ${getTagClass(task.subject)}">${task.subject}</span>`;
                }
                if (task.note) {
                    tagsHtml += `<span class="tag tag-orange">📝 ${escapeHtml(task.note)}</span>`;
                }
                if (task.daily) {
                    tagsHtml += `<span class="tag tag-orange" style="background:#fce4ec; color:#c2185b;">🔁 每日</span>`;
                }
                
                if (overdue) {
                    tagsHtml += `<span class="tag tag-date" style="background:#ffebee; color:#c62828;">📅 原定：${task.startDate}${task.endDate ? ' 至 ' + task.endDate : ''}</span>`;
                } else {
                    if (task.endDate) {
                        tagsHtml += `<span class="tag tag-deadline">📅 截止：${task.endDate}</span>`;
                    } else {
                        if (task.startDate === today || task.daily) {
                            tagsHtml += `<span class="tag tag-today">📅 今日任务</span>`;
                        } else {
                            tagsHtml += `<span class="tag tag-date">📅 ${task.startDate}</span>`;
                        }
                    }
                }

                const checkHtml = overdue 
                    ? `<span class="overdue-badge">未完成</span>` 
                    : `<div class="task-check" data-action="toggle-check" data-task-id="${task.id}">${completed ? '✓' : ''}</div>`;

                return `
                    <div class="task-item ${completed ? 'completed' : ''} ${overdue ? 'overdue' : ''}" data-task-id="${task.id}">
                        <div class="task-icon">${task.category === '校内任务' ? '📚' : '🏫'}</div>
                        <div class="task-info">
                            <div class="task-name">${escapeHtml(task.name)}</div>
                            <div class="task-meta">
                                ${tagsHtml}
                            </div>
                        </div>
                        ${showAdminActions ? `
                        <div class="task-actions">
                            <button class="icon-btn" data-action="edit-task" data-task-id="${task.id}">📝</button>
                        </div>` : ''}
                        ${checkHtml}
                    </div>
                `;
            }

            function renderExtraTasks() {
                const container = document.getElementById('extraTaskList');
                if (!container) return;
                
                const today = getBeijingDateStr();
                const todayExtras = state.extraTasks.filter(t => t.createdDate === today);
                
                if (todayExtras.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center;padding:20px;color:#a68f7b;background:#fdfbf7;border-radius:20px;font-weight:700;">暂无额外任务</div>`;
                    return;
                }
                
                container.innerHTML = todayExtras.map(task => {
                    const completed = state.checkins.some(c => c.date === today && c.taskId === task.id && c.isExtra);
                    return `
                        <div class="task-item ${completed ? 'completed' : ''}">
                            <div class="task-icon">🎁</div>
                            <div class="task-info">
                                <div class="task-name">${escapeHtml(task.name)}</div>
                                <div class="task-meta">
                                    <span class="tag tag-orange">额外任务 ⭐${task.reward}</span>
                                    <span class="tag tag-date">📅 ${task.createdDate}</span>
                                </div>
                            </div>
                            ${currentRole === 'admin' && isAdminAuthenticated ? `
                            <div class="task-actions">
                                <button class="icon-btn" data-action="delete-extra" data-extra-id="${task.id}" style="color:#cd5c5c;">🗑️</button>
                            </div>` : ''}
                            <div class="task-check" data-action="toggle-extra" data-extra-id="${task.id}">${completed ? '✓' : ''}</div>
                        </div>
                    `;
                }).join('');
            }

            function renderExams() {
                const container = document.getElementById('examTaskList');
                if (!container) return;
                
                if (state.exams.length === 0) {
                    container.innerHTML = `<div style="text-align:center;padding:20px;color:#a68f7b;background:#fdfbf7;border-radius:20px;font-weight:700;">暂无考试记录</div>`;
                    return;
                }
                
                const sortedExams = [...state.exams].sort((a,b) => b.date.localeCompare(a.date));
                
                container.innerHTML = sortedExams.map(exam => {
                    const stars = exam.score !== null ? getExamStars(exam.score) : 0;
                    const isZero = stars === 0;
                    const starText = exam.score !== null ? `获得 ${stars} 🌟` : '未录入';
                    
                    const canEditScore = (currentRole === 'admin' && isAdminAuthenticated) || (exam.score === null);

                    const scoreHtml = canEditScore
                        ? `<input type="number" step="0.5" min="0" max="100" class="exam-score-input" data-exam-id="${exam.id}" value="${exam.score !== null ? exam.score : ''}" placeholder="输入分数">`
                        : `<span style="font-weight:800; color:#4a3b32; font-size:16px; margin-left:4px;">${exam.score}分</span>`;
                        
                    return `
                        <div class="exam-item">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div style="font-weight:800; font-size:16px; color:#33261d; display:flex; align-items:center; gap:8px;">
                                    <span>📝 ${escapeHtml(exam.name)}</span>
                                </div>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span class="exam-stars ${isZero ? 'zero' : ''}">${starText}</span>
                                    <span style="font-size:12px; color:#a68f7b; font-weight:700;">${exam.date}</span>
                                </div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
                                <div>${scoreHtml}</div>
                                ${currentRole === 'admin' && isAdminAuthenticated ? `
                                <button class="icon-btn" data-action="delete-exam" data-exam-id="${exam.id}" style="color:#cd5c5c; width:32px; height:32px; font-size:14px;">删除</button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            function renderOverdueTasks() {
                const container = document.getElementById('overdueTaskList');
                if (!container) return;

                const today = getBeijingDateStr();
                const todayCheckTaskIds = new Set(state.checkins.filter(c => c.date === today && !c.isExtra).map(c => c.taskId));

                // 过滤：未到开始时间跳过；已打卡跳过；未过期跳过
                const overdueTasks = state.tasks.filter(task => {
                    if (todayCheckTaskIds.has(task.id)) return false;
                    if (task.startDate > today) return false;
                    return !canTaskCheck(task);
                });

                document.getElementById('overdueCountBadge').textContent = `${overdueTasks.length}项`;

                if (overdueTasks.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center;padding:20px;color:#a68f7b;background:#fdfbf7;border-radius:20px;font-weight:700;">🎉 全部完成啦！</div>`;
                    return;
                }

                overdueTasks.sort((a,b) => b.startDate.localeCompare(a.startDate));

                container.innerHTML = overdueTasks.map(task => {
                    let tagsHtml = `
                        <span class="tag ${getTagClass(task.category)}">${task.category}</span>
                        ${task.subject ? `<span class="tag ${getTagClass(task.subject)}">${task.subject}</span>` : ''}
                    `;
                    
                    if (task.daily) {
                        tagsHtml += `<span class="tag tag-orange" style="background:#fce4ec; color:#c2185b;">🔁 每日</span>`;
                    }

                    let dateLabel = '';
                    if (task.endDate) {
                        dateLabel = `📅 ${task.startDate} 至 ${task.endDate}`;
                    } else {
                        dateLabel = `📅 任务日：${task.startDate}`;
                    }
                    tagsHtml += `<span class="tag tag-date" style="background:#ffebee; color:#c62828;">${dateLabel}</span>`;

                    return `
                        <div class="task-item overdue">
                            <div class="task-icon">${task.category === '校内任务' ? '📚' : '🏫'}</div>
                            <div class="task-info">
                                <div class="task-name">${escapeHtml(task.name)}</div>
                                <div class="task-meta">
                                    ${tagsHtml}
                                </div>
                            </div>
                            <span class="overdue-badge">未完成</span>
                        </div>
                    `;
                }).join('');
            }

            function renderTaskLibrary() {
                const container = document.getElementById('taskLibraryList');
                if (!container) return;
                if (state.tasks.length === 0) {
                    container.innerHTML = `<div style="text-align:center;padding:20px;color:#a68f7b;font-weight:700;">暂无任务</div>`;
                    return;
                }
                container.innerHTML = state.tasks.map(task => `
                    <div class="task-item" style="background:#fff; border:1px solid #f0e6d6;">
                        <div class="task-info">
                            <div class="task-name">${escapeHtml(task.name)} ${task.daily ? '🔁' : ''}</div>
                            <div class="task-meta">

            function showToast(message, isSuccess = true) {
                const container = document.getElementById('toastContainer');

                toast.innerHTML = `${isSuccess ? '✨' : '⚠️'} ${escapeHtml(message)}`;
                container.appendChild(toast);
                setTimeout(() => {

            function toggleTaskCheck(taskId) {
                const today = getBeijingDateStr();
                const task = state.tasks.find(t => t.id === taskId);
                if (!task) return;
                
                if (!canTaskCheck(task) && !isTaskCheckedToday(taskId)) {
                    showToast('该任务已过期无法打卡', false);
                    return;
                }

                const existingIndex = state.checkins.findIndex(c => c.date === today && c.taskId === taskId && !c.isExtra);
                if (existingIndex !== -1) {
                    state.checkins.splice(existingIndex, 1);
                    showToast(`取消完成`);
                } else {
                    state.checkins.push({ date: today, taskId, timestamp: Date.now() });
                    showToast(`完成打卡`);
                }
                saveState();
                renderAll();
            }

            function toggleExtraCheck(extraId) {
                const today = getBeijingDateStr();
                const extraTask = state.extraTasks.find(t => t.id === extraId);
                if (!extraTask) return;

                const existingIndex = state.checkins.findIndex(c => c.date === today && c.taskId === extraId && c.isExtra);
                if (existingIndex !== -1) {
                    state.checkins.splice(existingIndex, 1);
                    showToast(`取消额外任务`);
                } else {
                    state.checkins.push({ date: today, taskId: extraId, reward: extraTask.reward, timestamp: Date.now(), isExtra: true });
                    showToast(`完成额外任务 +${extraTask.reward}星`);
                }
                saveState();
                renderAll();
            }

            function showModal({ title, content, contentHTML, confirmText = '确认', cancelText = '取消', danger = false, onConfirm, onCancel }) {
                const modalRoot = document.getElementById('modalRoot');
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'modal-content';
                
                const cancelBtnHtml = cancelText 
                    ? `<button class="btn-cancel" id="modalCancel">${cancelText}</button>` 
                    : '';
                
                const actionStyle = cancelText ? '' : 'width: 100%;';

                modal.innerHTML = `
                    <h3>${escapeHtml(title)}</h3>
                    <div id="modalBody">${contentHTML || `<p style="margin-bottom:20px; color:#6b5b4e; font-weight:600;">${escapeHtml(content || '')}</p>`}</div>
                    <div class="modal-actions">
                        ${cancelBtnHtml}
                        <button class="${danger ? 'btn-danger' : 'btn-confirm'}" id="modalConfirm" style="${actionStyle}">${confirmText}</button>
                    </div>
                `;
                overlay.appendChild(modal);
                modalRoot.appendChild(overlay);

                const closeModal = () => overlay.remove();
                
                const cancelBtn = document.getElementById('modalCancel');
                if (cancelBtn) {
                    cancelBtn.onclick = () => {
                        if (onCancel && onCancel() === false) return;
                        closeModal();
                    };
                }
                
                document.getElementById('modalConfirm').onclick = () => {
                    if (onConfirm && onConfirm() === false) return;
                    closeModal();
                };
                overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
            }

                setTimeout(() => {
                    const fileInput = document.getElementById('avatarFileInput');
                    const preview = document.getElementById('avatarPreview');
                    if (!fileInput) return;
                    fileInput.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const img = new Image();
                            img.onload = () => {
                                const maxSize = 200;
                                let w = img.width, h = img.height;
                                if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
                                else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
                                const canvas = document.createElement('canvas');
                                canvas.width = w; canvas.height = h;
                                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                pendingAvatar = canvas.toDataURL('image/jpeg', 0.85);
                                preview.style.backgroundImage = `url(${pendingAvatar})`;
                                preview.textContent = '';
                            };
                            img.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }, 0);
            }

            function openOcrModal() {
                if (!(currentRole === 'admin' && isAdminAuthenticated)) return;
                const today = getBeijingDateStr();
                
                showModal({
                    title: '拍照 / 相册 OCR 识别',
                    contentHTML: `
                        <div style="margin-bottom:16px; text-align:center;">
                            <label class="btn-outline" style="display:inline-flex; cursor:pointer; padding:10px 20px; font-size:15px;">
                                📷 选择图片 / 拍照
                                <input type="file" accept="image/*" id="ocrFileInput" style="display:none;">
                            </label>
                            <div id="ocrStatus" style="margin-top:10px; font-size:13px; color:#a68f7b; font-weight:700;"></div>
                        </div>
                        <div id="ocrPreviewContainer" style="display:none; margin-bottom:16px; text-align:center;">
                            <img id="ocrPreviewImg" style="max-width:100%; max-height:150px; border-radius:12px; border:2px solid #f0e6d6;">
                        </div>
                        <label>识别文字（可修改）</label>
                        <textarea id="ocrResult" rows="4" placeholder="识别结果会显示在这里..."></textarea>
                    `,
                    confirmText: '生成任务',
                    onConfirm: () => {
                        const text = document.getElementById('ocrResult').value.trim();
                        if (!text) { showToast('请先识别或输入文字', false); return false; }
                        state.tasks.push({
                            id: 'task_ocr_' + Date.now(),
                            name: text, daily: true, note: 'OCR生成', category: '校内任务', subject: '其它', startDate: today, endDate: ''
                        });
                        saveState();
                        renderAll();
                        showToast('已根据识别结果生成任务');
                    }
                });

                setTimeout(() => {
                    const fileInput = document.getElementById('ocrFileInput');
                    const statusEl = document.getElementById('ocrStatus');
                    const previewContainer = document.getElementById('ocrPreviewContainer');
                    const previewImg = document.getElementById('ocrPreviewImg');
                    const resultEl = document.getElementById('ocrResult');

                    if (!fileInput) return;

                    fileInput.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            previewContainer.style.display = 'block';
                            previewImg.src = ev.target.result;
                        };
                        reader.readAsDataURL(file);

                        statusEl.innerHTML = '⏳ 正在识别中，请稍候...（首次加载语言包可能需要几秒）';
                        resultEl.value = '';
                        
                        try {
                            const { data: { text } } = await Tesseract.recognize(
                                file,
                                'chi_sim+eng', 
                                { logger: m => {
                                    if (m.status === 'recognizing text') {
                                        statusEl.innerHTML = `⏳ 识别进度：${Math.round(m.progress * 100)}%`;
                                    }
                                }}
                            );
                            const cleanText = text.trim().replace(/\s+/g, ' ');
                            resultEl.value = cleanText;
                            statusEl.innerHTML = '✅ 识别完成，请核对文字';
                            if (!cleanText) {
                                statusEl.innerHTML = '⚠️ 未能识别出文字，请重试或手动输入';
                            }
                        } catch (error) {
                            console.error('OCR Error:', error);
                            statusEl.innerHTML = '❌ 识别失败，请检查网络或重试';
                        }
                    });
                }, 100);
            }

                        toggleTaskCheck(target.dataset.taskId);

                        toggleExtraCheck(target.dataset.extraId);

                        if (currentRole === 'admin' && isAdminAuthenticated) {
                            const task = state.tasks.find(t => t.id === target.dataset.taskId);

                        }
                    } else if (action === 'delete-task') {
                        if (currentRole === 'admin' && isAdminAuthenticated) deleteTaskConfirm(target.dataset.taskId);

                        if (currentRole === 'admin' && isAdminAuthenticated) {

                    const rows = [['日期', '类型', '名称', '详情/分数', '获得星值']];

                            rows.push([c.date, '额外任务', t ? t.name : '已删除', '-', c.reward + '星']);
                        } else {
                            const t = state.tasks.find(x => x.id === c.taskId);
                            rows.push([c.date, '日常打卡', t ? t.name : '已删除', '-', '见月度奖励']);
                        }
                    });
                    state.exams.forEach(e => {
                        if (e.score !== null) {
                            rows.push([e.date, '考试', e.name, e.score + '分', getExamStars(e.score)]);
                        }
                    });
                    const csv = rows.map(r => r.join(',')).join('\n');
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv'}));
                    link.download = `星值记录_${getBeijingDateStr()}.csv`;
                    link.click();
                    showToast('CSV 已导出');
                });

                document.getElementById('bottomHome').addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                
                document.getElementById('bottomStats').addEventListener('click', () => {
                    const monthData = calcMonthStars();
                    const isAdmin = (currentRole === 'admin' && isAdminAuthenticated);
                    
                    let html = `
                        <div style="padding: 10px;">
                            <div style="font-size:18px; font-weight:800; color:#4a3b32; margin-bottom:12px; display:flex; justify-content:space-between;">
                                <span>今日获得：</span>
                                <span style="color:#d48a3d;">${calcTodayStars()} 🌟</span>
                            </div>
                            <div style="font-size:18px; font-weight:800; color:#4a3b32; margin-bottom:12px; display:flex; justify-content:space-between;">
                                <span>本月累计：</span>
                                <span style="color:#d48a3d;">${monthData.total} 🌟</span>
                            </div>
                            <div style="font-size:18px; font-weight:800; color:#4a3b32; margin-bottom:12px; display:flex; justify-content:space-between;">
                                <span>本月奖励：</span>
                                <span style="color:#2e8b57;">${monthData.total} 元</span>
                            </div>
                        </div>
                    `;

                    if (isAdmin) {
                        showModal({
                            title: '📊 星值统计',
                            contentHTML: html,
                            confirmText: '知道了',
                            cancelText: '清零',
                            onCancel: () => {
                                setTimeout(() => {
                                    showModal({
                                        title: '⚠️ 清零确认',
                                        content: '确定要清空现有所有任务、打卡记录、额外任务和考试记录吗？清零后不影响后续新增。',
                                        confirmText: '确认',
                                        cancelText: '取消',
                                        danger: true,
                                        onConfirm: () => {
                                            state.tasks = [];
                                            state.checkins = [];
                                            state.extraTasks = [];
                                            state.exams = [];
                                            saveState();
                                            renderAll();
                                            showToast('已清空现有所有记录');
                                        }
                                    });
                                }, 50);
                            }
                        });
                    } else {
                        showModal({
                            title: '📊 星值统计',
                            contentHTML: html,
                            confirmText: '知道了',
                            cancelText: '' 
                        });
                    }
                });
            }

            function init() {
                if (!state.checkins) state.checkins = [];
                if (!state.exams) state.exams = [];
                if (!state.extraTasks) state.extraTasks = [];
                if (!state.profile) state.profile = { name: 'HEIDI', avatar: '' };
                
                bindEvents();
                renderAll();
                
                if (supabaseClient) {
                    fetchCloudState();
                    setupRealtime();
                }
            }

            init();
        })();
    </script>
</body>
</html>
